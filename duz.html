<!doctype html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Düz</title>
<meta name="theme-color" content="#ffffff">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DÜZ — süslenmeyi reddeden site.
   Beyaz zemin, Helvetica, solda alt alta düz metin menü, devasa resimler,
   11 piksellik künye. Saç çizgisi yok, kart yok, kutu yok, gölge yok.
   Tek tema: beyaz. Karanlık mod eklemek tam da bu tasarımın reddettiği şey.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --bg:     #ffffff;
  --ink:    #111111;
  --muted:  #555555;
  --faint:  #8e8e8e;
  --accent: #1B3FCC;          /* tek renk. aktif menü ve eser adı. başka hiçbir yerde. */

  --nav-w:  230px;
  --pad:    40px;
  --sans:   "Helvetica Neue", Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

h1, h2, h3, p, figure, ul, li, dl { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; max-width: 100%; }

a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.skip {
  position: fixed; top: 8px; left: 8px; z-index: 20;
  background: #fff; color: var(--ink); border: 1px solid var(--ink);
  padding: 8px 12px; font-size: 12px; transform: translateY(-200%);
}
.skip:focus-visible { transform: none; }

/* ── solda sabit metin menü ──────────────────────────────────────────────── */

#nav {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--nav-w);
  padding: var(--pad) 20px var(--pad) var(--pad);
  overflow-y: auto;
  background: var(--bg);
}
#nav .name {
  font-size: 21px; font-weight: 400; line-height: 1.2;
  color: var(--ink); margin-bottom: 30px; display: block;
}
#nav .name b { font-weight: 400; }
#nav ul { display: block; }
#nav li { margin-bottom: 9px; }
#nav a { font-size: 13px; color: var(--ink); }
#nav a.on { color: var(--accent); }
#nav .gap { height: 18px; }

/* ── içerik ──────────────────────────────────────────────────────────────── */

#main {
  margin-left: var(--nav-w);
  padding: var(--pad) var(--pad) 220px var(--pad);
  min-height: 100vh;
}

/* ── hamburger (yalnızca mobil) ──────────────────────────────────────────── */

#burger { display: none; }

@media (max-width: 760px) {
  /* Sol sütun kaybolur; adı solda, ikon sağda bir şerit kalır. */
  #nav {
    position: sticky; top: 0; z-index: 10;
    width: auto; height: auto; bottom: auto;
    padding: 18px 20px;
    background: var(--bg);
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px;
  }
  #nav .name { font-size: 20px; margin-bottom: 0; }

  #burger {
    display: block; flex: none;
    width: 44px; height: 44px; margin: -10px -10px 0 0;
    background: none; border: 0; padding: 10px; cursor: pointer;
  }
  #burger i {
    display: block; height: 2px; background: var(--ink);
    margin: 5px 0; transition: transform 220ms ease, opacity 180ms ease;
  }
  #burger[aria-expanded="true"] i:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  #burger[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
  #burger[aria-expanded="true"] i:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* Panel mutlak DEĞİL, akışın içinde: yapışkan şeritle çakışmıyor,
     kırpılmıyor, içeriği aşağı itiyor. `hidden` niteliği de kullanılmıyor —
     yayın ortamının reset'i onu !important ile gizleyip masaüstünde de
     menüyü yok ederdi. */
  #nav { flex-wrap: wrap; }
  #navlist {
    display: none;
    flex-basis: 100%; width: 100%;
    padding: 4px 0 14px;
    border-bottom: 1px solid rgba(17,17,17,.12);
  }
  #navlist.is-open { display: block; }
  #nav li { margin-bottom: 0; }
  #nav a { font-size: 16px; display: flex; align-items: center; min-height: 46px; }

  #main { margin-left: 0; padding: 22px 20px 120px; }

  /* Povey mobilde künyeyi büyütüyor — 11 px telefonda okunmuyor. */
  .cap { font-size: 13px; margin-top: 12px; }
  .work { margin-bottom: 72px; }

  #home .lead { padding-top: 0; }
  #home .side { text-align: left; font-size: 13px; }
  #home .lead .cap { text-align: left; }
}

/* ── eser bloğu ──────────────────────────────────────────────────────────── */

.work { margin-bottom: 120px; }
.work:last-child { margin-bottom: 0; }

.work .k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--tone);
  aspect-ratio: var(--ratio);
  width: min(100%, calc(86vh * var(--ratio)));
}
.k-lqip, .k-full { width: 100%; height: 100%; object-fit: cover; display: block; }
.k-full { position: absolute; inset: 0; opacity: 0; transition: opacity 400ms linear; }
.k-fig.is-loaded .k-full { opacity: 1; }

/* künye: 11 piksel, alt alta, sola dayalı. Povey'in yaptığı da tam olarak bu. */
.cap { margin-top: 14px; font-size: 11px; line-height: 1.55; color: var(--muted); }
.cap .t { color: var(--accent); text-transform: uppercase; }
.cap .avail { margin-top: 11px; }
.cap .avail.no { color: var(--faint); }

/* ── ana sayfa: tek eser, sağa dayalı duyurular ──────────────────────────── */

#home { display: grid; grid-template-columns: 1fr; gap: 40px; }
@media (min-width: 1000px) {
  #home { grid-template-columns: minmax(0, 1fr) 260px; align-items: end; }
}
#home .lead { padding-top: 22vh; }
#home .lead .k-fig { width: min(100%, calc(62vh * var(--ratio))); }
#home .side { text-align: right; font-size: 11px; line-height: 1.55; color: var(--muted); }
#home .side .blk { margin-bottom: 22px; }
#home .side .blk b { font-weight: 400; color: var(--ink); }
#home .lead .cap { text-align: left; }
@media (min-width: 1000px) {
  #home .lead .cap { text-align: right; }
}

/* ── metin sayfaları ─────────────────────────────────────────────────────── */

.page { max-width: 620px; padding-top: 4px; }
.page h2 { font-size: 13px; font-weight: 400; color: var(--accent); margin-bottom: 22px; }
.page p { font-size: 13px; line-height: 1.62; margin-bottom: 14px; color: var(--ink); }
.page .row {
  display: grid; grid-template-columns: 52px 1fr; gap: 14px;
  font-size: 12px; line-height: 1.55; margin-bottom: 10px; color: var(--muted);
}
.page .row b { font-weight: 400; color: var(--ink); }
.page .note {
  margin-top: 40px; font-size: 11px; line-height: 1.6; color: var(--faint);
  max-width: 560px;
}

.lede { font-size: 11px; color: var(--faint); margin-bottom: 34px; }

/* Dokunmatikte hedefler parmak boyunda olmalı — 13 px metin 19 px'lik bir
   satır demek, önerilen 44 px'in yarısından az. Görünüm değişmiyor, yalnızca
   tıklanabilir alan büyüyor.                                                */
@media (pointer: coarse) {
  #nav li { margin-bottom: 0; }
  #nav a { display: flex; align-items: center; min-height: 44px; }
  #nav .name { min-height: 0; }
  .page a, .cap a { display: inline-block; padding-block: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>

/* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      } else {
        /* Varsayılan AÇIK: sistemi karanlıkta olan ziyaretçi de krem zemin
           görsün. Sistem tercihine uymak yerine bilinçli bir karar —
           düğme yine duruyor, isteyen koyuya geçer. */
        document.documentElement.dataset.theme = 'light';
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();


document.documentElement.lang = 'tr';
const main = document.getElementById('main');

document.getElementById('navname').innerHTML =
  SITE.artist.name.split(' ')[0] + ' <b>' + SITE.artist.name.split(' ').slice(1).join(' ').toUpperCase() + '</b>';

/* ── menü ────────────────────────────────────────────────────────────────── */

const NAV = [
  { href: '/son', label: 'Son Resimler' },
  ...SITE.series.map(s => ({ href: '/seri/' + s.key, label: s.title })),
  { gap: true },
  { href: '/biyografi',   label: 'Biyografi' },
  { href: '/sergiler',    label: 'Sergiler' },
  { href: '/koleksiyon',  label: 'Koleksiyonlar' },
  { href: '/iletisim',    label: 'İletişim' },
];

{
  const ul = document.getElementById('navlist');
  NAV.forEach((n) => {
    const li = K.el('li');
    if (n.gap) { li.className = 'gap'; ul.appendChild(li); return; }
    const a = K.el('a', null, n.label);
    a.href = '#' + n.href;
    a.dataset.route = n.href;
    li.appendChild(a);
    ul.appendChild(li);
  });
}

function markNav(path) {
  document.querySelectorAll('#navlist a').forEach((a) => {
    a.classList.toggle('on', a.dataset.route === path);
  });
}

/* ── hamburger ───────────────────────────────────────────────────────────── */

const burger = document.getElementById('burger');
const navlist = document.getElementById('navlist');

function closeNav() {
  navlist.classList.remove('is-open');
  burger.setAttribute('aria-expanded', 'false');
}

burger.addEventListener('click', () => {
  const open = !navlist.classList.contains('is-open');
  navlist.classList.toggle('is-open', open);
  burger.setAttribute('aria-expanded', String(open));
  /* preventScroll şart: odaklanma sayfayı başlığın üstünden aşağı zıplatıyordu */
  if (open) navlist.querySelector('a').focus({ preventScroll: true });
});

/* bir bölüme gidince kapansın */
navlist.addEventListener('click', (e) => { if (e.target.closest('a')) closeNav(); });
document.getElementById('navname').addEventListener('click', closeNav);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

/* ── eser bloğu ──────────────────────────────────────────────────────────── */

function workBlock(w, opts = {}) {
  const d = K.el('div', 'work');
  const fig = K.figure(w, opts);
  d.appendChild(fig);

  const cap = K.el('div', 'cap');
  cap.innerHTML =
    `<div class="t">${w.title}</div>` +
    `<div>${w.year}</div>` +
    `<div>${w.medium}</div>` +
    `<div>${w.size} | ${w.sizeIn}</div>`;

  const av = K.el('div', 'avail' + (w.status === 'satilik' ? '' : ' no'));
  av.textContent = w.status === 'satilik'
    ? 'Atölyeden temin edilebilir, İstanbul'
    : (w.status === 'koleksiyonda' ? 'Özel koleksiyon' : 'Ayrıldı');
  cap.appendChild(av);

  d.appendChild(cap);
  return d;
}

function listView(works, lede) {
  main.innerHTML = '';
  if (lede) main.appendChild(K.el('div', 'lede', lede));
  works.forEach((w, i) => main.appendChild(workBlock(w, { eager: i === 0 })));
  scrollTo(0, 0);
}

/* ── görünümler ──────────────────────────────────────────────────────────── */

function viewHome() {
  markNav(null);
  main.innerHTML = '';
  const wrap = K.el('div');
  wrap.id = 'home';

  const w = SITE.works[0];
  const lead = K.el('div', 'lead');
  lead.appendChild(workBlock(w, { eager: true }));
  wrap.appendChild(lead);

  const side = K.el('div', 'side');
  side.innerHTML =
    `<div class="blk"><b>Kişisel sergi — ALACAKARANLIK</b><br>` +
    `Galeri Nev, İstanbul<br>Ekim – Kasım 2024</div>` +
    `<div class="blk"><b>YENİ MANZARA</b> karma sergi<br>` +
    `Pera Müzesi, İstanbul<br>Mart – Haziran 2025</div>`;
  wrap.appendChild(side);

  main.appendChild(wrap);
  scrollTo(0, 0);
}

function viewSon() {
  markNav('/son');
  listView([...SITE.works].sort((a, b) => b.year - a.year));
}

function viewSeri(key) {
  const s = K.seriesOf(key);
  if (!s) return viewSon();
  markNav('/seri/' + key);
  listView(K.bySeries(key), `${s.title} · ${s.years} · ${s.blurb}`);
}

function viewBio() {
  markNav('/biyografi');
  main.innerHTML = '';
  const p = K.el('div', 'page');
  p.appendChild(K.el('h2', null, 'Biyografi'));
  SITE.bio.forEach(t => p.appendChild(K.el('p', null, t)));
  main.appendChild(p);
  scrollTo(0, 0);
}

function viewSergiler() {
  markNav('/sergiler');
  main.innerHTML = '';
  const p = K.el('div', 'page');
  p.appendChild(K.el('h2', null, 'Sergiler'));
  SITE.cv.forEach(([y, t, v]) => {
    const r = K.el('div', 'row');
    r.innerHTML = `<span>${y}</span><span><b>${t}</b><br>${v}</span>`;
    p.appendChild(r);
  });
  main.appendChild(p);
  scrollTo(0, 0);
}

  });
  main.appendChild(p);
  scrollTo(0, 0);
}

function viewIletisim() {
  markNav('/iletisim');
  main.innerHTML = '';
  const p = K.el('div', 'page');
  p.appendChild(K.el('h2', null, 'İletişim'));
  const c = K.el('p');
  c.innerHTML = `<a href="mailto:${SITE.artist.email}" style="color:var(--accent)">` +
                `${SITE.artist.email}</a><br>${SITE.artist.studio}`;
  p.appendChild(c);
  p.appendChild(K.el('p', null, 'Eser talepleri ve atölye ziyaretleri için yazın.'));
  p.appendChild(K.el('div', 'note', SITE.notice + ' ' + SITE.works[0].credit));
  main.appendChild(p);
  scrollTo(0, 0);
}

/* ── yönlendirme ─────────────────────────────────────────────────────────── */

K.Router
  .on(/^\/$/,             viewHome)
  .on(/^\/son$/,          viewSon)
  .on(/^\/seri\/(.+)$/,   viewSeri)
  .on(/^\/biyografi$/,    viewBio)
  .on(/^\/sergiler$/,     viewSergiler)
  .on(/^\/koleksiyon$/,   viewKoleksiyon)
  .on(/^\/iletisim$/,     viewIletisim)
  .start();
</script>
