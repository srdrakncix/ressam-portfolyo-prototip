<!doctype html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Kütük</title>
<meta name="theme-color" content="#F5F2EC">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   KÜTÜK — ressamın kendi koleksiyon kütüğü, yayımlanmış hâli.
   Manşet yok. Ölçüler, envanter numaraları ve durum satırları normalde bir
   manşete ayrılan özenle dizilmiş. Ekrandaki tek doygun şey yağlı boya.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light dark;

  --paper:  #F5F2EC;   /* sayfa zemini, sıcak krem */
  --mount:  #FCFBF8;   /* varsayılan paspartu — sayfadan DAHA AÇIK */
  --ink:    #1A1714;
  --muted:  #6B645B;
  --label:  #736B60;
  --rule:        rgba(26,23,20,.14);
  --rule-strong: rgba(26,23,20,.42);
  --faint:  #CFC9BE;
  --accent: #8A3A24;   /* arşiv damgası kırmızısı — yalnızca seçim ve atlama bağlantısı */
  --focus:  #1A1714;

  --gutter:     clamp(20px, 6vw, 96px);
  --measure:    1240px;
  --bar:        56px;
  --plaque:     168px;
  --label-rail: clamp(72px, 8vw, 108px);

  --s1: calc(4px + .12vw);  --s2: calc(8px + .25vw);   --s3: calc(16px + .5vw);
  --s4: calc(24px + .75vw); --s5: calc(40px + 1.25vw); --s6: calc(64px + 2vw);
  --s7: calc(96px + 4vw);   --s8: calc(144px + 8vw);

  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono:  "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --t-micro: clamp(.625rem, .603rem + .094vw, .6875rem);
  --t-label: clamp(.75rem, .728rem + .094vw, .8125rem);
  --t-mono:  clamp(.8125rem, .79rem + .094vw, .875rem);
  --t-body:  clamp(1rem, .978rem + .094vw, 1.0625rem);
  --t-note:  clamp(1.125rem, 1.06rem + .27vw, 1.25rem);
  --t-title: clamp(1.375rem, 1.24rem + .56vw, 1.75rem);
  --t-sec:   clamp(1.75rem, 1.4rem + 1.46vw, 2.4375rem);
  --t-ghost: clamp(2.75rem, 2.1rem + 2.7vw, 3.8125rem);

  --ease: cubic-bezier(.19, 1, .22, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:  #14110F;
    --mount:  #1E1A17;
    --ink:    #EDE8E0;
    --muted:  #A29A8E;
    --label:  #8F877B;
    --rule:        rgba(237,232,224,.16);
    --rule-strong: rgba(237,232,224,.46);
    --faint:  #3A342E;
    --accent: #C4703F;
    --focus:  #EDE8E0;
  }
}

:root[data-theme="dark"] {
  --paper:  #14110F;
  --mount:  #1E1A17;
  --ink:    #EDE8E0;
  --muted:  #A29A8E;
  --label:  #8F877B;
  --rule:        rgba(237,232,224,.16);
  --rule-strong: rgba(237,232,224,.46);
  --faint:  #3A342E;
  --accent: #C4703F;
  --focus:  #EDE8E0;
}

/* Tema bir anahtar değil, günün saati: oda yavaşça dönüyor. */
:root {
  transition: background-color 640ms var(--ease), color 640ms var(--ease);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: var(--t-body);
  line-height: 1.6;
  font-variation-settings: "opsz" 16;
  font-feature-settings: "onum" 1, "kern" 1;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  transition: background-color 640ms var(--ease), color 640ms var(--ease);
}

h1, h2, h3, p, figure, figcaption, dl, dd, ul, li { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; object-fit: contain; }

::selection { background: rgba(138,58,36,.14); color: var(--ink); }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 2px; }

.skip {
  position: fixed; top: 10px; left: 10px; z-index: 90;
  background: var(--accent); color: #FBF7F2;
  font-family: var(--mono); font-size: var(--t-label);
  text-transform: uppercase; letter-spacing: .08em;
  padding: 10px 16px; text-decoration: none;
  transform: translateY(-200%);
  transition: transform 200ms ease-out;
}
.skip:focus-visible { transform: none; }

.wrap { max-width: var(--measure); margin-inline: auto; padding-inline: var(--gutter); }

.mono {
  font-family: var(--mono); font-size: var(--t-micro);
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--label); font-variant-numeric: tabular-nums;
}
.mono-val {
  font-family: var(--mono); font-size: var(--t-mono);
  color: var(--muted); font-variant-numeric: tabular-nums;
}

/* Tek fiil: saç çizgisi koyulaşır. Metnin rengi asla oynamaz. */
a.u {
  color: inherit; text-decoration: underline;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--rule-strong);
  text-underline-offset: .35em;
  transition: text-decoration-color 300ms ease-in;
}
@media (hover: hover) and (pointer: fine) { a.u:hover { text-decoration-color: var(--ink); } }
a.u:focus-visible { text-decoration-color: var(--ink); }

/* ── ray (yapışkan başlık) ───────────────────────────────────────────────── */

#ray {
  position: sticky; top: 0; z-index: 40;
  height: var(--bar);
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: var(--s3);
  padding-inline: var(--gutter);
  transition: background-color 640ms var(--ease);
}
#ray .name {
  font-family: var(--mono); font-size: var(--t-label);
  text-transform: uppercase; letter-spacing: .08em; color: var(--ink);
  text-decoration: none; white-space: nowrap;
}
#ray .slot { flex: 1; display: flex; justify-content: center; min-width: 0; }
#ray nav { display: flex; gap: var(--s3); align-items: center; }
#ray nav a, #ray nav button {
  font-family: var(--mono); font-size: var(--t-micro);
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--label); background: none; border: 0; padding: 4px 0;
  cursor: pointer; text-decoration: none;
  transition: color 300ms ease-in;
}
@media (hover: hover) and (pointer: fine) {
  #ray nav a:hover, #ray nav button:hover { color: var(--ink); }
}
/* Küçük ekranda gizlemek yerine sıkıştır: navigasyon her boyutta erişilebilir. */
@media (max-width: 34.99rem) {
  #ray { gap: 10px; padding-inline: 14px; }
  #ray nav { gap: 12px; }
  #ray .name { font-size: var(--t-micro); }
}

/* yapışkan ray başlıkları örtmesin */
[id] { scroll-margin-top: calc(var(--bar) + 40px); }

/* aktif süzgeç fişi — sitedeki tek "chip" */
.chip {
  display: inline-flex; align-items: center; gap: var(--s2);
  font-family: var(--mono); font-size: var(--t-micro);
  text-transform: uppercase; letter-spacing: .08em; color: var(--ink);
  border-bottom: 1px solid var(--rule-strong); padding-bottom: 3px;
  max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.chip button {
  font-family: var(--mono); font-size: inherit; color: var(--label);
  background: none; border: 0; cursor: pointer; padding: 0 0 0 2px;
}
@media (hover: hover) and (pointer: fine) { .chip button:hover { color: var(--ink); } }

/* ── eser: künye tam olarak tablo genişliğinde ───────────────────────────── */

figure.work { display: table; width: auto; margin-inline: auto; }
figure.work figcaption { display: table-caption; caption-side: bottom; padding-top: 10px; }

.k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--mount-work, var(--mount));
  box-shadow: inset 0 0 0 1px rgba(128,120,110,.22);   /* soluk tuvalin kenarı kaybolmasın */
  transition: background-color 640ms var(--ease);
}
.k-fig::before { content: ""; display: block; padding-bottom: calc(100% / var(--ar)); }
.k-lqip, .k-full {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain;
}
.k-lqip { image-rendering: pixelated; }   /* dürüst düşük çözünürlük, bulanık resim değil */
.k-full { opacity: 0; transition: opacity 520ms linear; }
.k-fig.is-loaded .k-full { opacity: 1; }

/* ── açılış ──────────────────────────────────────────────────────────────── */

#acilis {
  padding-block: var(--s5) var(--s6);
  display: grid; gap: var(--s4); justify-items: center;
}
#acilis .reg-line { justify-self: start; }
/* genişlik JS'te kesin piksel olarak veriliyor; yükseklik ::before boşlukçusundan gelir */
#acilis figure.work { max-width: 100%; }

.plaque { text-align: center; display: grid; gap: var(--s1); }
.plaque .t {
  font-size: var(--t-title); font-style: italic; font-weight: 300;
  font-variation-settings: "opsz" 24; color: var(--ink);
}
.plaque .m { font-family: var(--mono); font-size: var(--t-mono); color: var(--muted); }

/* ── kütük: asılma hatları ───────────────────────────────────────────────── */

#kutuk { padding-block: var(--s6) var(--s7); }
#kutuk .head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s3); flex-wrap: wrap;
  border-bottom: 1px solid var(--rule); padding-bottom: var(--s3);
}
#kutuk h2, #sanatci h2, #kolofon h2 {
  font-size: var(--t-sec); font-weight: 400; font-style: italic;
  font-variation-settings: "opsz" 60; color: var(--ink); line-height: 1.1;
}

.row {
  position: relative;
  display: flex; align-items: flex-end; gap: var(--s5);
  padding-left: var(--label-rail);
  border-bottom: 1px solid var(--rule);
  margin-top: var(--s6);
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  transition: border-color 320ms var(--ease);
}
.row:focus-within, .row.hot { border-bottom-color: var(--rule-strong); }

/* santimetre rayı — satırın kendi ölçeğiyle, canlı */
.rail {
  position: absolute; left: 0; bottom: 0; width: var(--label-rail);
  height: var(--rail-h); pointer-events: none;
}
.rail::before {
  content: ""; position: absolute; right: 10px; top: 0; bottom: 0;
  width: 1px; background: var(--rule);
}
.rail i {
  position: absolute; right: 10px; width: 7px; height: 1px; background: var(--rule-strong);
}
.rail i span {
  position: absolute; right: 10px; top: -.62em;
  font-family: var(--mono); font-size: var(--t-micro);
  letter-spacing: .06em; color: var(--label); white-space: nowrap;
}

.cell { flex: none; scroll-snap-align: end; padding-bottom: 0; }
.cell figure.work { margin-inline: 0; }
.cell .cap {
  height: 66px; overflow: hidden;
  display: grid; gap: 2px; align-content: start;
  padding-block: 12px; margin-block: -12px;
}
.cell .cap .t {
  font-style: italic; font-weight: 300; font-size: var(--t-body); color: var(--ink);
  white-space: nowrap;
  mask-image: linear-gradient(90deg, #000, #000 calc(100% - 2.4rem), transparent);
}
.cell .cap .m { font-family: var(--mono); font-size: var(--t-micro); color: var(--muted); }
.cell a { text-decoration: none; color: inherit; display: block; }

/* ── kayıt (tek eser) ────────────────────────────────────────────────────── */

#kayit { padding-block: var(--s5) var(--s7); }
#kayit .cols { display: grid; gap: var(--s5); align-items: start; }
@media (min-width: 56.25rem) {
  #kayit .cols { grid-template-columns: minmax(0, 1fr) clamp(300px, 34%, 384px); }
  #kayit .imgcol { position: sticky; top: calc(var(--bar) + var(--s3)); }
}
#kayit figure.work { margin-inline: 0; }

/* ölçek çubuğu: tam resim genişliğinde, her 25 gerçek cm'de bir çentik */
.scalebar { position: relative; height: 22px; margin-top: var(--s2); }
.scalebar::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--rule-strong);
}
.scalebar i { position: absolute; top: 0; width: 1px; height: 5px; background: var(--rule-strong); }
.scalebar span {
  position: absolute; right: 0; top: 7px;
  font-family: var(--mono); font-size: var(--t-micro);
  letter-spacing: .06em; color: var(--label);
}

.ghost {
  font-family: var(--mono); font-size: var(--t-ghost); line-height: 1;
  color: var(--faint); font-variant-numeric: tabular-nums;
}
#kayit .note {
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: var(--t-note); line-height: 1.55; color: var(--muted);
  max-width: 46ch; margin-block: var(--s3);
  font-variation-settings: "opsz" 24;
}
#kayit hr { border: 0; border-top: 1px solid var(--rule); margin-block: var(--s3); }

/* künye alanları: her etiket gerçek bir düğme — sitenin tek navigasyonu */
.reg { display: grid; }
.reg .r {
  display: grid; grid-template-columns: var(--label-rail) 1fr; gap: var(--s3);
  border-top: 1px solid var(--rule); padding-block: var(--s2);
  align-items: baseline;
}
.reg .r:first-child { border-top: 0; }
.reg dt { margin: 0; }
.reg .fl {
  font-family: var(--mono); font-size: var(--t-micro);
  text-transform: uppercase; letter-spacing: .08em; color: var(--label);
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat; background-position: 0 calc(100% - 3px);
  background-size: 0 1px;
  transition: background-size 320ms var(--ease), color 320ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  .reg .fl:hover { background-size: 100% 1px; color: var(--ink); }
}
.reg .fl[aria-pressed="true"] { color: var(--ink); background-size: 100% 1px; }
.reg .fl.static { cursor: default; }
.reg dd { font-family: var(--mono); font-size: var(--t-mono); color: var(--muted); }
.reg .sw {
  display: inline-block; width: 10px; height: 10px;
  border: 1px solid var(--rule); vertical-align: -1px; margin-right: 6px;
}

.pager { display: flex; justify-content: space-between; gap: var(--s3); margin-top: var(--s5); }
.pager a { font-family: var(--mono); font-size: var(--t-micro); letter-spacing: .08em; }
.lateral { display: flex; gap: var(--s4); flex-wrap: wrap; margin-top: var(--s5); }

/* ── sanatçı / kolofon ───────────────────────────────────────────────────── */

#sanatci { padding-block: var(--s6) var(--s7); border-top: 1px solid var(--rule); }
#sanatci .two { display: grid; gap: var(--s5); margin-top: var(--s5); }
@media (min-width: 56.25rem) { #sanatci .two { grid-template-columns: 1fr 1fr; } }
#sanatci .formula { font-size: var(--t-note); color: var(--ink); line-height: 1.5; }
#sanatci p + p { margin-top: var(--s3); }
#sanatci .cvy {
  font-family: var(--mono); font-size: var(--t-mono); font-weight: 500;
  color: var(--ink); margin-top: var(--s4);
}
#sanatci .cve { color: var(--muted); font-size: var(--t-mono); padding-left: var(--s3); }
#sanatci .cve i { font-family: var(--serif); font-style: italic; color: var(--ink); font-size: var(--t-body); }

#kolofon { padding-block: var(--s5) var(--s7); border-top: 1px solid var(--rule); }
#kolofon .state { margin-bottom: var(--s4); }
#kolofon p + p { margin-top: var(--s3); }
#kolofon .notice {
  font-family: var(--mono); font-size: var(--t-micro); line-height: 1.7;
  color: var(--label); max-width: 62ch; margin-top: var(--s4);
  border-left: 1px solid var(--rule); padding-left: var(--s3);
}
.sc { font-feature-settings: "c2sc" 1, "smcp" 1, "onum" 1; }

[hidden] { display: none !important; }

/* ── dokunmatik ve dar ekran ─────────────────────────────────────────────── */

@media (pointer: coarse) {
  /* parmak boyunda hedefler */
  #ray nav a, #ray nav button { min-height: 44px; display: inline-flex; align-items: center; }
  .cell a { padding-bottom: 8px; }
  .reg .r { padding-block: var(--s3); }
  .reg .fl { min-height: 40px; display: inline-flex; align-items: center; }
  /* künye alanlarının süzgeç olduğu dokunmatikte de görünsün:
     çizgi hover'ı beklemeden yarı yolda dursun */
  .reg .fl:not(.static) { background-size: 100% 1px; color: var(--muted); }
}

@media (max-width: 43.75rem) {
  /* Santimetre rayı 390 px ekranın altıda birini yiyordu. Daralt ve
     etiketleri işaretin üstüne al; eserler ekranın tamamını kullansın. */
  :root { --label-rail: 34px; --plaque: 132px; }
  .row { padding-left: var(--label-rail); gap: var(--s4); }
  .rail::before { right: 6px; }
  .rail i { right: 6px; width: 5px; }
  .rail i span { right: 0; top: -1.5em; font-size: 9px; }
  .reg .r { grid-template-columns: 1fr; gap: 2px; }
  #kayit .cols { gap: var(--s4); }
}

@media (prefers-reduced-motion: reduce) {
  :root, body, .k-fig, .k-full, .row, .reg .fl, a.u, .skip {
    transition-duration: 1ms !important; transition-delay: 0s !important;
  }
}
</style>
</head>
<body>


<a class="skip" href="#kutuk">Kütüğe geç</a>

<header id="ray">
  <a class="name" href="#/" id="rayname"></a>
  <div class="slot" id="slot"></div>
  <nav>
    <button type="button" data-go="kutuk">Kütük</button>
    <button type="button" data-go="sanatci">Sanatçı</button>
    <button type="button" data-go="kolofon">İletişim</button>
    <button id="theme" type="button">Gece</button>
  </nav>
</header>

<main id="app"></main>

/* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      } else {
        /* Varsayılan AÇIK: sistemi karanlıkta olan ziyaretçi de krem zemin
           görsün. Sistem tercihine uymak yerine bilinçli bir karar —
           düğme yine duruyor, isteyen koyuya geçer. */
        document.documentElement.dataset.theme = 'light';
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();


document.documentElement.lang = 'tr';
K.Theme.init();

const app = document.getElementById('app');
const slot = document.getElementById('slot');
document.getElementById('rayname').textContent = SITE.artist.mark;

/* ── paspartu: eserin kendi rengi, doygunluğu kırpılmış ──────────────────── */

function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0;
  const l = (mx + mn) / 2;
  const d = mx - mn;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d !== 0) {
    if (mx === r)      h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else               h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, s * 100, l * 100];
}

/* Duvar, eserin rengini alır; gerisini atar. Konservatörün paspartu seçmesi. */
function mountFor(tone) {
  if (!tone) return null;
  const [h, s] = hexToHsl(tone);
  const dark = K.Theme.current() === 'dark';
  return `hsl(${h.toFixed(0)}, ${Math.min(s, 10).toFixed(0)}%, ${dark ? '12.5' : '96.5'}%)`;
}

function figureFor(w, opts) {
  const fig = K.figure(w, opts);
  fig.style.setProperty('--ar', w.ratio);
  fig.dataset.tone = w.tone;
  const m = mountFor(w.tone);
  if (m) fig.style.setProperty('--mount-work', m);
  return fig;
}

/* figure.work `display:table; width:auto` — içindeki figürün genişliği
   yüzdeyle verilirse kendi kendine bağlanıp çöküyor. Tavan yükseklik ve
   gerçek en-boy oranından kesin piksel hesapla.                           */
function fitFigure(fig, w, container, ceil) {
  const cs = getComputedStyle(container);
  const avail = container.clientWidth
    - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  fig.style.width = Math.max(120, Math.min(ceil * w.ratio, avail)) + 'px';
}

const FITS = [];   /* {fig, work, container, ceil()} — yeniden boyutlamada tazelenir */

function refit() {
  FITS.forEach(f => fitFigure(f.fig, f.work, f.container, f.ceil()));
}

function repaintMounts() {
  document.querySelectorAll('.k-fig[data-tone]').forEach((f) => {
    const m = mountFor(f.dataset.tone);
    if (m) f.style.setProperty('--mount-work', m);
  });
}

/* ── süzgeç durumu ───────────────────────────────────────────────────────── */

const FIELDS = {
  seri:   { label: 'Seri',   of: w => w.series, show: w => K.seriesOf(w.series).title },
  yil:    { label: 'Yıl',    of: w => String(w.year), show: w => String(w.year) },
  teknik: { label: 'Teknik', of: w => w.medium, show: w => w.medium },
  durum:  { label: 'Durum',  of: w => w.status, show: w => w.statusLabel },
};

let filter = null;   /* {key, value} */

function filtered() {
  if (!filter) return SITE.works;
  const f = FIELDS[filter.key];
  return SITE.works.filter(w => f.of(w) === filter.value);
}

function renderSlot() {
  slot.innerHTML = '';
  if (!filter) return;
  const f = FIELDS[filter.key];
  const w = SITE.works.find(x => f.of(x) === filter.value);
  const chip = K.el('span', 'chip');
  chip.append(document.createTextNode(`${f.label}: ${w ? f.show(w) : filter.value}`));
  const x = K.el('button', null, '×');
  x.type = 'button';
  x.setAttribute('aria-label', 'Süzgeci kaldır');
  x.addEventListener('click', () => { filter = null; renderSlot(); drawRegister(); });
  chip.appendChild(x);
  slot.appendChild(chip);
}

/* ── asılma hattı düzeni ─────────────────────────────────────────────────── */

function bandPx() {
  return Math.max(200, Math.min(360, innerHeight * 0.32));
}

function measurePx() {
  const el = document.querySelector('#kutuk .rows');
  if (!el) return 900;
  const railW = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue('--label-rail')) || 90;
  return Math.max(240, el.clientWidth - railW);
}

/* Satırlar sütun sayısıyla değil, asma kuralıyla kurulur:
   ölçü dolana kadar doldur, sonra kır. On dokuzuncu eser duvarı yeniden dizer. */
function composeRows(works, band, measure, gap) {
  const rows = [];
  let cur = [];
  const widthOf = (row) => {
    const maxH = Math.max(...row.map(w => w.ch));
    const ppc = band / maxH;
    return row.reduce((sum, w) => sum + w.cw * ppc, 0) + gap * (row.length - 1);
  };
  for (const w of works) {
    const test = cur.concat([w]);
    if (cur.length && widthOf(test) > measure) { rows.push(cur); cur = [w]; }
    else cur = test;
  }
  if (cur.length) rows.push(cur);
  return rows;
}

function drawRegister() {
  const host = document.querySelector('#kutuk .rows');
  if (!host) return;
  const works = filtered();
  const band = bandPx();
  const gap = 40;
  host.innerHTML = '';

  document.getElementById('kutuk-count').textContent =
    `${works.length} ESER` + (filter ? ` · ${SITE.works.length} İÇİNDEN` : '');

  if (!works.length) {
    host.appendChild(K.el('p', 'mono-val', 'Bu ölçüte uyan kayıt yok.'));
    return;
  }

  composeRows(works, band, measurePx(), gap).forEach((row) => {
    const maxH = Math.max(...row.map(w => w.ch));
    const ppc = band / maxH;

    const r = K.el('div', 'row');
    r.style.setProperty('--rail-h', band + 'px');

    /* satırın kendi santimetre rayı */
    const rail = K.el('div', 'rail');
    rail.setAttribute('aria-hidden', 'true');
    [50, 100, 150, 200].forEach((cm) => {
      if (cm * ppc > band) return;
      const t = K.el('i');
      t.style.bottom = (cm * ppc) + 'px';
      t.appendChild(K.el('span', null, cm));
      rail.appendChild(t);
    });
    r.appendChild(rail);

    row.forEach((w) => {
      const cell = K.el('div', 'cell');
      const a = K.el('a');
      a.href = '#/kayit/' + w.slug;

      const figEl = K.el('figure', 'work');
      const fig = figureFor(w);
      fig.dataset.tone = w.tone;
      fig.style.width = (w.cw * ppc) + 'px';
      figEl.appendChild(fig);

      const cap = K.el('figcaption', 'cap');
      cap.innerHTML = `<div class="t">${w.title}, ${w.year}</div>` +
                      `<div class="m">${w.size}</div>`;
      figEl.appendChild(cap);
      a.appendChild(figEl);
      cell.appendChild(a);

      if (matchMedia('(hover: hover)').matches) {
        cell.addEventListener('pointerenter', () => r.classList.add('hot'));
        cell.addEventListener('pointerleave', () => r.classList.remove('hot'));
      }
      r.appendChild(cell);
    });

    host.appendChild(r);
  });
}

/* ── görünümler ──────────────────────────────────────────────────────────── */

function openingWork() {
  /* Açılış eserini ziyaretçinin saati seçer: sabah en açık ve serin,
     akşam en sıcak ve derin. Bir hafta boyunca sessizce doğru. */
  const h = new Date().getHours();
  const scored = SITE.works.map((w) => {
    const [hue, , l] = hexToHsl(w.tone);
    const warm = (hue < 60 || hue > 330) ? 1 : 0;
    return { w, l, warm, hue };
  });
  if (h < 11) return scored.slice().sort((a, b) => b.l - a.l)[0].w;
  if (h >= 17) return scored.slice().sort((a, b) => (b.warm - a.warm) || (a.l - b.l))[0].w;
  return SITE.works[Math.floor(SITE.works.length / 2)];
}

function viewIndex() {
  app.innerHTML = '';
  FITS.length = 0;

  /* açılış */
  const op = K.el('section', 'wrap');
  op.id = 'acilis';
  const w = openingWork();
  const line = K.el('p', 'mono reg-line',
    `KÜTÜK · ${SITE.works.length} ESER · 2018–2024 · ${SITE.works[0].medium.toUpperCase()}`);
  op.appendChild(line);

  const figEl = K.el('figure', 'work');
  const fig = figureFor(w, { eager: true });
  figEl.appendChild(fig);
  const cap = K.el('figcaption', 'plaque');
  cap.innerHTML = `<div class="t">${w.title}, ${w.year}</div>` +
                  `<div class="m">${w.medium} · ${w.size}</div>`;
  figEl.appendChild(cap);
  op.appendChild(figEl);
  app.appendChild(op);

  const ceilOpen = () => Math.min(innerHeight - 56 - 168 - 56, 640);
  FITS.push({ fig, work: w, container: op, ceil: ceilOpen });
  fitFigure(fig, w, op, ceilOpen());

  /* kütük */
  const kt = K.el('section', 'wrap');
  kt.id = 'kutuk';
  const head = K.el('div', 'head');
  head.appendChild(K.el('h2', null, 'Kütük'));
  const cnt = K.el('span', 'mono');
  cnt.id = 'kutuk-count';
  head.appendChild(cnt);
  kt.appendChild(head);
  kt.appendChild(K.el('div', 'rows'));
  app.appendChild(kt);

  app.appendChild(sectionArtist());
  app.appendChild(sectionColophon());

  drawRegister();
}

function viewRecord(slug) {
  const w = K.workBySlug(slug);
  if (!w) return viewIndex();
  app.innerHTML = '';
  FITS.length = 0;

  const s = K.el('section', 'wrap');
  s.id = 'kayit';
  const cols = K.el('div', 'cols');

  const imgcol = K.el('div', 'imgcol');
  const figEl = K.el('figure', 'work');
  const fig = figureFor(w, { eager: true });
  figEl.appendChild(fig);

  const bar = K.el('figcaption', 'scalebar');
  const ticks = Math.floor(w.cw / 25);
  for (let i = 1; i <= ticks; i++) {
    const t = K.el('i');
    t.style.left = (i * 25 / w.cw * 100) + '%';
    bar.appendChild(t);
  }
  bar.appendChild(K.el('span', null, `${w.cw} CM`));
  figEl.appendChild(bar);
  imgcol.appendChild(figEl);
  cols.appendChild(imgcol);

  /* aparat sütunu — önce ifade, sonra künye */
  const ap = K.el('div');
  ap.appendChild(K.el('div', 'ghost', w.no));

  const pl = K.el('div');
  pl.style.marginTop = 'var(--s3)';
  pl.innerHTML =
    `<div style="font-size:var(--t-title);font-style:italic;font-weight:300;` +
    `font-variation-settings:'opsz' 24;color:var(--ink)">${w.title}, ${w.year}</div>` +
    `<div class="mono-val" style="margin-top:4px">${w.medium}</div>`;
  ap.appendChild(pl);

  ap.appendChild(K.el('p', 'note', '“' + w.note + '”'));
  ap.appendChild(K.el('hr'));

  const dl = K.el('dl', 'reg');
  const rows = [
    ['ENVANTER NO.', w.no, null],
    ['SERİ',   K.seriesOf(w.series).title, ['seri', w.series]],
    ['YIL',    String(w.year), ['yil', String(w.year)]],
    ['TEKNİK', w.medium, ['teknik', w.medium]],
    ['ÖLÇÜ',   `${w.size} (${w.sizeIn})`, null],
    ['ORAN',   w.ratio.toFixed(2), null],
    ['BASKIN TON', `<span class="sw" style="background:${w.tone}"></span>${w.tone.toUpperCase()}`, null],
    ['DURUM',  w.statusLabel, ['durum', w.status]],
  ];
  rows.forEach(([k, v, f]) => {
    const r = K.el('div', 'r');
    const dt = K.el('dt');
    const b = K.el('button', 'fl' + (f ? '' : ' static'), k);
    b.type = 'button';
    if (f) {
      b.setAttribute('aria-pressed', 'false');
      b.title = 'Kütüğü bu alana göre süz';
      b.addEventListener('click', () => {
        filter = { key: f[0], value: f[1] };
        renderSlot();
        K.Router.go('/');
      });
    } else {
      b.disabled = true;
    }
    dt.appendChild(b);
    r.appendChild(dt);
    r.appendChild(K.el('dd', null, v));
    dl.appendChild(r);
  });
  ap.appendChild(dl);

  /* yanal hareket: arama arayüzü olmadan */
  const lat = K.el('div', 'lateral');
  [['AYNI SERİDEN', 'seri', w.series], ['AYNI YIL', 'yil', String(w.year)],
   ['AYNI DURUMDA', 'durum', w.status]].forEach(([txt, key, val]) => {
    const a = K.el('a', 'u mono');
    a.href = '#/';
    a.textContent = txt;
    a.addEventListener('click', () => { filter = { key, value: val }; renderSlot(); });
    lat.appendChild(a);
  });
  ap.appendChild(lat);

  const { prev, next } = K.neighbours(w);
  const pg = K.el('div', 'pager');
  const pa = K.el('a', 'u'); pa.href = '#/kayit/' + prev.slug; pa.textContent = '← ' + prev.no;
  const na = K.el('a', 'u'); na.href = '#/kayit/' + next.slug; na.textContent = next.no + ' →';
  pg.append(pa, na);
  ap.appendChild(pg);

  cols.appendChild(ap);
  s.appendChild(cols);
  app.appendChild(s);
  app.appendChild(sectionColophon());

  const ceilRec = () => Math.min(innerHeight - 56 - 120, 700);
  FITS.push({ fig, work: w, container: imgcol, ceil: ceilRec });
  fitFigure(fig, w, imgcol, ceilRec());

  scrollTo(0, 0);
}

function sectionArtist() {
  const s = K.el('section', 'wrap');
  s.id = 'sanatci';
  s.appendChild(K.el('h2', null, 'Sanatçı'));
  const two = K.el('div', 'two');
  const a = K.el('div');
  a.appendChild(K.el('p', 'formula',
    `${SITE.artist.born}’de ${SITE.artist.birthplace}’de doğdu.<br>${SITE.artist.based}’da yaşıyor ve çalışıyor.`));
  const p = K.el('p', null, SITE.bio[1]);
  p.style.marginTop = 'var(--s4)';
  p.style.maxWidth = '46ch';
  p.style.color = 'var(--muted)';
  a.appendChild(p);

  const b = K.el('div');
  b.appendChild(K.el('p', 'mono', 'Sergiler'));
  SITE.cv.forEach(([y, t, v]) => {
    b.appendChild(K.el('div', 'cvy', y));
    b.appendChild(K.el('div', 'cve', `— <i>${t}</i>, ${v}`));
  });
  two.append(a, b);
  s.appendChild(two);
  return s;
}

function sectionColophon() {
  const s = K.el('section', 'wrap');
  s.id = 'kolofon';
  const priv = SITE.works.filter(w => w.status !== 'satilik').length;
  const d = new Date();
  const stamp = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
  s.appendChild(K.el('p', 'mono state',
    `KAYIT TAM: ${SITE.works.length}/${SITE.works.length} · SON GÜNCELLEME ${stamp} · ` +
    `${priv} ESER SANATÇIDA DEĞİL`));
  s.appendChild(K.el('h2', null, 'Künye'));
  const c = K.el('div');
  c.style.marginTop = 'var(--s4)';
  c.innerHTML =
    `<p>Görüşme ve eser talepleri için: ` +
    `<a class="u" href="mailto:${SITE.artist.email}">${SITE.artist.email}</a></p>` +
    `<p class="mono-val">${SITE.artist.studio} · <span class="sc">İST</span></p>` +
    `<p class="mono-val">Newsreader ve DM Mono. Bu kütük elle dizilmiştir.</p>`;
  s.appendChild(c);
  s.appendChild(K.el('p', 'notice', SITE.notice));
  const cr = K.el('p', 'notice', SITE.works[0].credit);
  s.appendChild(cr);
  return s;
}

/* ── tema ────────────────────────────────────────────────────────────────── */

const themeBtn = document.getElementById('theme');
const syncTheme = () => {
  const dark = K.Theme.current() === 'dark';
  themeBtn.textContent = dark ? 'Gündüz' : 'Gece';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#14110F' : '#F5F2EC');
};
themeBtn.addEventListener('click', () => { K.Theme.toggle(); syncTheme(); repaintMounts(); });
syncTheme();

/* ── yönlendirme ─────────────────────────────────────────────────────────── */

K.Router
  .on(/^\/$/, viewIndex)
  .on(/^\/kayit\/(.+)$/, viewRecord)
  .start();

/* Ray navigasyonu: bölümler yönlendirici rotası değil, sayfa içi çapa.
   Kayıt görünümündeysek önce kütüğe dön, çizim bitince kaydır.            */
function goSection(id) {
  const jump = () => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: K.reduced() ? 'auto' : 'smooth', block: 'start' });
  };
  if (location.hash.replace(/^#/, '') !== '/') {
    addEventListener('hashchange', function once() {
      removeEventListener('hashchange', once);
      requestAnimationFrame(jump);
    });
    K.Router.go('/');
  } else {
    jump();
  }
}

document.querySelectorAll('#ray nav [data-go]').forEach((b) => {
  b.addEventListener('click', () => goSection(b.dataset.go));
});

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    refit();
    if (document.querySelector('#kutuk .rows')) drawRegister();
  }, 160);
}, { passive: true });
</script>
