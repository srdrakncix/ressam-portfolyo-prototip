# Depoya bir degisiklik gelince siteyi derler ve GitHub Pages'e yayinlar.
#
# Bu is akisi olmadan yonetim paneli calismaz: panel depoya yazar, yayina
# donusturen sey burasidir. Yerelde `python yayinla.py` ne yapiyorsa burada
# da AYNISI calisiyor - "bende calisiyordu" durumunu bastan siliyor.
#
# ONEMLI: Ayarlar > Pages > Build and deployment > Source = "GitHub Actions"
# olmali.
name: Siteyi derle ve yayınla

on:
  push:
    branches: [main]
    paths-ignore:
      - 'OKUBENI.md'
      - 'AJAN-RAPORLARI.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Siteyi üret
        run: python yayinla.py

      # Bozuk bir yayin sessizce gecmesin. Denetim, panelin yazdigi kayitlarla
      # uretilen ciktiyi KARSILASTIRIYOR: her esere bir gorsel dusmus mu?
      # (Once "dosya adi sayi mi" diye bakiyordu; adlar slug'a donunce yanlis
      #  alarm verdi. Olcut artik veriyle esleme.)
      - name: Çıktıyı denetle
        run: |
          python - <<'PY'
          import json, os, sys

          gerekli = ['site/index.html', 'site/mekan.html', 'site/sergi.html',
                     'site/404.html', 'site/favicon.svg', 'site/robots.txt',
                     'site/sitemap.xml', 'site/assets/duvar/salon.webp',
                     'site/panel/index.html', 'site/panel/secenekler.json']
          eksik = [y for y in gerekli if not os.path.exists(y)]
          if eksik:
              sys.exit('EKSIK DOSYA: ' + ', '.join(eksik))

          kayitlar = [f for f in os.listdir('icerik/eserler') if f.endswith('.json')]
          if not kayitlar:
              sys.exit('HIC ESER KAYDI YOK')

          kayip = []
          for f in kayitlar:
              k = json.load(open(os.path.join('icerik/eserler', f), encoding='utf-8'))
              if not os.path.exists(os.path.join('site/assets', k['slug'] + '.webp')):
                  kayip.append(k['slug'])
          if kayip:
              sys.exit('GORSELI URETILMEYEN ESER: ' + ', '.join(kayip))

          # Sayfalar gercekten eserleri tasiyor mu? Bos bir kabuk yayinlanmasin.
          govde = open('site/sergi.html', encoding='utf-8').read()
          for f in kayitlar[:3]:
              k = json.load(open(os.path.join('icerik/eserler', f), encoding='utf-8'))
              if k['baslik'] not in govde:
                  sys.exit('SAYFADA ESER YOK: ' + k['baslik'])

          mb = sum(os.path.getsize(os.path.join(r, f))
                   for r, _, fs in os.walk('site') for f in fs) / 1048576
          print(f'{len(kayitlar)} eser, hepsinin gorseli uretildi. site/ {mb:.2f} MB')
          PY

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
