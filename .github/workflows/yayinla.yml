# Depoya bir degisiklik gelince siteyi derler ve GitHub Pages'e yayinlar.
#
# Bu is akisi olmadan yonetim paneli calismaz: panel depoya yazar, yayina
# donusturen sey burasidir. Yerelde `python yayinla.py` ne yapiyorsa burada
# da AYNISI calisiyor - "bende calisiyordu" durumunu bastan siliyor.
#
# ONEMLI: Ayarlar > Pages > Build and deployment > Source = "GitHub Actions"
# olmali.
name: Siteyi derle ve yayınla

on:
  push:
    branches: [main]
    paths-ignore:
      - 'OKUBENI.md'
      - 'AJAN-RAPORLARI.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Siteyi üret
        run: python yayinla.py

      # Yayindan onceki BUTUN denetimler tek dosyada (denetim.py): cikti
      # tamligi, menu okunurlugu, JavaScript sozdizimi, panelin kapicisi ve
      # sifreli giris denemeleri. Cloudflare Pages'in derleme komutu da
      # ayni dosyayi cagiriyor -- iki yayin yolu tek kurala bagli.
      - name: Denetim
        run: python denetim.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
