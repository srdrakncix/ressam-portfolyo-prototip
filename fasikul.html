<!doctype html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Fasikül</title>
<meta name="theme-color" content="#E8E7E1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..600&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   FASİKÜL — henüz ciltlenmemiş bir monografi.
   Ziyaretçi, baskıdan yeni çıkmış bir sanat kitabının forma forma okur.
   Resimler yapıştırma klişe; ressamın düşüncesi kenar boşluğunda akar.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light dark;

  /* İki kâğıt cinsi: sayfa mat ve serin, klişe daha parlak ve daha açık.
     Araştırılan sitelerin hepsi klişeyi sayfadan KOYU yapıyor; ters çevirmek
     resmi sayfaya delik değil, sayfaya konmuş bir nesne gibi okutuyor.      */
  --paper:    #E8E7E1;
  --plate:    #FBFBF9;
  --ink:      #16171A;
  --ink-2:    #303239;
  --ink-3:    #63666E;
  --ink-4:    #9EA1A8;
  --rule:     #D2D1CA;
  --rule-ink: #16171A;
  --accent:   #24406B;   /* matbaacı mavisi — üç yerde harcanır, başka hiçbir yerde */

  --page-max: 1400px;
  --margin:   clamp(20px, 5.6vw, 84px);
  --gutter:   clamp(14px, 1.35vw, 22px);

  /* Kasıtlı boşluklu ölçek: 16, 24, 48, 64 yok. Şeyler ya bitişik ya ayrı. */
  --s1: 4px;  --s2: 8px;   --s3: 12px;  --s4: 20px;  --s5: 32px;
  --s6: 52px; --s7: 84px;  --s8: 136px; --s9: 220px;

  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:  "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Harf aralığı boyutla ters çalışır: 11px'te +.14em, sergide -.045em */
  --fs-folio:   .6875rem;
  --fs-label:   clamp(.75rem, .72rem + .12vw, .8125rem);
  --fs-tomb:    clamp(.8125rem, .78rem + .14vw, .875rem);
  --fs-cap:     clamp(1rem, .97rem + .13vw, 1.0625rem);
  --fs-body:    clamp(1.0625rem, 1.01rem + .24vw, 1.1875rem);
  --fs-lede:    clamp(1.375rem, 1.16rem + .92vw, 1.75rem);
  --fs-h3:      clamp(1.25rem, 1.09rem + .68vw, 1.625rem);
  --fs-h2:      clamp(1.875rem, 1.45rem + 1.83vw, 2.625rem);
  --fs-h1:      clamp(2.75rem, 1.33rem + 6.05vw, 5.25rem);
  --fs-quote:   clamp(1.75rem, 1.04rem + 3.03vw, 3rem);
  --fs-display: clamp(3.25rem, .9rem + 10vw, 9.5rem);

  --ease: cubic-bezier(.19, 1, .22, 1);
  --header-h: 64px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:    #131417;
    --plate:    #1D1F23;   /* klişe hâlâ sayfadan bir adım AÇIK — ilişki korunur */
    --ink:      #E9E9E4;
    --ink-2:    #D2D3CE;
    --ink-3:    #8E9199;
    --ink-4:    #55585F;
    --rule:     #2B2D32;
    --rule-ink: #E9E9E4;
    --accent:   #7FA6DC;
  }
}

:root[data-theme="dark"] {
  --paper:    #131417;
  --plate:    #1D1F23;
  --ink:      #E9E9E4;
  --ink-2:    #D2D3CE;
  --ink-3:    #8E9199;
  --ink-4:    #55585F;
  --rule:     #2B2D32;
  --rule-ink: #E9E9E4;
  --accent:   #7FA6DC;
}

/* ── temel ───────────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: var(--fs-body);
  line-height: 1.62;
  font-weight: 400;
  font-variation-settings: "opsz" 16;
  font-feature-settings: "onum" 1, "kern" 1, "liga" 1;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  hyphens: auto;
}

h1, h2, h3, p, figure, dl, dd, ul, li { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; }
q { quotes: "“" "”" "‘" "’"; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.skip {
  position: fixed; top: 8px; left: 8px; z-index: 90;
  padding: 10px 16px; background: var(--plate); color: var(--ink);
  font-family: var(--sans); font-size: var(--fs-label);
  text-transform: uppercase; letter-spacing: .09em;
  text-decoration: none; border: 1px solid var(--rule);
  transform: translateY(-200%);
}
.skip:focus-visible { transform: none; }

.label {
  font-family: var(--sans); font-size: var(--fs-label); font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
  font-feature-settings: "tnum" 1, "lnum" 1;
}
.mono {
  font-family: var(--mono); font-size: var(--fs-folio);
  letter-spacing: .14em; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* Tek hover fiili: çizgi geri çekilir. Klişeler asla büyümez, kaymaz, solmaz. */
a.link {
  color: inherit; text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-size: 100% 1px;
  background-position: 0 calc(100% - .14em);
  transition: background-size 240ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  a.link:hover { background-size: 0% 1px; }
}

/* ── sayfa çatısı ────────────────────────────────────────────────────────── */

.sheet {
  max-width: var(--page-max);
  margin-inline: auto;
  padding-inline: var(--margin);
}

.grid {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  column-gap: var(--gutter);
}

/* 1120px altında kitap tek sütuna iner */
@media (max-width: 69.99rem) {
  .grid { grid-template-columns: 1fr; }
  .grid > * { grid-column: 1 !important; }
}

/* ── başlık şeridi ───────────────────────────────────────────────────────── */

#head {
  position: sticky; top: 0; z-index: 30;
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s4);
  padding-inline: var(--margin);
  background: var(--paper);
  border-bottom: 1px solid transparent;
  transition: border-color 300ms var(--ease);
}
#head.is-scrolled { border-bottom-color: var(--rule); }
#head .runner {
  font-family: var(--sans); font-size: var(--fs-label); font-weight: 600;
  text-transform: uppercase; letter-spacing: .13em; color: var(--ink);
}
#head .tools { display: flex; gap: var(--s4); align-items: center; }
#head button {
  font-family: var(--sans); font-size: var(--fs-label); font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em;
  background: none; border: 0; color: var(--ink-3); cursor: pointer;
  padding: 4px 0;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat; background-size: 0% 1px;
  background-position: 0 calc(100% - 2px);
  transition: background-size 240ms var(--ease), color 240ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  #head button:hover { background-size: 100% 1px; color: var(--ink); }
}
#head button[aria-pressed="true"] { color: var(--accent); background-size: 100% 1px; }
#head .toclink {
  font-family: var(--sans); font-size: var(--fs-label); font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); text-decoration: none; padding: 4px 0;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat; background-size: 0% 1px;
  background-position: 0 calc(100% - 2px);
  transition: background-size 240ms var(--ease), color 240ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  #head .toclink:hover { background-size: 100% 1px; color: var(--ink); }
}

/* yapışkan şerit başlıkları örtmesin */
[id] { scroll-margin-top: calc(var(--header-h) + 32px); }

/* ── dikiş: kitabın sırtı ────────────────────────────────────────────────── */

#dikis {
  position: fixed; top: 0; bottom: 0; left: calc(var(--margin) / 2);
  width: 1px; background: var(--rule); z-index: 20; pointer-events: none;
}
#dikis .seg {
  position: absolute; left: 0; width: 1px; background: var(--rule-ink);
  opacity: 0; transition: opacity 400ms var(--ease);
}
#dikis .seg.on { opacity: .55; }
#dikis .tick {
  position: absolute; left: -2px; width: 5px; height: 1px; background: var(--ink-4);
}
@media (max-width: 69.99rem) { #dikis { display: none; } }

/* ── yarım kapak ─────────────────────────────────────────────────────────── */

/* İlk kare boş kalmasın: kapak kısa tutulur, altındaki fasikül başlığı görünür. */
#kapak {
  min-height: min(64svh, 580px);
  display: grid; align-content: center; justify-items: center;
  gap: var(--s5);
  padding-block: var(--s7) var(--s6);
  text-align: center;
}
#fasikul-1 { padding-top: var(--s7); }
#kapak h1 {
  font-size: var(--fs-display); font-weight: 200; line-height: .86;
  letter-spacing: -.045em; color: var(--ink);
  font-variation-settings: "opsz" 72;
  text-wrap: balance;
}
#kapak .lede {
  font-size: var(--fs-lede); font-weight: 200; font-style: italic;
  line-height: 1.34; letter-spacing: -.008em; color: var(--ink-2);
  max-width: 22em;
}

/* ── içindekiler ─────────────────────────────────────────────────────────
   Bir kitapta navigasyon menü değildir; yarım kapaktan sonra gelen
   içindekiler sayfasıdır. Site de öyle davranıyor.                        */

#icindekiler { padding-block: var(--s6) var(--s7); }
#icindekiler .lbl { grid-column: 2 / 14; margin-bottom: var(--s4); }
#icindekiler .toc { grid-column: 2 / 14; }
#icindekiler .trow {
  display: grid; grid-template-columns: 3.2rem 1fr auto; gap: var(--s3);
  align-items: baseline;
  border-top: 1px solid var(--rule);
  padding-block: var(--s3);
  color: inherit; text-decoration: none;
}
#icindekiler .trow:last-child { border-bottom: 1px solid var(--rule); }
#icindekiler .trow .rn {
  font-family: var(--mono); font-size: var(--fs-folio);
  letter-spacing: .14em; color: var(--ink-4);
}
#icindekiler .trow .ti {
  font-size: var(--fs-h3); font-weight: 400; font-style: italic;
  line-height: 1.22; letter-spacing: -.012em; color: var(--ink);
  font-variation-settings: "opsz" 40;
}
#icindekiler .trow .ti small {
  display: block; font-family: var(--sans); font-style: normal;
  font-size: var(--fs-label); letter-spacing: .02em; color: var(--ink-3);
  margin-top: 2px;
}
#icindekiler .trow .pg {
  font-family: var(--mono); font-size: var(--fs-tomb); color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid transparent;
  transition: border-color 240ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  #icindekiler .trow:hover .pg { border-bottom-color: var(--rule-ink); }
}

/* ── fasikül açılışı ─────────────────────────────────────────────────────── */

.opener { padding-block: var(--s9) var(--s7); }
.opener .num { grid-column: 2 / 14; margin-bottom: var(--s4); }
.opener h2 {
  grid-column: 2 / 14;
  font-size: var(--fs-h1); font-weight: 200; line-height: .94;
  letter-spacing: -.035em; color: var(--ink);
  font-variation-settings: "opsz" 72;
  text-wrap: balance;
}
.opener .yr { grid-column: 2 / 14; margin-top: var(--s3); }
.opener .rule-ink {
  grid-column: 2 / 14; height: 1px; background: var(--rule-ink);
  margin-block: var(--s5) var(--s6);
}
.opener .lede {
  grid-column: 4 / 11;
  font-size: var(--fs-lede); font-weight: 200; font-style: italic;
  line-height: 1.34; letter-spacing: -.008em; color: var(--ink-2);
}
.opener .ctrl { grid-column: 12 / 15; align-self: end; }
@media (max-width: 69.99rem) { .opener .ctrl { margin-top: var(--s5); } }

.ctrl-btn {
  font-family: var(--sans); font-size: var(--fs-label); font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em;
  background: none; border: 0; border-bottom: 1px solid var(--rule);
  color: var(--ink-3); cursor: pointer; padding: 4px 0;
  transition: border-color 240ms var(--ease), color 240ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  .ctrl-btn:hover { border-bottom-color: var(--rule-ink); color: var(--ink); }
}
.ctrl-btn[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ── forma (spread) ──────────────────────────────────────────────────────── */

.spread { padding-block: var(--s7); position: relative; }
.spread .runhead {
  grid-column: 2 / 8; margin-bottom: var(--s4);
}
.spread .folio {
  position: absolute; right: var(--margin); bottom: var(--s5);
}
@media (max-width: 69.99rem) { .spread .folio { position: static; margin-top: var(--s5); } }

/* yapıştırma klişe: sayfadan daha parlak stok, ince çerçeve, 3px kaydırılmış gölge */
.plate-box {
  background: var(--plate);
  border: 1px solid var(--rule);
  box-shadow: 3px 3px 0 0 var(--rule);
  padding: clamp(12px, 1.6vw, 28px);
  display: flex; justify-content: center;
  position: relative;
}
.spread .plate-box { grid-column: 2 / 14; }
.spread.portrait .plate-box { grid-column: 4 / 12; }
.spread.bleed-l .plate-box { grid-column: 1 / 9; }
.spread.bleed-l .side { grid-column: 10 / 15; }
.spread.bleed-r .plate-box { grid-column: 7 / 15; }
.spread.bleed-r .side { grid-column: 2 / 7; }

.k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--tone);
  aspect-ratio: var(--ratio);
  max-height: min(78svh, 820px);
  width: min(calc(min(78svh, 820px) * var(--ratio)), 100%);
}
.k-lqip, .k-full { width: 100%; height: 100%; object-fit: cover; display: block; }
.k-full { position: absolute; inset: 0; opacity: 0; transition: opacity 600ms ease; }
.k-fig.is-loaded .k-full { opacity: 1; }

/* IŞIK — yalayıcı ışık. Küratörün lambayı empastoya eğik tutması. */
.k-fig::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  mix-blend-mode: soft-light; opacity: 0;
  background: linear-gradient(105deg,
              rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 34%, transparent 62%);
  transition: opacity 700ms var(--ease);
}
.k-fig.raking::after { opacity: 1; }
.k-fig.raking { filter: contrast(1.06) saturate(1.02); }
.k-fig { transition: filter 700ms var(--ease); }

/* künye — mezar taşı */
.tomb { margin-top: var(--s3); }
.spread .tomb { grid-column: 2 / 8; }
.spread.bleed-l .tomb, .spread.bleed-r .tomb { grid-column: auto; }
.tomb .tr { border-top: 1px solid var(--rule-ink); padding-top: var(--s2); }
.tomb dl { display: grid; gap: var(--s1); margin-top: var(--s2); }
.tomb .row {
  display: grid; grid-template-columns: 4.5rem 1fr; gap: var(--s3);
  font-family: var(--mono); font-size: var(--fs-tomb); line-height: 1.5;
  color: var(--ink-2);
}
.tomb .row dt { color: var(--ink-4); letter-spacing: .04em; }

/* açıklama: metadata değil, gerçek yazı */
.caption {
  font-size: var(--fs-cap); line-height: 1.55; color: var(--ink-2);
  font-variation-settings: "opsz" 18;
}
.spread .caption { grid-column: 11 / 15; margin-top: var(--s3); }
.spread.bleed-l .caption, .spread.bleed-r .caption { grid-column: auto; margin-top: 0; }

/* ── kenar notu: gerçek bilimsel aparat, ipuçlu ─────────────────────────── */

.prose { grid-column: 3 / 10; }
.prose p + p { margin-top: var(--s4); }
.marg { grid-column: 11 / 15; }
.note {
  font-size: var(--fs-tomb); line-height: 1.5; color: var(--ink-3);
  padding-left: var(--s3); border-left: 2px solid transparent;
  transition: color 200ms var(--ease), border-color 200ms var(--ease);
}
.note + .note { margin-top: var(--s4); }
.note .n { font-family: var(--mono); color: var(--ink-4); margin-right: .4em; }
sup.ref {
  font-family: var(--mono); font-size: .62em; letter-spacing: 0;
  color: var(--ink-3); cursor: pointer;
  vertical-align: super; line-height: 0;
  background: none; border: 0; padding: 0 .1em;
  transition: color 200ms var(--ease);
}
.tether-on .note, sup.ref.tether-on { color: var(--accent); }
.tether-on.note { border-left-color: var(--accent); }

@media (max-width: 69.99rem) {
  .marg {
    margin-top: var(--s5);
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding-block: var(--s4);
  }
}

/* ── alıntı ──────────────────────────────────────────────────────────────── */

.pull { padding-block: var(--s7); }
.pull blockquote {
  grid-column: 2 / 14; margin: 0;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding-block: var(--s6);
  font-size: var(--fs-quote); font-weight: 200; font-style: italic;
  line-height: 1.16; letter-spacing: -.025em; color: var(--ink);
  font-variation-settings: "opsz" 72;
  text-wrap: balance;
}
.pull .src { grid-column: 2 / 14; margin-top: var(--s4); }

/* ── ÖLÇEK kipi: gerçek göreli boyut + 170 cm insan boyu çizgisi ─────────── */

.spread.scaled .plate-box { justify-content: flex-start; }
.spread.scaled .k-fig {
  width: var(--scaled-w);
  max-height: none;
  transition: width 700ms var(--ease);
}
.datum {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: var(--datum-h); pointer-events: none;
  border-top: 1px dashed var(--accent);
  opacity: 0; transition: opacity 400ms var(--ease);
}
.spread.scaled .datum { opacity: .75; }
.datum span {
  position: absolute; top: -1.5em; right: 0;
  font-family: var(--mono); font-size: var(--fs-folio);
  letter-spacing: .14em; color: var(--accent);
}

/* ── palet ───────────────────────────────────────────────────────────────── */

#palet { padding-block: var(--s8); }
#palet h2, #katalog h2, #ozgecmis h2, #kolofon h2 {
  grid-column: 2 / 14;
  font-size: var(--fs-h2); font-weight: 400; font-style: italic;
  line-height: 1.08; letter-spacing: -.02em; color: var(--ink);
  font-variation-settings: "opsz" 72;
}
#palet .list { grid-column: 2 / 14; margin-top: var(--s6); }
#palet .prow {
  display: grid; gap: var(--s4);
  grid-template-columns: 22px 12rem 5rem 1fr;
  align-items: start;
  border-top: 1px solid var(--rule);
  padding-top: var(--s3); padding-bottom: var(--s4);
}
@media (max-width: 47.99rem) {
  #palet .prow { grid-template-columns: 22px 1fr; }
  #palet .prow .ci { grid-column: 2; }
  #palet .prow .why { grid-column: 2; }
}
#palet .sw { width: 22px; height: 22px; border: 1px solid var(--rule); }
#palet .nm { color: var(--ink); }
#palet .ci { font-family: var(--mono); font-size: var(--fs-tomb); color: var(--ink-3); }
#palet .why { font-size: var(--fs-tomb); color: var(--ink-3); line-height: 1.5; }

/* ── katalog ─────────────────────────────────────────────────────────────── */

#katalog { padding-block: var(--s8); }
#katalog .idx { grid-column: 2 / 14; margin-top: var(--s6); }
@media (min-width: 70rem) { #katalog .idx { columns: 3; column-gap: calc(var(--gutter) * 2); } }
#katalog .krow {
  break-inside: avoid; padding-bottom: var(--s4);
  padding-left: 3.2rem; text-indent: -3.2rem;
  font-size: var(--fs-tomb); line-height: 1.55; color: var(--ink-3);
}
#katalog .krow .kn { font-family: var(--mono); color: var(--ink-4); }
#katalog .krow i { font-style: italic; color: var(--ink); }

/* ── özgeçmiş ────────────────────────────────────────────────────────────── */

#ozgecmis { padding-block: var(--s8); }
#ozgecmis .who { grid-column: 2 / 8; margin-top: var(--s6); }
#ozgecmis .cv  { grid-column: 9 / 15; margin-top: var(--s6); }
@media (max-width: 69.99rem) { #ozgecmis .cv { margin-top: var(--s6); } }
#ozgecmis .cvrow {
  display: grid; grid-template-columns: 4rem 1fr; gap: var(--s3);
  border-top: 1px solid var(--rule);

/* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();

document.querySelectorAll('.opener .ctrl-btn').forEach((btn) => {
  const fi = btn.closest('.opener').dataset.fascicle;
  btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(on));
    btn.textContent = on ? 'Sayfa ölçeği' : 'Gerçek ölçek';
    applyScale(fi, on);
  });
});

function applyScale(fi, on) {
  const spreads = [...document.querySelectorAll(`.spread[data-fascicle="${fi}"][data-slug]`)];
  if (!spreads.length) return;
  const works = spreads.map(s => K.workBySlug(s.dataset.slug));
  const maxW = Math.max(...works.map(w => w.cw));

  spreads.forEach((sp, i) => {
    const w = works[i];
    if (!on) {
      sp.classList.remove('scaled');
      sp.style.removeProperty('--scaled-w');
      sp.style.removeProperty('--datum-h');
      return;
    }
    const boxW = sp.querySelector('.plate-box').clientWidth -
                 parseFloat(getComputedStyle(sp.querySelector('.plate-box')).paddingLeft) * 2;
    const pxPerCm = boxW / maxW;
    sp.style.setProperty('--scaled-w', (w.cw / maxW * 100) + '%');
    sp.style.setProperty('--datum-h', (170 * pxPerCm) + 'px');
    sp.classList.add('scaled');
  });
}

addEventListener('resize', () => {
  document.querySelectorAll('.opener .ctrl-btn[aria-pressed="true"]').forEach((b) => {
    applyScale(b.closest('.opener').dataset.fascicle, true);
  });
}, { passive: true });

/* ── kenar notu ipi ──────────────────────────────────────────────────────── */

function tether(id, on) {
  document.querySelectorAll(`[data-note="${id}"]`).forEach((el) => {
    el.classList.toggle('tether-on', on);
  });
}
document.querySelectorAll('[data-note]').forEach((el) => {
  const id = el.dataset.note;
  el.addEventListener('pointerenter', () => tether(id, true));
  el.addEventListener('pointerleave', () => tether(id, false));
  el.addEventListener('focus', () => tether(id, true));
  el.addEventListener('blur', () => tether(id, false));
});

/* ── dikiş (sırt) + başlık şeridi ────────────────────────────────────────── */

const dikis = document.getElementById('dikis');
const headEl = document.getElementById('head');
const openers = [...document.querySelectorAll('.opener')];

function drawSpine() {
  dikis.innerHTML = '';
  const docH = document.documentElement.scrollHeight;
  openers.forEach((op, i) => {
    const next = openers[i + 1];
    const top = op.offsetTop;
    const bottom = next ? next.offsetTop : docH;
    const seg = K.el('div', 'seg');
    seg.dataset.fascicle = i;
    seg.style.top = (top / docH * 100) + '%';
    seg.style.height = ((bottom - top) / docH * 100) + '%';
    dikis.appendChild(seg);
  });
  document.querySelectorAll('.spread[data-slug]').forEach((sp) => {
    const t = K.el('div', 'tick');
    t.style.top = (sp.offsetTop / docH * 100) + '%';
    dikis.appendChild(t);
  });
}

let raf = false;
function onScroll() {
  if (raf) return;
  raf = true;
  requestAnimationFrame(() => {
    headEl.classList.toggle('is-scrolled', scrollY > 8);
    const mid = scrollY + innerHeight / 2;
    let active = 0;
    openers.forEach((op, i) => { if (op.offsetTop <= mid) active = i; });
    dikis.querySelectorAll('.seg').forEach((s) => {
      s.classList.toggle('on', Number(s.dataset.fascicle) === active);
    });
    const s = SITE.series[active];
    if (s) document.getElementById('runner').textContent =
      `${SITE.artist.mark} · FASİKÜL ${ROMAN[active]}`;
    raf = false;
  });
}

addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', drawSpine, { passive: true });
addEventListener('load', drawSpine);
drawSpine();
onScroll();
