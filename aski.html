<!doctype html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Askı</title>
<meta name="theme-color" content="#141210">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ASKI — bir asma kurgusu.
   Karanlık bir oda. Hareket eden tek şey ışık. Resim asla kıpırdamaz.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── jetonlar ─────────────────────────────────────────────────────────────
   Karanlık öncelikli tasarım: çıplak :root gece paletini taşır.
   Gündüz, sistem tercihi ve açık seçimi için ayrıca tanımlanır.         */

:root {
  color-scheme: dark light;

  --bg:            #141210;   /* duvar */
  --bg-deep:       #0A0908;   /* girintili yüzey, yakınlaştırma zemini */
  --surface:       #1D1A17;
  --text:          #F2EEE6;
  --text-2:        rgba(242,238,230,.62);
  --text-3:        rgba(242,238,230,.40);
  --hairline:      rgba(242,238,230,.14);
  --hairline-mid:  rgba(242,238,230,.24);
  --hairline-up:   rgba(242,238,230,.86);
  --accent:        #C2703A;   /* yanık siena — üç yerde harcanır, başka hiçbir yerde */
  --light-core:    rgba(255,236,206,.11);
  --light-edge:    rgba(255,236,206,0);
  --scrim:         rgba(10,9,8,.64);
  --shadow-key:    rgba(0,0,0,.55);

  --u:            clamp(20px, 4.4vw, 64px);
  --stage-h:      max(320px, min(74svh, calc(100svh - 17.5rem)));
  --caption-band: 10.5rem;
  --hang:         42%;        /* 152 cm asılma hattı */

  --s1: 4px;  --s2: 10px;  --s3: 20px;  --s4: 40px;  --s5: 72px;  --s6: 128px;

  --sans:  "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;

  --t-micro:     clamp(.6875rem, .66rem + .12vw, .75rem);
  --t-caption:   clamp(.8125rem, .78rem + .15vw, .875rem);
  --t-body:      clamp(.9375rem, .85rem + .38vw, 1.0625rem);
  --t-statement: clamp(1.125rem, 1rem + .53vw, 1.375rem);
  --t-title:     clamp(1.375rem, 1.19rem + .79vw, 1.75rem);
  --t-section:   clamp(1.5rem, 1.13rem + 1.58vw, 2.25rem);
  --t-chapter:   clamp(2.25rem, .96rem + 5.5vw, 4.5rem);
  --t-mark:      clamp(5rem, -.3rem + 22.6vw, 13rem);

  --ease:      cubic-bezier(.19, 1, .22, 1);
  --ease-ui:   cubic-bezier(.4, 0, .2, 1);
}

/* Gündüz: gece odasının karşıtı bir "white cube" — serin, nötr, gölgeli.
   Kasten sıcak krem DEĞİL; o dünya diğer prototipin (Fasikül).           */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:           #E9E9E7;
    --bg-deep:      #DDDDDA;
    --surface:      #F5F5F3;
    --text:         #17181A;
    --text-2:       rgba(23,24,26,.62);
    --text-3:       rgba(23,24,26,.42);
    --hairline:     rgba(23,24,26,.16);
    --hairline-mid: rgba(23,24,26,.28);
    --hairline-up:  rgba(23,24,26,.88);
    --accent:       #9C4E1E;
    --light-core:   rgba(23,24,26,.07);   /* gündüzde ışık gölgeye döner */
    --light-edge:   rgba(23,24,26,0);
    --scrim:        rgba(23,24,26,.55);
    --shadow-key:   rgba(23,24,26,.20);
  }
}

:root[data-theme="light"] {
  --bg:           #E9E9E7;
  --bg-deep:      #DDDDDA;
  --surface:      #F5F5F3;
  --text:         #17181A;
  --text-2:       rgba(23,24,26,.62);
  --text-3:       rgba(23,24,26,.42);
  --hairline:     rgba(23,24,26,.16);
  --hairline-mid: rgba(23,24,26,.28);
  --hairline-up:  rgba(23,24,26,.88);
  --accent:       #9C4E1E;
  --light-core:   rgba(23,24,26,.07);
  --light-edge:   rgba(23,24,26,0);
  --scrim:        rgba(23,24,26,.55);
  --shadow-key:   rgba(23,24,26,.20);
}

/* ── temel ───────────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: var(--t-body);
  line-height: 1.62;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  transition: background 420ms var(--ease-ui), color 420ms var(--ease-ui);
}

h1, h2, h3, p, figure, dl, dd { margin: 0; }
img { display: block; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: fixed; top: 8px; left: 8px; z-index: 90;
  padding: 10px 16px; background: var(--surface); color: var(--text);
  font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .11em;
  text-decoration: none; border: 1px solid var(--hairline);
  transform: translateY(-160%);
}
.skip:focus-visible { transform: none; }

.wrap { padding-inline: var(--u); max-width: 1440px; margin-inline: auto; }

/* yapışkan şerit başlıkları örtmesin */
[id] { scroll-margin-top: 92px; }

/* Tek hover fiili: saç çizgisi netleşir. Site genelinde başka hover yok. */
.hair { border-bottom: 1px solid var(--hairline); transition: border-color 180ms var(--ease-ui); }
@media (hover: hover) and (pointer: fine) {
  .hair:hover { border-bottom-color: var(--hairline-up); }
}
@media (hover: none) { .hair { border-bottom-color: var(--hairline-mid); } }

.micro {
  font-size: var(--t-micro); text-transform: uppercase;
  letter-spacing: .11em; font-weight: 500; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ── ışık katmanı ─────────────────────────────────────────────────────────
   Tek sabit radyal gradyan. Odanın spotu. Kaydırma onu aşağı yürütür.    */

#light {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(58vmax 44vmax at var(--lx, 50%) var(--ly, 40%),
              var(--light-core) 0%, var(--light-edge) 68%);
  transition: opacity 700ms var(--ease);
}

/* ── üst şerit: odaya göre ilerleme ─────────────────────────────────────── */

#prog {
  position: fixed; top: 0; left: 0; right: 0; height: 1px; z-index: 40;
  background: var(--hairline); pointer-events: none;
}
#prog i {
  display: block; height: 100%; width: 0; background: var(--accent);
  transform-origin: 0 50%;
  transition: width 400ms var(--ease);
}

/* ── gezinme ─────────────────────────────────────────────────────────────── */

#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s3);
  padding: var(--s3) var(--u);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 300ms var(--ease-ui), background 300ms var(--ease-ui);
}
#nav.is-scrolled { border-bottom-color: var(--hairline); }
#nav .mark {
  font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .17em;
  font-weight: 500; color: var(--text); text-decoration: none;
}
#nav .tools { display: flex; align-items: center; gap: var(--s3); }
#nav button {
  font: inherit; font-size: var(--t-micro); text-transform: uppercase;
  letter-spacing: .11em; font-weight: 500;
  background: none; border: 0; border-bottom: 1px solid var(--hairline);
  color: var(--text-2); padding: 2px 0; cursor: pointer;
  transition: border-color 180ms var(--ease-ui), color 180ms var(--ease-ui);
}
@media (hover: hover) and (pointer: fine) {
  #nav button:hover { border-bottom-color: var(--hairline-up); color: var(--text); }
}

/* ── eşik ────────────────────────────────────────────────────────────────── */

#esik {
  position: relative; z-index: 1;
  padding-block: calc(var(--s6) + var(--s4)) var(--s5);
  display: grid; gap: var(--s4); justify-items: center;
}
#esik .plate-wrap { width: 100%; display: flex; justify-content: center; }
#esik .line {
  display: flex; gap: var(--s3); flex-wrap: wrap; justify-content: center;
  text-align: center;
}

/* ── bölüm kartı (salon) ─────────────────────────────────────────────────── */

.salon-card {
  position: relative; z-index: 1;
  padding-block: clamp(5rem, 13vh, 11rem);
  display: grid; gap: var(--s3);
}
.salon-card .ghost {
  /* sağ kenarda: soldaki başlıkla çakışmasın */
  position: absolute; right: var(--u); top: 50%;
  transform: translate(0, calc(-50% + var(--par, 0px)));
  font-size: var(--t-mark); line-height: .82; letter-spacing: -.05em;
  font-weight: 400; color: var(--text);
  opacity: .07; pointer-events: none; user-select: none;
  font-variant-numeric: lining-nums;
}
.salon-card .body { position: relative; max-width: 34em; }
.salon-card h2 {
  font-size: var(--t-section); line-height: 1.08; letter-spacing: -.02em;
  font-weight: 400; text-transform: uppercase;
}
.salon-card .wall { color: var(--text-2); font-size: var(--t-caption); margin-top: var(--s2); }
.salon-card .datum {
  margin-top: var(--s3); color: var(--text-3);
  display: flex; align-items: center; gap: var(--s2);
}
.salon-card .datum::before {
  content: ""; width: 44px; height: 1px; background: var(--hairline-mid); flex: none;
}

/* ── sahne: her eserin durduğu yer ───────────────────────────────────────── */

.stage {
  position: relative; z-index: 1;
  padding-bottom: var(--s5);
}
.stage .frame { position: relative; height: var(--stage-h); }

/* 152 cm asılma hattı — her sahnede aynı yükseklikte, DUVARDA, eserin arkasında */
.stage .frame::after {
  content: ""; position: absolute; left: 0; right: 0; top: var(--hang);
  height: 1px; background: var(--light-core); pointer-events: none;
  z-index: 0;
}
/* zemin çizgisi — paralaks */
.stage .floor {
  position: absolute; left: calc(var(--u) * -1); right: calc(var(--u) * -1);
  bottom: 0; height: 1px; background: var(--hairline);
  transform: translateY(var(--par-floor, 0px));
}

.stage .plate {
  position: absolute; left: 50%; top: var(--hang);
  transform: translate(-50%, -50%);
  z-index: 1;
  cursor: zoom-in;
  background: none; border: 0; padding: 0;
  max-width: 100%;
}
.stage .plate .k-fig { margin: 0; }

/* kenar kalkışı — tuval duvardan hafifçe ayrılır ve kendi rengini duvara vurur */
.k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--tone);
  aspect-ratio: var(--ratio);
  box-shadow: 0 1px 0 var(--shadow-key),
              0 46px 96px -34px color-mix(in srgb, var(--tone) 34%, transparent);
}
.k-lqip, .k-full {
  display: block; width: 100%; height: 100%; object-fit: cover;
}
.k-full {
  position: absolute; inset: 0; opacity: 0;
  transition: opacity 600ms var(--ease-ui);
}
.k-fig.is-loaded .k-full { opacity: 1; }
.k-fig.is-loaded .k-lqip { opacity: 0; transition: opacity 600ms var(--ease-ui); }

/* Yüzde KULLANMA: .plate mutlak konumlu ve içeriğe göre daralıyor, yüzde
   oradan okunursa genişlik kendi kendine bağlanıp sıfıra çöküyor.
   Genişliği sahne yüksekliği ve görüntü alanından türet; yüksekliği
   aspect-ratio versin.                                                    */
.stage .plate .k-fig {
  width: min(calc(var(--stage-h) * .86 * var(--ratio)),
             calc(100vw - var(--u) * 2));
  height: auto;
}

/* künye — resme doğru sürüklenir ve yerine oturur */
.stage .tomb {
  position: relative;
  min-height: var(--caption-band);
  padding-top: var(--s2);
  transform: translateY(var(--par-tomb, 0px));
  display: grid; gap: var(--s1);
  max-width: 42em;
}
.stage .tomb h3 {
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: var(--t-title); line-height: 1.14; letter-spacing: -.01em;
}
.stage .tomb .meta { color: var(--text-2); font-size: var(--t-caption); }
.stage .tomb .note {
  color: var(--text-3); font-size: var(--t-caption);
  font-family: var(--serif); font-style: italic; font-weight: 300;
  max-width: 34em; margin-top: var(--s1);
}
.stage .tomb .row { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none;
}
.dot.off { background: var(--text-3); }

.zoom-pill {
  position: absolute; right: 0; bottom: var(--s3);
  font: inherit; font-size: var(--t-micro); text-transform: uppercase;
  letter-spacing: .11em; font-weight: 500; color: var(--text-2);
  background: none; border: 0; border-bottom: 1px solid var(--hairline);
  padding: 2px 0; cursor: pointer;
  transition: border-color 180ms var(--ease-ui), color 180ms var(--ease-ui);
}
@media (hover: hover) and (pointer: fine) {
  .zoom-pill:hover { border-bottom-color: var(--hairline-up); color: var(--text); }
}

/* ── duvar yazısı ────────────────────────────────────────────────────────── */

#duvar {
  position: relative; z-index: 1;
  background: var(--bg-deep);
  padding-block: clamp(5rem, 13vh, 11rem);
  margin-block: var(--s5);
}
#duvar .cols { display: grid; gap: var(--s5); align-items: start; }
@media (min-width: 56.25rem) { #duvar .cols { grid-template-columns: 1fr 1fr; gap: var(--s5); } }
#duvar p {
  font-family: var(--serif); font-weight: 300; font-size: var(--t-statement);
  line-height: 1.62; max-width: 36em; margin-bottom: var(--s3);
}
#duvar p:last-child { margin-bottom: 0; }

/* ── envanter ────────────────────────────────────────────────────────────── */

#envanter { position: relative; z-index: 1; padding-block: clamp(5rem, 13vh, 11rem); }
#envanter .head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s3); flex-wrap: wrap;
  padding-bottom: var(--s3); border-bottom: 1px solid var(--hairline);
  margin-bottom: var(--s5);
}
#envanter h2 {
  font-size: var(--t-section); line-height: 1.08; letter-spacing: -.02em;
  font-weight: 400; text-transform: uppercase;
}
.grid {
  display: grid; gap: var(--s5) calc(var(--u) / 2);
  grid-template-columns: repeat(2, 1fr);
}
@media (min-width: 36rem)    { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 56.25rem) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 75rem)    { .grid { grid-template-columns: repeat(6, 1fr); } }

.cell { display: grid; gap: var(--s2); }
.cell button {
  aspect-ratio: 1; display: grid; place-items: center;
  background: none; border: 0; padding: 0; cursor: zoom-in; width: 100%;
}
/* fiziksel ölçek, sıkıştırılmış: sıralama korunur, hiçbir eser pul olmaz */
.cell .k-fig { width: var(--cw); height: auto; }
.cell .cap { display: grid; gap: 2px; }
.cell .cap b {
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: var(--t-caption); line-height: 1.3;
}
.cell .cap span { font-size: var(--t-micro); color: var(--text-3); }

/* ── biyografi & künye ───────────────────────────────────────────────────── */

#bio { position: relative; z-index: 1; padding-block: clamp(5rem, 13vh, 11rem); }
#bio .cols { display: grid; gap: var(--s5); }
@media (min-width: 56.25rem) { #bio .cols { grid-template-columns: 2fr 3fr; } }
#bio p { color: var(--text-2); max-width: 34em; margin-bottom: var(--s3); }
#bio dl { display: grid; gap: 0; }
#bio .cv-row {
  display: grid; grid-template-columns: 4.5rem 1fr; gap: var(--s3);
  padding-block: var(--s3); border-top: 1px solid var(--hairline);
}
#bio .cv-row dt { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: var(--t-caption); }
#bio .cv-row dd i { font-family: var(--serif); font-weight: 300; font-style: italic; }
#bio .cv-row dd span { display: block; color: var(--text-3); font-size: var(--t-caption); }

#kunye {
  position: relative; z-index: 1;
  border-top: 1px solid var(--hairline);
  padding-block: var(--s5);
  display: grid; gap: var(--s4);
}
#kunye .rows { display: grid; gap: var(--s2); }
#kunye a { color: var(--text); text-decoration: none; }
#kunye .notice {
  color: var(--text-3); font-size: var(--t-caption); max-width: 46em;
  border-left: 1px solid var(--hairline); padding-left: var(--s3);
}

/* ── yakınlaş katmanı ────────────────────────────────────────────────────── */

#zoom {
  position: fixed; inset: 0; z-index: 60;
  background: #0A0908; color: #F2EEE6;   /* tam daldırma her iki temada da gece */
  overscroll-behavior: contain;
}
/* display kuralı asla [hidden]'ı ezmemeli — çocuklar zaten mutlak konumlu */
#zoom[hidden] { display: none; }
#zoom .canvas {
  position: absolute; inset: 0; overflow: hidden;
  cursor: grab; touch-action: none;
}
#zoom .canvas.dragging { cursor: grabbing; }
#zoom .canvas img {
  position: absolute; top: 50%; left: 50%;
  transform-origin: center;
  max-width: none; user-select: none; -webkit-user-drag: none;
}
#zoom .bar {
  position: absolute; left: var(--u); right: var(--u); top: var(--s3);
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3);
}
#zoom .bar .t { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: var(--t-title); }
#zoom button {
  font: inherit; font-size: var(--t-micro); text-transform: uppercase;
  letter-spacing: .11em; font-weight: 500; color: rgba(242,238,230,.62);
  background: none; border: 0; border-bottom: 1px solid rgba(242,238,230,.14);
  padding: 2px 0; cursor: pointer; transition: border-color 180ms var(--ease-ui), color 180ms var(--ease-ui);
}
@media (hover: hover) and (pointer: fine) {
  #zoom button:hover { border-bottom-color: rgba(242,238,230,.86); color: #F2EEE6; }
}
/* canlı cetvel — 10 cm, her karede yeniden hesaplanır */
#zoom .rule {
  position: absolute; left: var(--u); bottom: var(--s4);
  display: grid; gap: 6px; pointer-events: none;
}
#zoom .rule .bar-line {
  height: 1px; background: rgba(242,238,230,.86); position: relative;
}
#zoom .rule .bar-line::before, #zoom .rule .bar-line::after {
  content: ""; position: absolute; bottom: 0; width: 1px; height: 6px;
  background: rgba(242,238,230,.86);
}
#zoom .rule .bar-line::before { left: 0; }
#zoom .rule .bar-line::after  { right: 0; }
#zoom .rule span { font-size: var(--t-micro); letter-spacing: .11em; color: rgba(242,238,230,.62); }
/* seyir haritası */
#zoom .nav-map {
  position: absolute; right: var(--u); bottom: var(--s4);
  width: 88px; border: 1px solid rgba(242,238,230,.14);
  pointer-events: none; overflow: hidden;
}
#zoom .nav-map img { width: 100%; display: block; opacity: .5; }
#zoom .nav-map i {
  position: absolute; border: 1px solid #F2EEE6;
  box-shadow: 0 0 0 9999px rgba(10,9,8,.62);
}

/* ── menü: oda listesi, dört satır, başka bir şey değil ─────────────────── */

#menu {
  position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 96%, transparent);
  backdrop-filter: blur(20px);
  padding: calc(var(--s5) + var(--s4)) var(--u) var(--s5);
  overflow-y: auto;
}
#menu[hidden] { display: none; }
#menu .inner {
  max-width: 1440px; margin-inline: auto;
  display: grid; gap: var(--s4);
}
#menu .grp { display: grid; gap: var(--s3); }
#menu .grp + .grp {
  border-top: 1px solid var(--hairline); padding-top: var(--s4);
}
#menu a {
  color: var(--text); text-decoration: none;
  display: flex; align-items: baseline; gap: var(--s3);
  font-size: clamp(1.5rem, 1.1rem + 1.7vw, 2.25rem);
  line-height: 1.12; letter-spacing: -.02em; font-weight: 400;
  border-bottom: 1px solid transparent;
  transition: border-color 180ms var(--ease-ui), color 180ms var(--ease-ui);
  padding-bottom: 4px;
}
#menu a .no {
  font-size: var(--t-micro); letter-spacing: .11em; color: var(--text-3);
  flex: none; width: 2.4rem; font-variant-numeric: tabular-nums;
}
#menu a .sub { font-size: var(--t-caption); color: var(--text-3); letter-spacing: 0; }
@media (hover: hover) and (pointer: fine) {
  #menu a:hover { border-bottom-color: var(--hairline-up); }
}
#menu .close {
  position: absolute; top: var(--s3); right: var(--u);

/* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();

/* ── ışık, paralaks, ilerleme: tek rAF döngüsü ───────────────────────────── */

const lightEl  = document.getElementById('light');
const progFill = document.querySelector('#prog i');
const navEl    = document.getElementById('nav');
const stages   = [...document.querySelectorAll('.stage')];
const cards    = [...document.querySelectorAll('.salon-card')];
const reduced  = K.reduced();

let targetY = 40, currentY = 40, cursorX = 50, ticking = false;

if (!reduced && matchMedia('(pointer: fine)').matches) {
  addEventListener('pointermove', (e) => {
    cursorX = 50 + ((e.clientX / innerWidth) - 0.5) * 16;  /* %8 imleç etkisi */
  }, { passive: true });
}

function measure() {
  const vh = innerHeight;
  navEl.classList.toggle('is-scrolled', scrollY > 8);

  /* ışığın hedefi: görünür sahnenin merkezi */
  let best = null, bestD = Infinity;
  for (const st of stages) {
    const r = st.querySelector('.frame').getBoundingClientRect();
    const c = r.top + r.height * 0.42;
    const d = Math.abs(c - vh * 0.45);
    if (d < bestD) { bestD = d; best = c; }
  }
  targetY = best === null ? 40 : (best / vh) * 100;

  /* paralaks: yalnızca görünür öğeler */
  for (const st of stages) {
    const r = st.getBoundingClientRect();
    if (r.bottom < -200 || r.top > vh + 200) continue;
    const p = (r.top + r.height / 2 - vh / 2) / vh;   /* -1 .. 1 */
    if (!reduced) {
      st.style.setProperty('--par-tomb', (p * -18) + 'px');
      st.style.setProperty('--par-floor', (p * 34) + 'px');
    }
  }
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    if (r.bottom < -300 || r.top > vh + 300) continue;
    const p = (r.top + r.height / 2 - vh / 2) / vh;
    if (!reduced) c.style.setProperty('--par', (p * 64) + 'px');
  }

  /* oda başına ilerleme — sayfanın tamamı değil */
  let room = null;
  for (const st of stages) {
    const r = st.getBoundingClientRect();
    if (r.top < vh * 0.5 && r.bottom > 0) room = st.dataset.room;
  }
  if (room !== null) {
    const inRoom = stages.filter(s => s.dataset.room === room);
    const first = inRoom[0].getBoundingClientRect().top;
    const last  = inRoom[inRoom.length - 1].getBoundingClientRect().bottom;
    const span  = last - first;
    const done  = Math.min(1, Math.max(0, (vh * 0.5 - first) / span));
    progFill.style.width = (done * 100) + '%';
  } else {
    progFill.style.width = '0%';
  }

  ticking = false;
}

function loop() {
  currentY += (targetY - currentY) * (reduced ? 1 : 0.08);
  lightEl.style.setProperty('--ly', currentY.toFixed(2) + '%');
  lightEl.style.setProperty('--lx', cursorX.toFixed(2) + '%');
  requestAnimationFrame(loop);
}

addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(measure); }
}, { passive: true });
addEventListener('resize', measure, { passive: true });
measure();
requestAnimationFrame(loop);

/* ── yakınlaş ────────────────────────────────────────────────────────────── */

const zoomEl = document.getElementById('zoom');
let releaseTrap = null, zoomState = null;

function openZoom(w) {
  zoomEl.innerHTML = '';
  const canvas = K.el('div', 'canvas');
  const img = new Image();
  img.src = w.src;
  img.alt = `${w.title}, ${w.year}`;
  img.draggable = false;
  canvas.appendChild(img);

  const bar = K.el('div', 'bar');
  bar.innerHTML = `<div><div class="t">${w.title}</div>` +
                  `<div class="micro" style="color:rgba(242,238,230,.4);margin-top:4px">${w.year} · ${w.size}</div></div>`;
  const close = K.el('button', null, 'Kapat');
  close.type = 'button';
  close.addEventListener('click', closeZoom);
  bar.appendChild(close);

  const rule = K.el('div', 'rule');
  rule.innerHTML = `<div class="bar-line"></div><span>10 CM</span>`;

  const map = K.el('div', 'nav-map');
  const mimg = new Image(); mimg.src = w.lqip; mimg.alt = '';
  const mbox = K.el('i');
  map.append(mimg, mbox);

  zoomEl.append(canvas, bar, rule, map);
  zoomEl.hidden = false;
  document.body.style.overflow = 'hidden';

  zoomState = { w, img, canvas, rule, map, mbox, scale: 1, x: 0, y: 0, base: 1 };

  const fit = () => {
    const vw = innerWidth, vh = innerHeight;
    zoomState.base = Math.min(vw * 0.88 / img.naturalWidth, vh * 0.82 / img.naturalHeight);
    apply();
  };
  img.decode ? img.decode().then(fit).catch(fit) : (img.onload = fit);

  close.focus();
  releaseTrap = K.trap(zoomEl);
  addEventListener('keydown', onKey);
  bindPan(zoomState);
}

function apply() {
  const s = zoomState;
  if (!s) return;
  const k = s.base * s.scale;
  s.img.style.transform =
    `translate(calc(-50% + ${s.x}px), calc(-50% + ${s.y}px)) scale(${k})`;

  /* canlı cetvel: 10 cm kaç piksel */
  const renderedW = s.img.naturalWidth * k;
  const px = (10 / s.w.cw) * renderedW;
  s.rule.querySelector('.bar-line').style.width = Math.max(12, Math.min(innerWidth * 0.5, px)) + 'px';

  /* seyir haritası */
  const vw = innerWidth, vh = innerHeight;
  const rw = s.img.naturalWidth * k, rh = s.img.naturalHeight * k;
  const mapW = 88, mapH = mapW / s.w.ratio;
  s.map.style.height = mapH + 'px';
  const bw = Math.min(1, vw / rw), bh = Math.min(1, vh / rh);
  s.mbox.style.width  = (bw * mapW) + 'px';
  s.mbox.style.height = (bh * mapH) + 'px';
  s.mbox.style.left = ((0.5 - s.x / rw - bw / 2) * mapW) + 'px';
  s.mbox.style.top  = ((0.5 - s.y / rh - bh / 2) * mapH) + 'px';
}

function bindPan(s) {
  let down = false, px = 0, py = 0;
  s.canvas.addEventListener('pointerdown', (e) => {
    down = true; px = e.clientX; py = e.clientY;
    s.canvas.classList.add('dragging');
    s.canvas.setPointerCapture(e.pointerId);
    s.img.style.transition = 'none';
  });
  s.canvas.addEventListener('pointermove', (e) => {
    if (!down) return;
    s.x += e.clientX - px; s.y += e.clientY - py;
    px = e.clientX; py = e.clientY;
    apply();
  });
  const up = () => {
    down = false;
    s.canvas.classList.remove('dragging');
    s.img.style.transition = 'transform 120ms ease-out';
  };
  s.canvas.addEventListener('pointerup', up);
  s.canvas.addEventListener('pointercancel', up);
  s.canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const next = Math.min(4, Math.max(1, s.scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    s.scale = next;
    if (next === 1) { s.x = 0; s.y = 0; }
    apply();
  }, { passive: false });
}

function onKey(e) {
  if (e.key === 'Escape') closeZoom();
}

function closeZoom() {
  zoomEl.hidden = true;
  zoomEl.innerHTML = '';
  document.body.style.overflow = '';
  removeEventListener('keydown', onKey);
  if (releaseTrap) { releaseTrap(); releaseTrap = null; }
  zoomState = null;
}
