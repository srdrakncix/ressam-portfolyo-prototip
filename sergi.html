<!doctype html>
<html lang="tr">
<head>
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sergi Duvarı — Cemal Sağlam</title>
<meta name="theme-color" content="#14211c">
<meta name="description" content="Eserler bir Fransız salonu duvarında, gerçek santimetre ölçeğinde asılı.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SERGİ DUVARI — şato resim galerisi.
   Koyu şişe yeşili damask, ahşap lambri, kornis, altın çerçeveler.
   Gerçek 3B perspektif (CSS transform), WebGL YOK: tablolar tam çözünürlüklü
   <img> olarak kalıyor, fare/klavye/ekran okuyucu bedavaya geliyor.
   Hareket yalnızca YANAL — dönme yok, mide bulandırmaz.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --yesil-koyu:  #14211c;
  --yesil:       #1d3229;
  --yesil-acik:  #274437;
  --ahsap:       #2a1d14;
  --ahsap-acik:  #4a3524;
  --altin:       #c9a86a;
  --altin-koyu:  #7a5f2f;
  --altin-parlak:#e6d2a0;
  --krem:        #efe8da;
  --krem-sol:    rgba(239,232,218,.62);

  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Cormorant Garamond", Garamond, "EB Garamond", Georgia, serif;
  --ease: cubic-bezier(.19, 1, .22, 1);

  --duvar-h: 300;   /* duvarın gerçek yüksekliği, cm */
  --hat: 152;       /* asılma hattı, cm */
  --ppc: 2.2;       /* piksel / santimetre — JS ayarlıyor */
}

* { box-sizing: border-box; }

html { background: var(--yesil-koyu); }
html.kilitli, html.kilitli body {
  height: 100%; overflow: hidden;         /* dar ekranda dikey kaydırma yok */
  overscroll-behavior: none;
}
html.kilitli body { touch-action: none; } /* her hareket duvarı sürükler */

body {
  touch-action: pan-y;
  margin: 0; color: var(--krem);
  font: 400 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── oda: perspektifin kaynağı ───────────────────────────────────────────── */

#oda {
  position: fixed; inset: 0; z-index: 1;
  perspective: 2000px;
  perspective-origin: 50% 44%;
  overflow: hidden;
  background:
    radial-gradient(ellipse 120% 90% at 50% 120%, rgba(0,0,0,.55), transparent 60%),
    linear-gradient(#0d1714, #14211c 55%, #0b1310);
}

/* ── duvar ───────────────────────────────────────────────────────────────── */

#duvar {
  position: absolute; top: 0; left: 0; height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
}

/* Duvar segmentleri: her biri gerçek bir salon duvarı görseli.
   Korniş, panel, boiserie, parke — hepsi görselin içinde. */
.segment {
  position: absolute; top: 0;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}
/* okunurluk için çok hafif koyultma ve zemin gölgesi */
#yansima {
  position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.30));
  pointer-events: none;
}

/* ── eserler ─────────────────────────────────────────────────────────────── */

.eser {
  position: absolute;
  transform-style: preserve-3d;
  background: none; border: 0; padding: 0; cursor: pointer;
  transition: transform 520ms var(--ease), filter 380ms var(--ease);
  transform: translateZ(0);
}
.cerceve {
  position: absolute; inset: 0; box-sizing: border-box;
  /* GERÇEK ÇERÇEVE: oyma Louis XV yaldız, 9-dilim border-image.
     Köşe kartuşları bozulmadan kalır, kenar pervazı gerilir — bu yüzden
     her en-boy oranındaki tabloya aynı çerçeve doğru biçimde oturur.
     --bw çerçeve kalınlığı; boyutla() tablonun genişliğine göre yazar. */
  --bw: 20px;
  --yaldiz: url('assets/cerceve/yaldiz-a.webp');
  border: var(--bw) solid transparent;
  border-image: var(--yaldiz) 132 140 stretch;
  background: #100c08;                       /* tuvalin arkası */
  box-shadow:
    0 1px 0 rgba(0,0,0,.6),
    0 3px 5px rgba(0,0,0,.5),                /* temas gölgesi */
    0 22px 40px -16px rgba(0,0,0,.8);
  transition: box-shadow 420ms var(--ease);
}
/* aynı çerçeve üç tonda dökülmüş — gerçek bir salonda hepsi birebir aynı olmaz */
.cerceve.t-b { --yaldiz: url('assets/cerceve/yaldiz-b.webp'); }
.cerceve.t-c { --yaldiz: url('assets/cerceve/yaldiz-c.webp'); }

.cerceve::before {                               /* kenarsız sıcak hâle */
  content: ""; position: absolute; inset: calc(var(--bw) * -1); pointer-events: none;
  box-shadow: 0 0 60px 26px rgba(255,226,175,.14);
  opacity: 0; transition: opacity 420ms var(--ease);
}
.cerceve::after {                                /* tuval ile pervaz arası gölge */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 2px 5px rgba(0,0,0,.45);
}
.eser img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* Tablonun üstüne düşen sıcak ışık.
   KUTU KENARI GÖRÜNMEMELİ: gradyan öğenin sınırına varmadan tamamen
   saydamlaşmalı, yoksa duvarda dikdörtgen bir leke belirir. Öğe büyük,
   gradyan %52'de biter. */
.isik {
  position: absolute; inset: -58% -52% -34%;
  background: radial-gradient(ellipse 46% 42% at 50% 30%,
    rgba(255,233,190,.26) 0%,
    rgba(255,228,180,.13) 22%,
    rgba(255,226,175,.045) 36%,
    rgba(255,226,175,0) 52%);
  opacity: .62; pointer-events: none;
  mix-blend-mode: soft-light;
  transition: opacity 420ms var(--ease);
}

/* fare üstüne gelince: duvardan kalkar, gölge derinleşir, ışık artar */
@media (hover: hover) and (pointer: fine) {
  .eser:hover, .eser:focus-visible { transform: translateZ(26px); }
  .eser:hover .cerceve, .eser:focus-visible .cerceve {
    box-shadow:
      0 1px 0 rgba(0,0,0,.6),
      0 6px 8px rgba(0,0,0,.5),
      0 44px 70px -22px rgba(0,0,0,.86);
  }
  .eser:hover .isik, .eser:focus-visible .isik { opacity: 1; }
  /* çerçeveye sıcak bir hâle: kenarı olmayan gerçek ışık */
  .eser:hover .cerceve::before, .eser:focus-visible .cerceve::before { opacity: 1; }
  /* komşular sönsün, dikkat toplansın */
  #duvar.odak .eser:not(:hover):not(:focus-visible) { filter: brightness(.62) saturate(.85); }
}

/* künye etiketi — duvarda, çerçevenin altında */
.etiket {
  position: absolute; left: 50%; top: calc(100% + 9px);
  transform: translateX(-50%) translateY(-4px);
  white-space: nowrap; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity 300ms var(--ease), transform 300ms var(--ease);
}
.etiket .a { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--krem); }
.etiket .o { font-size: 11px; color: var(--krem-sol); letter-spacing: .04em; margin-top: 2px; }
.eser:hover .etiket, .eser:focus-visible .etiket { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── duvar etiketi: lambrinin üstünde, pirinç levhaya kazınmış gibi ───────
   O kahverengi bant boştu. Müzede tam oraya yorum panosu konur.          */

#tabela {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: var(--tabela-y, 74%);
  width: min(700px, 86vw); text-align: center;
  z-index: 12; pointer-events: none;
  padding: 15px 68px 17px;               /* okların yeri */
  background: linear-gradient(158deg, rgba(30,34,27,.90), rgba(17,21,16,.94));
  border: 1px solid rgba(201,168,106,.44);
  box-shadow: 0 12px 34px rgba(0,0,0,.5),
              inset 0 1px 0 rgba(255,240,205,.14),
              inset 0 0 26px rgba(0,0,0,.35);
  transition: opacity 300ms var(--ease);
}
/* Künyenin iki yanındaki gezinme okları. Pirinç kartelin kendi diliyle:
   ince altın çerçeve, koyu dolgu, sıcak altın ok. */
.gezok {
  position: absolute; top: 50%; transform: translateY(-50%);
  pointer-events: auto;                  /* künye tıklanmaz, oklar tıklanır */
  width: 38px; height: 38px; padding: 0;
  display: grid; place-items: center;
  font: 400 17px/1 var(--sans); color: #d9bd7f;
  background: rgba(12,16,11,.55);
  border: 1px solid rgba(201,168,106,.42);
  border-radius: 50%;
  cursor: pointer;
  transition: background 260ms var(--ease), border-color 260ms var(--ease),
              color 260ms var(--ease), transform 260ms var(--ease);
}
.gezok[data-yon="-1"] { left: 15px; }
.gezok[data-yon="1"]  { right: 15px; }
@media (hover: hover) {
  .gezok:hover {
    background: rgba(201,168,106,.20);
    border-color: rgba(201,168,106,.85);
    color: #f6e7c4;
  }
  .gezok[data-yon="-1"]:hover { transform: translateY(-50%) translateX(-2px); }
  .gezok[data-yon="1"]:hover  { transform: translateY(-50%) translateX(2px); }
}
.gezok:active { background: rgba(201,168,106,.32); }

#tabela .ad {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(18px, 1rem + .6vw, 24px); color: #f4e9d2;
}
#tabela .cev {
  font-family: var(--serif); font-style: italic; font-size: 13px;
  color: rgba(244,233,210,.60); margin-top: 1px;
}
#tabela .sat {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(244,233,210,.55); margin-top: 6px;
}
#tabela .soz {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(13px, .82rem + .2vw, 15px); line-height: 1.55;
  color: rgba(246,236,216,.86); margin: 8px auto 0; max-width: 52ch;
}
#tabela .durum {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: #d0ab68; margin-top: 8px;
}
#tabela .bos {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(244,233,210,.42);
}

/* ── üst şerit ───────────────────────────────────────────────────────────── */

#ust {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 14px clamp(14px, 2.4vw, 28px); pointer-events: none;
}
#ust > * { pointer-events: auto; }
#ust a, #ust button {
  font: inherit; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--krem-sol); background: rgba(10,18,15,.55);
  border: 1px solid rgba(239,232,218,.18); padding: 9px 13px;
  cursor: pointer; text-decoration: none;
  transition: color 240ms, border-color 240ms;
}
#ust a:hover, #ust button:hover { color: var(--krem); border-color: rgba(239,232,218,.5); }
#ilerleme {
  position: fixed; left: 0; top: 0; height: 2px; z-index: 21;
  background: var(--altin); width: 0; transition: width 180ms linear;
}

/* ── detay katmanı ───────────────────────────────────────────────────────── */

/* Kapalıyken görünmemeli: pointer-events tek başına yetmiyor, oklar ve
   Kapat düğmesi duvarın üstünde duruyordu. */
/* ── DETAY: beyaz zeminde tam ekran ─────────────────────────────────────
   Eser duvardan koparılıp müze salonundan bir sergi kataloğuna geçiyor:
   beyaz zemin, büyük reprodüksiyon, künye sağ panelde. Duvardaki yaldız
   çerçeve burada yok — beyaz zeminde ağır durur ve asıl bakılacak şeyin
   önüne geçer. Eskiden tablo duvardaki yerinden "uçarak" geliyordu; beyaz
   zemin bir anda belirince o uçuşun tutunacağı bir bağlam kalmıyor, o
   yüzden sakin bir açılışla değiştirildi. */
#detay {
  position: fixed; inset: 0; z-index: 30;
  background: #faf9f6;
  display: grid;
  grid-template-columns: 1fr clamp(300px, 25vw, 400px);
  pointer-events: none; visibility: hidden; opacity: 0;
  transition: opacity 340ms var(--ease), visibility 0s linear 360ms;
}
#detay.acik {
  pointer-events: auto; visibility: visible; opacity: 1;
  transition: opacity 280ms var(--ease), visibility 0s;
}

#sahne {
  display: grid; place-items: center; min-width: 0;
  padding: clamp(22px, 3.4vw, 60px);
}
#buyuk {
  display: block; max-width: 100%;
  max-height: calc(100vh - 2 * clamp(22px, 3.4vw, 60px));
  box-shadow: 0 1px 3px rgba(24,20,14,.16), 0 30px 64px -22px rgba(24,20,14,.36);
  opacity: 0; transform: scale(.968);
  transition: opacity 340ms var(--ease), transform 520ms var(--ease);
}
#detay.acik #buyuk { opacity: 1; transform: none; }

/* künye paneli — koyu galeri paletinden çıkıp katalog tipografisine geçiyor */
#bilgi {
  background: #fff;
  border-left: 1px solid rgba(28,33,26,.12);
  padding: clamp(56px, 5vw, 78px) clamp(22px, 2.2vw, 40px) clamp(22px, 3vw, 40px);
  display: flex; flex-direction: column;
  overflow-y: auto; color: #1c211a;
}
#kunye .ad {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(23px, 1.3rem + .7vw, 31px); line-height: 1.15; color: #14180f;
}
#kunye .cev {
  font-family: var(--serif); font-style: italic; font-size: 14px;
  color: rgba(28,33,26,.52); margin-top: 4px;
}
#kunye .seri {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: #9a7d3f; margin-top: 20px;
}
#kunye dl {
  margin: 12px 0 0; padding-top: 14px;
  border-top: 1px solid rgba(28,33,26,.12);
  display: grid; grid-template-columns: auto 1fr; gap: 7px 16px;
  font-size: 12.5px; line-height: 1.5;
}
#kunye dt { color: rgba(28,33,26,.46); letter-spacing: .04em; }
#kunye dd { margin: 0; color: #23281d; font-variant-numeric: tabular-nums; }
#kunye .not {
  font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 1.62;
  color: rgba(28,33,26,.80); margin-top: 22px; padding-top: 18px;
  border-top: 1px solid rgba(28,33,26,.12);
}
#kunye .durum {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: #8a6d2e; margin-top: 18px;
}

#gez {
  margin-top: auto; padding-top: 26px;
  display: flex; align-items: center; gap: 14px;
}
#gez button {
  background: none; cursor: pointer;
  width: 38px; height: 38px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid rgba(28,33,26,.22); border-radius: 50%;
  color: #33392b; font: 400 16px/1 var(--sans);
  transition: background 240ms var(--ease), border-color 240ms var(--ease), color 240ms;
}
#gez button:hover { background: #1c211a; border-color: #1c211a; color: #fff; }
#sayac {
  font-size: 11px; letter-spacing: .14em; color: rgba(28,33,26,.5);
  font-variant-numeric: tabular-nums;
}
#kapat {
  position: absolute; top: 16px; right: clamp(14px, 2vw, 26px);
  background: none; border: 0; cursor: pointer;
  color: rgba(28,33,26,.55); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; padding: 10px;
  transition: color 240ms;
}
#kapat:hover { color: #1c211a; }

/* ── YAN LİSTE: duvarın kenarında sönük duran eser dizini ───────────────
   Kaydırmak tek gezinme yolu olmamalı; kişi neyin olduğunu bir bakışta
   görebilmeli ve doğrudan seçebilmeli. Sönük duruyor ki duvarın önüne
   geçmesin, fare üstüne gelince aydınlanıyor. */
#yanliste {
  position: fixed; left: 0; top: 50%;
  transform: translateY(-50%); z-index: 14;
  max-height: 74vh; overflow-y: auto;
  padding: 14px clamp(46px, 5vw, 86px) 14px clamp(12px, 1.6vw, 24px);
  /* Duruş hâlinde sol kenara düşen yumuşak bir vinyet: liste tablonun
     üstünde çıplak dursa okunmuyor, tabloyu da kirletiyordu. Vinyet hem
     yazıyı tutuyor hem kasıtlı bir kenar şeridi gibi duruyor. */
  background: linear-gradient(90deg, rgba(8,11,7,.62) 0%, rgba(8,11,7,.40) 52%,
                                     rgba(8,11,7,.14) 80%, rgba(8,11,7,0) 100%);
  opacity: .5;
  box-shadow: 0 0 0 rgba(0,0,0,0);
  transition: opacity 320ms var(--ease), background 320ms var(--ease),
              box-shadow 320ms var(--ease);
}
#yanliste:hover, #yanliste:focus-within {
  opacity: 1;
  background: linear-gradient(90deg, rgba(10,14,9,.95) 0%, rgba(10,14,9,.91) 56%,
                                     rgba(10,14,9,.60) 82%, rgba(10,14,9,0) 100%);
  box-shadow: 22px 0 44px -18px rgba(0,0,0,.6);
}
#liste { list-style: none; margin: 0; padding: 0; }
#liste a {
  display: block; text-decoration: none; padding: 5px 10px 5px 11px;
  border-left: 1px solid transparent;
  font-family: var(--serif); font-style: italic; font-size: 14.5px; line-height: 1.3;
  color: rgba(244,233,210,.74); white-space: nowrap;
  transition: color 200ms var(--ease), border-color 200ms var(--ease),
              background 200ms var(--ease);
}
#liste a .yil {
  font-family: var(--sans); font-style: normal; font-size: 10px;
  letter-spacing: .1em; color: rgba(244,233,210,.40); margin-left: 8px;
}
#liste a:hover { color: #fff8e8; border-color: var(--altin); background: rgba(201,168,106,.12); }
#liste a[aria-current="true"] { color: #f2dfb4; border-color: var(--altin); }
#liste a[aria-current="true"] .yil { color: rgba(242,223,180,.6); }
@media (max-width: 980px) { #yanliste { display: none; } }

/* ── gizli semantik katman ───────────────────────────────────────────────── */
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
:focus-visible { outline: 2px solid var(--altin); outline-offset: 4px; }

@media (max-width: 720px) {
  #detay { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #bilgi {
    border-left: 0; border-top: 1px solid rgba(28,33,26,.12);
    padding: 20px 18px 22px; max-height: 46vh;
  }
  #sahne { padding: 44px 14px 10px; }
  #buyuk { max-height: calc(54vh - 54px); }
  #tabela { width: 94vw; padding: 11px 50px 12px; }
  .gezok { width: 34px; height: 34px; font-size: 16px; }
  .gezok[data-yon="-1"] { left: 9px; }
  .gezok[data-yon="1"]  { right: 9px; }
  #tabela .ad  { font-size: 19px; }
  #tabela .sat { font-size: 10.5px; letter-spacing: .07em; }
  #tabela .soz { font-size: 12.5px; }
  #tabela .durum { font-size: 10px; }
  #ipucu { font-size: 10px; }
}

#ipucu {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 11;
  font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  color: rgba(239,232,218,.42); pointer-events: none;
  max-width: 92vw; text-align: center;
  transition: opacity 600ms var(--ease);
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>
<body>


<div id="oda">
  <div id="duvar">
    <div id="yansima"></div>
  </div>
</div>

<div id="tabela">
  <button class="gezok" type="button" data-yon="-1" aria-label="Önceki eser">←</button>
  <div id="tabelaic" aria-hidden="true"></div>
  <button class="gezok" type="button" data-yon="1" aria-label="Sonraki eser">→</button>
</div>
<div id="ilerleme"></div>

<div id="ust">
  <a href="mekan.html">Galeriden çık</a>
  <button id="hepsi" type="button">Başa dön</button>
</div>

<div id="ipucu">Kaydırarak duvar boyunca ilerleyin · tabloya tıklayın</div>

<div id="detay" aria-hidden="true">
  <div id="sahne"><img id="buyuk" alt=""></div>
  <aside id="bilgi">
    <div id="kunye"></div>
    <div id="gez">
      <button class="onceki" type="button" aria-label="Önceki eser">←</button>
      <span id="sayac"></span>
      <button class="sonraki" type="button" aria-label="Sonraki eser">→</button>
    </div>
  </aside>
  <button id="kapat" type="button">Kapat</button>
</div>

<nav id="yanliste" aria-label="Eserler"><ol id="liste"></ol></nav>
<p id="duyuru" class="gizli" aria-live="polite" aria-atomic="true"></p>

<noscript>
  <div style="position:relative;z-index:40;padding:60px 24px;max-width:34em;margin:0 auto">

anbul. Oil on canvas; series on twilight, weather and landscape."},"bio":["Cemal Sağlam was born in İzmir in 1987. He completed the painting department at Mimar Sinan Fine Arts University, then spent two years in Vienna studying classical oil technique.","He says he chose oil for its slowness. He works on a single canvas for months, leaves the layers to dry and returns to them. Most of the work is waiting.","Since 2016 he has painted in his studio in Bomonti, Istanbul. His work is held in private collections in Turkey, Austria and the Netherlands."],"statement":["When I begin a canvas I do not know what it will look like. I only know which light I am after: the half hour when the day has ended and night has not yet come. Until I find it, I keep covering the surface over.","Colour shifts as the layers dry, so it cannot be hurried. I spend about four months on a painting, and perhaps a third of that is actually spent applying paint. The rest is looking and waiting.","I do not think I paint landscapes. The landscape is a pretext; what matters is the weight of the air. A storm has a colour, and the aftermath of rain has another. I am trying to describe those."],"collections":["Ardıç Sanat Collection, Istanbul","Batı Kanat Contemporary Art Collection, Istanbul","Liman Cultural Centre, İzmir","Atelier Nordbahn Collection, Vienna","Van Doorn Collection, Rotterdam","Private collections · Turkey, Austria, the Netherlands"],"series":{"alacakaranlik":{"title":"Twilight","blurb":"Paintings of the short interval when the day has ended and night has not begun. Colour here does not describe something; it holds something disappearing."},"hava":{"title":"Weather","blurb":"Storm, rain, pressure. The atmosphere itself rather than the landscape. I put the air on the canvas first, the ground after."},"topografya":{"title":"Quiet Topography","blurb":"Land without people. Places where no one is present but someone clearly passed."},"sabah":{"title":"Morning","blurb":"The silver light series. The first half hour of morning, before colour settles."}},"works":{"64772":{"gloss":"Twilight","note":"The painting that gave the series its name."},"64736":{"gloss":"Autumn Wood","note":"An attempt at not explaining autumn with red."},"68792":{"gloss":"The Shore","note":"I painted the sea once. It came harder than land."},"64724":{"gloss":"The Heron","note":"The only movement on the water. I put it in last."},"68784":{"gloss":"Summer Morning","note":"I opened the green with yellow, not with more green."},"64764":{"gloss":"Morning in the Field","note":"The cloud is thick, yet the light still comes through. That is the hard part."},"64732":{"gloss":"Bearing Down","note":"Finished within an hour. That rarely happens."},"64748":{"gloss":"Sunlit Valley","note":"Distant light must be warmer than near light."},"65353":{"gloss":"Storm","note":"I worked on it through two winters. Both times in December."},"68388":{"gloss":"The Ridge","note":"I worked without knowing what lay behind the ridge."},"69844":{"gloss":"The Lonely Farm","note":"An empty house, an empty field. And yet someone seems to be there."}},"cv":[["2024","Alacakaranlık","Solo exhibition · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Solo exhibition · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Group exhibition · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Group exhibition · Liman Kültür Merkezi, İzmir"],["2021","Sessiz Topografya","Solo exhibition · Ardıç Sanat, İstanbul"],["2020","Katman","Group exhibition · Batı Kanat, İstanbul"],["2019","Slow Paint","Group exhibition · Atelier Nordbahn, Viyana"],["2018","İlk Katman","Solo exhibition · Payas Galeri, İzmir"]],"publications":[["2024","Alacakaranlık","Exhibition catalogue, 96 pp. Text: Nihal Erkut. Ardıç Sanat."],["2023","Hava Raporu","Exhibition catalogue, 64 pp. Payas Galeri."],["2022","Yavaş Boya","Interview · Sanat Dünyamız, issue 189, pp. 44–51."],["2021","Sessiz Topografya","Exhibition catalogue, 72 pp. Text: Kaan Bilen. Ardıç Sanat."], te":"Collection privée","avail_gone":"Non disponible","medium":"Huile sur toile","lbl_year":"Année","lbl_medium":"Technique","lbl_size":"Dimensions","noscript":"JavaScript est nécessaire pour afficher les œuvres.","meta_desc":"Cemal Sağlam est un peintre établi à Istanbul. Huile sur toile ; séries sur le crépuscule, le temps et le paysage."},"bio":["Cemal Sağlam est né à İzmir en 1987. Il est diplômé du département de peinture de l’université des beaux-arts Mimar Sinan, puis a passé deux ans à Vienne à étudier les techniques classiques de la peinture à l’huile.","Il dit avoir choisi l’huile pour sa lenteur. Il travaille des mois sur une même toile, laisse sécher les couches, y revient. L’essentiel du travail consiste à attendre.","Depuis 2016 il peint dans son atelier de Bomonti, à Istanbul. Ses œuvres figurent dans des collections privées en Turquie, en Autriche et aux Pays-Bas."],"statement":["Quand je commence une toile, je ne sais pas à quoi elle ressemblera. Je sais seulement quelle lumière je cherche : la demi-heure où le jour s’achève et où la nuit n’est pas encore venue. Jusqu’à la trouver, je recouvre.","La couleur change à mesure que les couches sèchent : on ne peut donc pas se presser. Je passe environ quatre mois sur un tableau, et le tiers peut-être de ce temps à poser de la peinture. Le reste, à regarder et à attendre.","Je ne crois pas peindre des paysages. Le paysage est un prétexte ; ce qui compte est le poids de l’air. Un orage a une couleur, l’après-pluie en a une autre. J’essaie de les décrire."],"collections":["Collection Ardıç Sanat, Istanbul","Collection d’art contemporain Batı Kanat, Istanbul","Centre culturel Liman, İzmir","Collection Atelier Nordbahn, Vienne","Collection Van Doorn, Rotterdam","Collections privées · Turquie, Autriche, Pays-Bas"],"series":{"alacakaranlik":{"title":"Crépuscule","blurb":"Peintures de ce bref intervalle où le jour s’achève et où la nuit n’a pas commencé. La couleur n’y décrit rien ; elle retient ce qui disparaît."},"hava":{"title":"Temps","blurb":"Orage, pluie, pression. L’atmosphère elle-même plutôt que le paysage. Je pose l’air sur la toile d’abord, le sol ensuite."},"topografya":{"title":"Topographie silencieuse","blurb":"Des terres sans personne. Des lieux où nul n’est présent mais où quelqu’un est manifestement passé."},"sabah":{"title":"Matin","blurb":"La série de la lumière d’argent. La première demi-heure du matin, avant que la couleur ne se fixe."}},"works":{"64772":{"gloss":"Crépuscule","note":"Le tableau qui a donné son nom à la série."},"64736":{"gloss":"Bois d’automne","note":"Une tentative de ne pas dire l’automne avec du rouge."},"68792":{"gloss":"Le rivage","note":"J’ai peint la mer une fois. Elle est venue plus difficilement que la terre."},"64724":{"gloss":"Le héron","note":"Le seul mouvement sur l’eau. Je l’ai mis en dernier."},"68784":{"gloss":"Matin d’été","note":"J’ai ouvert le vert avec du jaune, non avec du vert."},"64764":{"gloss":"Matin dans les champs","note":"Le nuage est épais, la lumière passe quand même. C’est là le difficile."},"64732":{"gloss":"L’imminence","note":"Achevé en une heure. Cela arrive rarement."},"64748":{"gloss":"Vallée ensoleillée","note":"La lumière lointaine doit être plus chaude que la proche."},"65353":{"gloss":"Tempête","note":"J’y ai travaillé deux hivers. Les deux fois en décembre."},"68388":{"gloss":"La crête","note":"J’ai travaillé sans savoir ce qu’il y avait derrière la crête."},"69844":{"gloss":"La ferme isolée","note":"Une maison vide, un champ vide. Et pourtant quelqu’un semble là."}},"cv":[["2024","Alacakaranlık","Exposition personnelle · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Exposition personnelle · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Exposition collective · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Exposition collective · Liman Kültür Merkezi, İzmir"],["2021","Sessiz Topografya","Exposition personnelle · Ardıç Sanat, İstanbul"],["2020","Katman","Exposition collective · Batı Kanat, İstanbul"],["2019","Slow Paint","Exposition collective · Atelier Nordbahn, Viyana"],["2018","İlk Katman","Exposition personnelle · Payas Galeri, İzmir"]],"publications":[["2024","Alacakaranlık","Catalogue d’exposition, 96 p. Texte : Nihal Erkut. Ardıç Sanat."],["2023","Hava Raporu","Catalogue d’exposition, 64 p. Payas Galeri."],["2022","Yavaş Boya","Entretien · Sanat Dünyamız, n° 189, p. 44–51."],["2021","Sessiz Topografya","Catalogue d’exposition, 72 p. Texte : Kaan Bilen. Ardıç Sanat."],["2019","Katmanın Sabrı","Essai · Annuaire du Kunstraum, Vienne. En allemand et en anglais."]],"press":[["2024","“Işığın çekildiği yerde durmak”","Ayşe Tunca · Cumhuriyet Kitap, novembre 2024"],["2024","“Bir tuval kaç kış bekler?”","Deniz Aksoy · Argonotlar, octobre 2024"],["2023","“Manzara değil, basınç”","Selim Arer · Sanat Dünyamız, mars 2023"],["2021","“Sessiz Topografya üzerine”","Kaan Bilen · e-skop, décembre 2021"]],"notice":"Ceci est un prototype de conception. L’identité de l’artiste et les textes sont fictifs ; les images sont des tableaux de George Inness du domaine public, issus des archives en libre accès de l’Art Institute of Chicago. Tout sera remplacé par les œuvres de l’artiste avant la mise en ligne."}},"backdrops":{"acilis":{"src":"assets/zemin/acilis.webp","palette":["#e5e7e2","#e7e9e4","#e4e7e2","#e6e7e3","#d2dfc4","#e8eae4","#e7eae4","#e6e9e4","#efeee4"]},"son":{"src":"assets/zemin/son.webp","palette":["#ebe4db","#e2e0db","#ebe5db","#e8e3db","#ddd6c1","#ddd4c0","#ddd3c1","#e3e1da","#e4e1da"]},"seri":{"src":"assets/zemin/seri.webp","palette":["#e8eae0","#e5e6df","#e9eadf","#e4e5df","#e7e8e0","#e0e2df","#e1e2de","#dee0dc","#e6e7e0"]},"atolye":{"src":"assets/zemin/atolye.webp","palette":["#e0d5c5","#e2daca","#e0d6c7","#e8e0d5","#e2d8c9","#e6ded1","#e0dac9","#e3dacc","#dfd7c5"]},"biyografi":{"src":"assets/zemin/biyografi.webp","palette":["#ded2c2","#d4d4d2","#dfd3c4","#d9d5c8","#d2d3d2","#d0d4ce","#d2d4cc","#e0d3c5","#dfd2c3"]},"sergiler":{"src":"assets/zemin/s /* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      } else {
        /* Varsayılan AÇIK: sistemi karanlıkta olan ziyaretçi de krem zemin
           görsün. Sistem tercihine uymak yerine bilinçli bir karar —
           düğme yine duruyor, isteyen koyuya geçer. */
        document.documentElement.dataset.theme = 'light';
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();


/* ── dil ─────────────────────────────────────────────────────────────────── */
const LANGS = ['tr', 'en', 'fr'];
let LANG = 'tr';
try { const s = localStorage.getItem('cs-lang'); if (LANGS.includes(s)) LANG = s; } catch (e) {}
const L = () => SITE.i18n[LANG] || SITE.i18n.tr;
const t = (k) => (L().ui && L().ui[k]) || SITE.i18n.tr.ui[k] || k;
document.documentElement.lang = LANG;

const WORKS = SITE.works;
/* N artık YERLER.length — yerleşim kurulduktan sonra tanımlanıyor. */
const $ = (s) => document.querySelector(s);

const oda = $('#oda'), duvar = $('#duvar');
const yansima = $('#yansima');

/* ── duvar birimleri ──────────────────────────────────────────────────────
   Duvar artık gerçek bir Fransız salonu görselinden kuruluyor. Panel
   koordinatları görselden ÖLÇÜLDÜ (dikey silme tespiti), göz kararı değil.
   Tablolar panellerin tam içine asılıyor.                                */

const BIRIM = {
  /* Tek karo, dikişi ölçülmüş.
     Karo duvardan rastgele bir x'ten kesilirse karonun sağ kenarı bir sonraki
     karonun sol kenarının devamı olmuyor: silmeler karşıya geçmiyor, süs
     motifleri ikiye bölünüyor, parke kırılıyordu. Ton eşitlemek bunu gizlemez.
     duvar.py karoyu düz duvardan kesiyor ve sağ ucuna sol ucun hemen solundaki
     şeridi kopyalıyor; böylece karo_N'in son sütunu ile karo_N+1'in ilk sütunu
     kaynakta yan yana iki piksel oluyor. Ölçülen ek farkı 0.94, duvarın kendi
     sütun farkının ortancası 1.67 — ek, dokunun içinde kayboluyor.
     ÖLÇÜLERİ ELLE DEĞİŞTİRME: duvar.py yeniden çalıştırılınca oradan gelir. */
  salon: {
    src: 'assets/duvar/salon.webp', en: 777, boy: 941,
    yuvalar: [ { cx: 0.3578, g: 0.6589 } ],
  },
};
const YUVA_CY = 0.4352;       // büyük panonun dikey merkezi (silmelerden ölçüldü)
const DOLULUK = 0.70;         // en geniş eser, panoyu bu oranda doldurur

/* Her karoda bir pano, her panoda bir eser. Şato galerisinde ritim düzenlidir;
   panoyu iki eserle bölmek duvarı kalabalık gösteriyordu. */
function yerlesim() {
  return { segmentler: WORKS.map((w) => ({ tip: 'salon', isler: [{ j: 0, w }] })) };
}

const { segmentler: SEGMENTLER } = yerlesim();

/* düz liste: künye, klavye ve erişilebilirlik bunun üstünden çalışıyor */
const YERLER = [];
SEGMENTLER.forEach((seg, si) => seg.isler.forEach(it =>
  YERLER.push({ w: it.w, si, j: it.j })));
const N = YERLER.length;

/* ── ölçülendirme ────────────────────────────────────────────────────────── */

let ppc = 2.2, duvarEnPx = 0;
const MERKEZLER = [];        // her eserin duvar üstündeki yatay merkezi

function boyutla() {
  const vh = innerHeight, vw = innerWidth;
  dar = vw < 720;                             // telefon ve dar tablet

  /* ÖLÇEK DAR EKRANDA GENİŞLİKTEN KURULUR.
     Duvarın yüksekliği aynı zamanda karonun genişliğini belirliyor; yükseklik
     ekrana göre seçilince telefonda tek panel bile kadraja sığmıyor, kişi
     pilastra burnunu dayamış gibi oluyordu. Dar ekranda büyük paneli ekranın
     ~%84'ü yapacak yüksekliği seçiyoruz; duvar üste yaslanıyor ve künye
     altında kalan boşluğa oturuyor (kullanıcının istediği alt bant). */
  const yuvaOran = BIRIM.salon.yuvalar[0].g * (BIRIM.salon.en / BIRIM.salon.boy);
  const duvarBoy = dar
    ? Math.round(Math.min(vh * 0.72, (vw * 0.78) / yuvaOran))
    : Math.round(vh * 0.94);
  const ustBosluk = dar ? Math.min(18, Math.round((vh - duvarBoy) * 0.14))
                        : Math.round((vh - duvarBoy) / 2);
  const enGenis = Math.max(...WORKS.map(w => w.cw));

  // segment genişlikleri ve konumları
  let x = 0;
  const konum = SEGMENTLER.map((seg) => {
    const b = BIRIM[seg.tip];
    const en = b.en * (duvarBoy / b.boy);
    const k = { x, en };
    x += en;
    return k;
  });
  duvarEnPx = x;

  const buyukYuvaPx = BIRIM.salon.yuvalar[0].g * (BIRIM.salon.en * (duvarBoy / BIRIM.salon.boy));
  ppc = (buyukYuvaPx * DOLULUK) / enGenis;

  duvar.style.height = duvarBoy + 'px';
  duvar.style.top = ustBosluk + 'px';
  duvar.style.width = duvarEnPx + 'px';

  // segment zeminleri
  duvar.querySelectorAll('.segment').forEach((el, i) => {
    const k = konum[i], b = BIRIM[SEGMENTLER[i].tip];
    el.style.left = k.x + 'px';
    el.style.width = k.en + 'px';
    el.style.height = duvarBoy + 'px';
    el.style.backgroundImage = 'url(' + b.src + ')';
  });

  // eserler yuvalarının tam ortasına
  duvar.querySelectorAll('.eser').forEach((el) => {
    const d = el._d, k = konum[d.si], b = BIRIM[SEGMENTLER[d.si].tip];
    const yv = b.yuvalar[d.j];
    const gp = d.w.cw * ppc, yp = d.w.ch * ppc;
    /* Çerçeve bandı tuvalin DIŞINA ekleniyor: tuval gerçek en-boy oranını
       korur, çerçeve etrafını sarar. Toplam ölçü yuvaya göre konumlanır. */
    const bw = Math.max(7, Math.min(30, gp * 0.075));
    const tg = gp + 2 * bw, ty = yp + 2 * bw;
    el.style.width = tg + 'px';
    el.style.height = ty + 'px';
    el.style.left = (k.x + yv.cx * k.en - tg / 2) + 'px';
    el.style.top = (YUVA_CY * duvarBoy - ty / 2) + 'px';
    el.querySelector('.cerceve').style.setProperty('--bw', bw.toFixed(1) + 'px');
    MERKEZLER[+el.dataset.i] = k.x + yv.cx * k.en;   // duvar koordinatında merkez
  });

  /* Künye: geniş ekranda duvarın lambri bandı hizasında; dar ekranda duvarın
     ALTINDAKİ boşlukta — tabloların üstünü kapatmasın, hep görünür kalsın. */
  document.documentElement.style.setProperty('--tabela-y',
    Math.round(dar ? ustBosluk + duvarBoy + 12
                   : ustBosluk + duvarBoy * 0.775) + 'px');
  document.documentElement.style.setProperty('--duvar-boy', duvarBoy + 'px');

  /* DAR EKRANDA DİKEY KAYDIRMA YOK.
     Duvarı sürmek için sayfayı dikey kaydırmak telefonda yanlış bir his
     veriyordu: parmağını yukarı çekince duvar yana gidiyordu. Artık gövde
     tam ekran boyunda, sayfa hiç kaymıyor; duvarı yalnız yatay parmak
     hareketi sürüyor. Geniş ekranda tekerlek çalışmaya devam ediyor. */
  document.documentElement.classList.toggle('kilitli', dar);
  document.body.style.height = dar
    ? '100%'
    : Math.max(vh * 1.2, duvarEnPx - vw + vh) + 'px';

  if (dar) guncelle(); else kaydir();

  /* Duvar sıfır noktasında pilastra denk geliyor, kişi eser yerine boş panel
     görüyordu. İlk açılışta ilk eseri kadraja alıyoruz. */
  if (ilkKurulum) { ilkKurulum = false; if (dar) merkezeAl(0); }
}

let ilkKurulum = true;

function merkezeAl(idx) {
  const el = duvar.querySelector('.eser[data-i="' + idx + '"]');
  if (!el) return;
  konumaGit(parseFloat(el.style.left) - innerWidth / 2 + parseFloat(el.style.width) / 2);
}

/* ── segmentleri ve eserleri kur ─────────────────────────────────────────── */

SEGMENTLER.forEach(() => {
  const d = document.createElement('div');
  d.className = 'segment';
  duvar.appendChild(d);
});

const TON = ['', 't-b', '', 't-c', 't-b', '', 't-c'];   // düzenli tekrar hissi vermesin
const liste = document.getElementById('liste');
YERLER.forEach((d, idx) => {

      '<img src="' + w.src + '" alt="" loading="lazy"></div>';

  b.addEventListener('click', () => ac(idx));
  b.addEventListener('pointerenter', () => { uzerinde = idx; duvar.classList.add('odak'); tabelaTazele();
    document.getElementById('ipucu').style.opacity = '0'; });
  b.addEventListener('pointerleave', () => { uzerinde = -1; duvar.classList.remove('odak'); tabelaTazele(); });
  b.addEventListener('mouseenter',  () => { uzerinde = idx; duvar.classList.add('odak'); tabelaTazele(); });
  b.addEventListener('mouseleave',  () => { uzerinde = -1; duvar.classList.remove('odak'); tabelaTazele(); });
  b.addEventListener('focus', () => { uzerinde = idx; tabelaTazele(); });
  b.addEventListener('blur',  () => { uzerinde = -1; tabelaTazele(); });

  li.innerHTML = '<a href="#e' + idx + '">' + w.title +
                 '<span class="yil">' + w.year + '</span></a>';
  /* Listeden seçmek eseri AÇMIYOR, duvarı oraya götürüyor: liste bir dizin,
     bir kısayol menüsü değil. Açmak için tabloya tıklanır. */
  li.querySelector('a').addEventListener('click', (e) => {
    e.preventDefault();
    uzerinde = -1;
    merkezeAl(idx); merkezde = idx;
    tabelaTazele(); listeIsaretle(idx);
  });
  liste.appendChild(li);
});

/* ── duvar etiketi ───────────────────────────────────────────────────────
   Fare bir tablonun üstündeyse onun bilgisi; değilse ekranın ortasına en
   yakın eserinki. Dokunmatikte hover olmadığı için panel hiç boş kalmıyor. */

const tabela = document.getElementById('tabela');
const tabelaIc = document.getElementById('tabelaic');
let uzerinde = -1, merkezde = -1;

function tabelaYaz(idx) {
  if (idx < 0 || !YERLER[idx]) {
    tabelaIc.innerHTML = '<div class="bos">' + t('nav_gallery') + ' · ' +
                       SITE.artist.name + '</div>';
    return;
  }
  const w = YERLER[idx].w;
  const gloss = (L().works[w.id] || {}).gloss || '';
  const soz = (L().works[w.id] || {}).note || w.note;
  const durum = w.status === 'satilik' ? t('avail_studio')
              : w.status === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
  tabelaIc.innerHTML =
    '<div class="ad">' + w.title + '</div>' +
    (gloss ? '<div class="cev">' + gloss + '</div>' : '') +
    '<div class="sat">' + w.year + ' · ' + t('medium') + ' · ' +
    w.size + ' | ' + w.sizeIn + '</div>' +
    '<div class="soz">“' + soz + '”</div>' +
    '<div class="durum">' + durum + '</div>';
}

function tabelaTazele() {
  tabelaYaz(uzerinde >= 0 ? uzerinde : merkezde);
}

/* Ekranın ortasına en yakın eser.
   Eskiden her eserin getBoundingClientRect'i okunuyordu. İki sorunu vardı:
   (1) her kaydırma olayında 18 kaplama ölçümü — gereksiz yerleşim hesabı;
   (2) duvar hedefine YUMUŞAK gittiği için ölçüm o anki (eski) konumu
       veriyordu, yani ok tuşuna basınca künye eski eserde kalıyordu.
   Artık merkezler boyutla() içinde önbelleğe alınıyor ve karşılaştırma
   HEDEF konuma göre yapılıyor: künye anında doğru esere geçiyor. */
function merkeziBul() {
  const hedef = konum + innerWidth / 2;
  let en = Infinity, k = -1;
  for (let i = 0; i < MERKEZLER.length; i++) {
    const d = Math.abs(MERKEZLER[i] - hedef);
    if (d < en) { en = d; k = i; }
  }
  if (k !== merkezde) { merkezde = k; listeIsaretle(k); if (uzerinde < 0) tabelaTazele(); }
}

/* Künyedeki oklar: o an gösterilen eserden bir önceki/sonrakine geç. */
function gez(yon) {
  const su = uzerinde >= 0 ? uzerinde : merkezde;
  const y = su < 0 ? (yon > 0 ? 0 : N - 1) : (su + yon + N) % N;
  uzerinde = -1;
  duvar.classList.remove('odak');
  merkezeAl(y);
  merkezde = y;                 /* duvar yumuşak giderken künye beklemesin */
  tabelaTazele(); listeIsaretle(y);
}

document.querySelectorAll('.gezok').forEach((b) => {
  b.addEventListener('click', () => gez(+b.dataset.yon));
});

/* Delegasyon kaldırıldı: dinleyiciler doğrudan eserlerde. */

/* ── yanal hareket + hafif paralaks. Dönme YOK. ──────────────────────────── */

let hedefX = 0, suanX = 0, fareEgim = 0, hedefEgim = 0;

/* DUVARIN YATAY KONUMU TEK DEĞİŞKENDE: konum (0 .. enFazla piksel).
   Önce dikey scroll tek kaynaktı; telefonda bu, olmaması gereken bir dikey
   kaydırma yaratıyordu — parmağını yukarı sürükleyince duvar yana kayıyor,
   sayfa da kendi başına oynuyordu. Artık dar ekranda sayfa hiç kaymıyor
   (gövde yüksekliği ekran kadar), duvarı yalnızca yatay parmak hareketi
   sürüyor. Geniş ekranda tekerlek/scroll aynı konumu besliyor. */
let konum = 0, dar = false;

const enFazla = () => Math.max(0, duvarEnPx - innerWidth);
const scrollPayi = () => document.body.scrollHeight - innerHeight;

function guncelle() {
  const max = enFazla();
  konum = Math.min(max, Math.max(0, konum));
  const p = max > 0 ? konum / max : 0;
  hedefX = -konum;
  $('#ilerleme').style.width = (p * 100) + '%';
  if (p > 0.02) $('#ipucu').style.opacity = '0';
  merkeziBul();
}

/* Konumu yaz. Geniş ekranda scroll da senkron kalsın diye sayfa kaydırılır;
   dar ekranda scroll yok, doğrudan konum yazılır. */
function konumaGit(px) {
  konum = Math.min(enFazla(), Math.max(0, px));
  if (!dar) {
    const max = enFazla(), oran = scrollPayi();
    if (max > 0 && oran > 0) scrollTo({ top: (konum / max) * oran, behavior: 'auto' });
  }
  guncelle();
}

function kaydir() {
  if (dar) return;                       // dar ekranda scroll kaynağı değil
  const max = enFazla(), oran = scrollPayi();
  konum = oran > 0 ? Math.min(1, Math.max(0, scrollY / oran)) * max : 0;
  guncelle();
}
addEventListener('scroll', kaydir, { passive: true });

/* ── DOKUNMATİK: yatay parmak hareketi ───────────────────────────────────
   Parmak duvarı birebir sürüklüyor; bırakınca atalet devam ediyor.
   Dar ekranda sayfanın dikey kaydırması kapalı olduğu için (boyutla()
   gövde yüksekliğini ekrana eşitliyor) burada scroll'a hiç dokunulmuyor. */
(function () {
  let x0 = 0, y0 = 0, k0 = 0, yon = null, sonX = 0, sonT = 0, hiz = 0, atalet = 0;
  let kaydi = false;

  addEventListener('touchstart', (e) => {
    if (acikIdx >= 0 || e.touches.length !== 1) return;
    atalet = 0; kaydi = false;
    const t = e.touches[0];
    x0 = sonX = t.clientX; y0 = t.clientY;
    k0 = konum; yon = null; hiz = 0; sonT = e.timeStamp;
  }, { passive: true });

  addEventListener('touchmove', (e) => {
    if (acikIdx >= 0 || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = x0 - t.clientX, dy = y0 - t.clientY;
    if (yon === null) {
      if (Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
      /* Dar ekranda dikey kaydırma diye bir şey yok: her hareket duvarı
         sürüklesin, kişi parmağını hafif eğik kaydırınca hiçbir şey
         olmaması sinir bozucu oluyordu. */
      yon = (dar || Math.abs(dx) > Math.abs(dy)) ? 'yatay' : 'dikey';
    }
    if (yon !== 'yatay') return;
    if (e.cancelable) e.preventDefault();
    kaydi = true;
    const dt = e.timeStamp - sonT;
    if (dt > 0) hiz = (sonX - t.clientX) / dt;          // px/ms
    sonX = t.clientX; sonT = e.timeStamp;
    konumaGit(k0 + dx);
  }, { passive: false });

  addEventListener('touchend', () => {
    if (yon !== 'yatay' || Math.abs(hiz) < 0.25) { yon = null; return; }
    yon = null;
    atalet = hiz * 16;                                  // kare başına px
    const sur = () => {
      if (Math.abs(atalet) < 0.35) return;
      const onceki = konum;
      konumaGit(konum + atalet);
      if (konum === onceki) return;                     // uca dayandı
      atalet *= 0.94;
      requestAnimationFrame(sur);
    };
    requestAnimationFrame(sur);
  }, { passive: true });

  /* sürükleme bittiğinde tabloyu açma; parmak kaydırmak tıklamak değildir */
  duvar.addEventListener('click', (e) => {
    if (kaydi) { e.stopPropagation(); e.preventDefault(); kaydi = false; }
  }, true);
})();

if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  addEventListener('pointermove', (e) => {
    hedefEgim = ((e.clientX / innerWidth) - 0.5) * 3.2;   // ±1.6° — derinlik ipucu
  }, { passive: true });
}

function dongu() {
  suanX += (hedefX - suanX) * 0.11;
  fareEgim += (hedefEgim - fareEgim) * 0.06;
  duvar.style.transform =
    'translate3d(' + suanX.toFixed(2) + 'px,0,0) rotateY(' + fareEgim.toFixed(3) + 'deg)';
  requestAnimationFrame(dongu);
}

/* ── detay: tablo ekrana doğru uçuyor (FLIP) ─────────────────────────────── */

const detay = $('#detay'), buyuk = $('#buyuk'), kunyeEl = $('#kunye'),
      sayac = $('#sayac'), duyuru = $('#duyuru');
let acikIdx = -1;

/* Yan listede o an duvarda ortada olan eseri işaretle. */
function listeIsaretle(idx) {
  liste.querySelectorAll('a').forEach((a, i) =>
    a.setAttribute('aria-current', i === idx ? 'true' : 'false'));
}

function ac(idx) {
  const w = YERLER[idx] && YERLER[idx].w;
  if (!w) return;
  const gloss = (L().works[w.id] || {}).gloss || '';
  const not = (L().works[w.id] || {}).note || w.note;
  const durum = w.status === 'satilik' ? t('avail_studio')
              : w.status === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
  /* K.seriesOf ANAHTAR alıyor, eser nesnesi değil; başlık da çeviriden gelmeli. */
  const seri = ((L().series || {})[w.series] || K.seriesOf(w.series) || {}).title || '';

  /* Eser değişince kısa bir sönüp açılma: aynı panelde farklı resim
     olduğunu göz kaçırmasın. */
  buyuk.style.opacity = '0';
  buyuk.src = w.src;
  buyuk.alt = w.title + ', ' + w.year;
  requestAnimationFrame(() => { buyuk.style.opacity = ''; });

  kunyeEl.innerHTML =
    '<div class="ad">' + w.title + '</div>' +
    (gloss ? '<div class="cev">' + gloss + '</div>' : '') +
    (seri ? '<div class="seri">' + seri + '</div>' : '') +
    '<dl>' +
      '<dt>' + t('lbl_year') + '</dt><dd>' + w.year + '</dd>' +
      '<dt>' + t('lbl_medium') + '</dt><dd>' + t('medium') + '</dd>' +
      '<dt>' + t('lbl_size') + '</dt><dd>' + w.size + '<br>' + w.sizeIn + '</dd>' +
    '</dl>' +
    '<div class="not">“' + not + '”</div>' +
    '<div class="durum">' + durum + '</div>';
  sayac.textContent = (idx + 1) + ' / ' + N;

  detay.classList.add('acik');
  detay.setAttribute('aria-hidden', 'false');
  acikIdx = idx;
  tabela.style.opacity = '0';
  duyuru.textContent = (idx + 1) + ' / ' + N + '. ' + w.title + '. ' + w.year + '. ' + w.size + '.';
  $('#kapat').focus({ preventScroll: true });
}

function kapat() {
  if (acikIdx < 0) return;
  const geri = acikIdx;
  acikIdx = -1;
  detay.classList.remove('acik');
  detay.setAttribute('aria-hidden', 'true');
  tabela.style.opacity = '';
  const el = duvar.querySelector('.eser[data-i="' + geri + '"]');
  if (el) el.focus({ preventScroll: true });
}

/* Detaydaki oklar: duvarı da beraberinde götürsün ki kapatınca doğru
   yerde olalım. */
function git(yon) {
  if (acikIdx < 0) return;
  const y = (acikIdx + yon + N) % N;
  merkezeAl(y); merkezde = y; listeIsaretle(y);
  ac(y);
}

$('#kapat').addEventListener('click', kapat);
$('.onceki').addEventListener('click', () => git(-1));
$('.sonraki').addEventListener('click', () => git(1));
