<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SERGİ DUVARI — şato resim galerisi.
   Koyu şişe yeşili damask, ahşap lambri, kornis, altın çerçeveler.
   Gerçek 3B perspektif (CSS transform), WebGL YOK: tablolar tam çözünürlüklü
   <img> olarak kalıyor, fare/klavye/ekran okuyucu bedavaya geliyor.
   Hareket yalnızca YANAL — dönme yok, mide bulandırmaz.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --yesil-koyu:  #14211c;
  --yesil:       #1d3229;
  --yesil-acik:  #274437;
  --ahsap:       #2a1d14;
  --ahsap-acik:  #4a3524;
  --altin:       #c9a86a;
  --altin-koyu:  #7a5f2f;
  --altin-parlak:#e6d2a0;
  --krem:        #efe8da;
  --krem-sol:    rgba(239,232,218,.62);

  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Cormorant Garamond", Garamond, "EB Garamond", Georgia, serif;
  --ease: cubic-bezier(.19, 1, .22, 1);

  --duvar-h: 300;   /* duvarın gerçek yüksekliği, cm */
  --hat: 152;       /* asılma hattı, cm */
  --ppc: 2.2;       /* piksel / santimetre — JS ayarlıyor */
}

* { box-sizing: border-box; }

html { background: var(--yesil-koyu); }
body {
  margin: 0; color: var(--krem);
  font: 400 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── oda: perspektifin kaynağı ───────────────────────────────────────────── */

#oda {
  position: fixed; inset: 0; z-index: 1;
  perspective: 2000px;
  perspective-origin: 50% 44%;
  overflow: hidden;
  background:
    radial-gradient(ellipse 120% 90% at 50% 120%, rgba(0,0,0,.55), transparent 60%),
    linear-gradient(#0d1714, #14211c 55%, #0b1310);
}

/* ── duvar ───────────────────────────────────────────────────────────────── */

#duvar {
  position: absolute; top: 0; left: 0; height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
}

/* Duvar segmentleri: her biri gerçek bir salon duvarı görseli.
   Korniş, panel, boiserie, parke — hepsi görselin içinde. */
.segment {
  position: absolute; top: 0;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}
/* okunurluk için çok hafif koyultma ve zemin gölgesi */
#yansima {
  position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.30));
  pointer-events: none;
}

/* ── eserler ─────────────────────────────────────────────────────────────── */

.eser {
  position: absolute;
  transform-style: preserve-3d;
  background: none; border: 0; padding: 0; cursor: pointer;
  transition: transform 520ms var(--ease), filter 380ms var(--ease);
  transform: translateZ(0);
}
.cerceve {
  position: relative;
  padding: clamp(7px, .75vw, 15px);
  background:
    linear-gradient(142deg, var(--altin-parlak) 0%, var(--altin) 22%,
                    var(--altin-koyu) 52%, var(--altin) 74%, #5d4722 100%);
  box-shadow:
    0 1px 0 rgba(0,0,0,.6),
    0 3px 4px rgba(0,0,0,.45),                 /* temas gölgesi — gerçeklik ipucu */
    0 22px 40px -16px rgba(0,0,0,.8),
    inset 0 0 0 1px rgba(255,240,205,.3),
    inset 0 0 14px rgba(0,0,0,.35);
  transition: box-shadow 420ms var(--ease);
}
.cerceve::before {                               /* kenarsız sıcak hâle */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: 0 0 60px 26px rgba(255,226,175,.14);
  opacity: 0; transition: opacity 420ms var(--ease);
}
.cerceve::after {                                /* iç pah */
  content: ""; position: absolute; inset: clamp(5px, .55vw, 11px);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.55), inset 0 1px 3px rgba(0,0,0,.5);
  pointer-events: none;
}
.eser img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* Tablonun üstüne düşen sıcak ışık.
   KUTU KENARI GÖRÜNMEMELİ: gradyan öğenin sınırına varmadan tamamen
   saydamlaşmalı, yoksa duvarda dikdörtgen bir leke belirir. Öğe büyük,
   gradyan %52'de biter. */
.isik {
  position: absolute; inset: -58% -52% -34%;
  background: radial-gradient(ellipse 46% 42% at 50% 30%,
    rgba(255,233,190,.26) 0%,
    rgba(255,228,180,.13) 22%,
    rgba(255,226,175,.045) 36%,
    rgba(255,226,175,0) 52%);
  opacity: .62; pointer-events: none;
  mix-blend-mode: soft-light;
  transition: opacity 420ms var(--ease);
}

/* fare üstüne gelince: duvardan kalkar, gölge derinleşir, ışık artar */
@media (hover: hover) and (pointer: fine) {
  .eser:hover, .eser:focus-visible { transform: translateZ(26px); }
  .eser:hover .cerceve, .eser:focus-visible .cerceve {
    box-shadow:
      0 1px 0 rgba(0,0,0,.6),
      0 6px 8px rgba(0,0,0,.5),
      0 44px 70px -22px rgba(0,0,0,.86),
      inset 0 0 0 1px rgba(255,246,220,.5),
      inset 0 0 14px rgba(0,0,0,.3);
  }
  .eser:hover .isik, .eser:focus-visible .isik { opacity: 1; }
  /* çerçeveye sıcak bir hâle: kenarı olmayan gerçek ışık */
  .eser:hover .cerceve::before, .eser:focus-visible .cerceve::before { opacity: 1; }
  /* komşular sönsün, dikkat toplansın */
  #duvar.odak .eser:not(:hover):not(:focus-visible) { filter: brightness(.62) saturate(.85); }
}

/* künye etiketi — duvarda, çerçevenin altında */
.etiket {
  position: absolute; left: 50%; top: calc(100% + 9px);
  transform: translateX(-50%) translateY(-4px);
  white-space: nowrap; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity 300ms var(--ease), transform 300ms var(--ease);
}
.etiket .a { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--krem); }
.etiket .o { font-size: 11px; color: var(--krem-sol); letter-spacing: .04em; margin-top: 2px; }
.eser:hover .etiket, .eser:focus-visible .etiket { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── duvar etiketi: lambrinin üstünde, pirinç levhaya kazınmış gibi ───────
   O kahverengi bant boştu. Müzede tam oraya yorum panosu konur.          */

#tabela {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: var(--tabela-y, 74%);
  width: min(700px, 86vw); text-align: center;
  z-index: 12; pointer-events: none;
  padding: 15px 28px 17px;
  background: linear-gradient(158deg, rgba(30,34,27,.90), rgba(17,21,16,.94));
  border: 1px solid rgba(201,168,106,.44);
  box-shadow: 0 12px 34px rgba(0,0,0,.5),
              inset 0 1px 0 rgba(255,240,205,.14),
              inset 0 0 26px rgba(0,0,0,.35);
  transition: opacity 300ms var(--ease);
}
#tabela .ad {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(18px, 1rem + .6vw, 24px); color: #f4e9d2;
}
#tabela .cev {
  font-family: var(--serif); font-style: italic; font-size: 13px;
  color: rgba(244,233,210,.60); margin-top: 1px;
}
#tabela .sat {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(244,233,210,.55); margin-top: 6px;
}
#tabela .soz {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(13px, .82rem + .2vw, 15px); line-height: 1.55;
  color: rgba(246,236,216,.86); margin: 8px auto 0; max-width: 52ch;
}
#tabela .durum {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: #d0ab68; margin-top: 8px;
}
#tabela .bos {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(244,233,210,.42);
}

/* ── üst şerit ───────────────────────────────────────────────────────────── */

#ust {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 14px clamp(14px, 2.4vw, 28px); pointer-events: none;
}
#ust > * { pointer-events: auto; }
#ust a, #ust button {
  font: inherit; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--krem-sol); background: rgba(10,18,15,.55);
  border: 1px solid rgba(239,232,218,.18); padding: 9px 13px;
  cursor: pointer; text-decoration: none;
  transition: color 240ms, border-color 240ms;
}
#ust a:hover, #ust button:hover { color: var(--krem); border-color: rgba(239,232,218,.5); }
#ilerleme {
  position: fixed; left: 0; top: 0; height: 2px; z-index: 21;
  background: var(--altin); width: 0; transition: width 180ms linear;
}

/* ── detay katmanı ───────────────────────────────────────────────────────── */

/* Kapalıyken görünmemeli: pointer-events tek başına yetmiyor, oklar ve
   Kapat düğmesi duvarın üstünde duruyordu. */
#detay {
  position: fixed; inset: 0; z-index: 30;
  pointer-events: none; visibility: hidden; opacity: 0;
  transition: opacity 420ms var(--ease), visibility 0s linear 480ms;
}
#detay.acik {
  pointer-events: auto; visibility: visible; opacity: 1;
  transition: opacity 320ms var(--ease), visibility 0s;
}
#perde {
  position: absolute; inset: 0; opacity: 0;
  background: rgba(8,14,12,.86);
  backdrop-filter: blur(14px);
  transition: opacity 480ms var(--ease);
}
#detay.acik #perde { opacity: 1; }

#ucan {                                  /* uçan tablo — FLIP ile konumlanıyor */
  position: absolute; transform-origin: 50% 50%;
  transition: transform 720ms var(--ease), width 720ms var(--ease), height 720ms var(--ease);
  will-change: transform, width, height;
}
#ucan .cerceve { width: 100%; height: 100%; }

#kunye {
  position: absolute; left: 50%; transform: translateX(-50%) translateY(10px);
  bottom: clamp(18px, 4vh, 52px); width: min(760px, 92vw);
  opacity: 0; transition: opacity 420ms var(--ease) 260ms, transform 420ms var(--ease) 260ms;
  text-align: center;
}
#detay.acik #kunye { opacity: 1; transform: translateX(-50%) translateY(0); }
#kunye .ad { font-family: var(--serif); font-style: italic; font-size: clamp(19px, 1.2rem + .6vw, 26px); }
#kunye .cev { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--krem-sol); margin-top: 2px; }
#kunye .sat { font-size: 12px; color: var(--krem-sol); margin-top: 9px; line-height: 1.7; }
#kunye .not {
  font-family: var(--serif); font-style: italic; font-size: 13px;
  color: rgba(239,232,218,.78); margin-top: 12px; max-width: 46ch;
  margin-inline: auto; line-height: 1.6;
}
#kunye .durum { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--altin); margin-top: 12px; }

#gez { position: absolute; inset: 0; pointer-events: none; }
#gez button {
  position: absolute; top: 50%; transform: translateY(-50%);
  pointer-events: auto; background: none; border: 0; cursor: pointer;
  color: var(--krem-sol); font-size: 30px; line-height: 1;
  padding: 18px 22px; transition: color 240ms;
}
#gez button:hover { color: var(--krem); }
#gez .onceki { left: clamp(4px, 2vw, 30px); }
#gez .sonraki { right: clamp(4px, 2vw, 30px); }
#kapat {
  position: absolute; top: 14px; right: clamp(14px, 2.4vw, 28px);
  pointer-events: auto; background: none; border: 0; cursor: pointer;
  color: var(--krem-sol); font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  padding: 10px;
}
#kapat:hover { color: var(--krem); }

/* ── gizli semantik katman ───────────────────────────────────────────────── */
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
:focus-visible { outline: 2px solid var(--altin); outline-offset: 4px; }

#ipucu {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 11;
  font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  color: rgba(239,232,218,.42); pointer-events: none;
  transition: opacity 600ms var(--ease);
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>

anın rengi vardır, yağmurdan sonranın başka bir rengi. Onları tarif etmeye çalışıyorum."],"collections":["Ardıç Sanat Koleksiyonu, İstanbul","Batı Kanat Çağdaş Sanat Koleksiyonu, İstanbul","Liman Kültür Merkezi, İzmir","Atelier Nordbahn Koleksiyonu, Viyana","Van Doorn Koleksiyonu, Rotterdam","Özel koleksiyonlar · Türkiye, Avusturya, Hollanda"],"series":{"alacakaranlik":{"title":"Alacakaranlık","blurb":"Günün bittiği, gecenin başlamadığı o kısa aralığın resimleri. Renk burada bir şeyi tarif etmiyor; bir şeyin kayboluşunu tutuyor."},"hava":{"title":"Hava","blurb":"Fırtına, yağmur, basınç. Manzaradan çok atmosferin kendisi. Tuvale önce havayı koyuyorum, yeri sonra."},"topografya":{"title":"Sessiz Topografya","blurb":"İnsansız araziler. İçinde kimsenin olmadığı ama birinin geçtiği belli olan yerler."},"sabah":{"title":"Sabah","blurb":"Gümüş ışık serisi. Sabahın ilk yarım saati, henüz renk yerine oturmadan."}},"works":{"64715":{"gloss":"","note":"Islak toprak kokusunun rengi olsaydı."},"68388":{"gloss":"","note":"En büyük tuval. Atölyeye zor sığdı."},"64772":{"gloss":"","note":"Seriye adını veren resim."},"68784":{"gloss":"","note":"Yeşili yeşille değil, sarıyla açtım."},"65353":{"gloss":"","note":"Üstünde iki kış çalıştım. İkisi de aralıkta."},"94127":{"gloss":"","note":"Suyu geçen figürler sonradan geldi. Önce hava vardı."},"64729":{"gloss":"","note":"Dikey format bu seride tek. Işık yukarıdan geldiği için."},"110561":{"gloss":"","note":"Beyazı karıştırırken toprak eklemeyi öğrendiğim resim."},"30701":{"gloss":"","note":"Akşamın ilk yarım saati. Gölge henüz mavi değil."},"27777":{"gloss":"","note":"Figür nadiren giriyor. Girdiğinde de sırtını dönüyor."},"151108":{"gloss":"","note":"Yansımayı önce bitirdim, sonra üstündekini."},"47669":{"gloss":"","note":"Tarlada kalan son ışık. Figürler bahane."},"64768":{"gloss":"","note":"Uzağı yakından daha az doyurmak. Basit ama zor."},"69844":{"gloss":"","note":"Boş bir ev, boş bir arazi. Yine de biri var gibi."},"64748":{"gloss":"","note":"Uzaktaki ışık yakındakinden daha sıcak olmalı."},"64736":{"gloss":"","note":"Sonbaharı kırmızıyla anlatmamaya çalıştığım bir deneme."},"64740":{"gloss":"","note":"Etüt olarak başladı, öyle kaldı. Bazen iyi oluyor."},"64732":{"gloss":"","note":"Bir saat içinde bitti. Nadiren öyle olur."}},"cv":[["2024","Alacakaranlık","Kişisel sergi · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Kişisel sergi · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Karma sergi · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Karma sergi · Liman Kültür Merkezi, İzmir"],["2021","Sessiz Topografya","Kişisel sergi · Ardıç Sanat, İstanbul"],["2020","Katman","Karma sergi · Batı Kanat, İstanbul"],["2019","Slow Paint","Karma sergi · Atelier Nordbahn, Viyana"],["2018","İlk Katman","Kişisel sergi · Payas Galeri, İzmir"]],"publications":[["2024","Alacakaranlık","Sergi kataloğu, 96 sayfa. Metin: Nihal Erkut. Ardıç Sanat."],["2023","Hava Raporu","Sergi kataloğu, 64 sayfa. Payas Galeri."],["2022","Yavaş Boya","Söyleşi · Sanat Dünyamız, sayı 189, s. 44–51."],["2021","Sessiz Topografya","Sergi kataloğu, 72 sayfa. Metin: Kaan Bilen. Ardıç Sanat."],["2019","Katmanın Sabrı","Deneme · Kunstraum Yıllığı, Viyana. Almanca ve İngilizce."]],"press":[["2024","“Işığın çekildiği yerde durmak”","Ayşe Tunca · Cumhuriyet Kitap, Kasım 2024"],["2024","“Bir tuval kaç kış bekler?”","Deniz Aksoy · Argonotlar, Ekim 2024"],["2023","“Manzara değil, basınç”","Selim Arer · Sanat Dünyamız, Mart 2023"],["2021","“Sessiz Topografya üzerine”","Kaan Bilen · e-skop, Aralık 2021"]],"notice":"Bu bir tasarım prototipidir. Sanatçı kimliği ve metinler kurgudur; görseller Art Institute of Chicago açık erişim arşivinden alınmış kamu malı George Inness tablolarıdır. Yayına geçmeden önce tümü gerçek eserlerle değiştirilecektir."},"en":{"ui":{"lang_name":"English","nav_gallery":"Gallery","nav_about_grp":"The artist","gal_exit":"Leave the gallery","gal_label":"Three-dimensional","gal_title":"Enter the gallery","gal_sub":"The works hang at true scale, at eye level, along a descending spiral ramp. As you descend you also see the turns across the void.","gal_soon":"This section is under construction.","nav_recent":"Recent Paintings","nav_studio":"Studio Note","nav_bio":"Biography","nav_exh":"Exhibitions","nav_coll":"Collections","nav_pub":"Publications","nav_press":"Press","nav_contact":"Contact","menu":"Menu","skip":"Skip to content","site_sub":"Painting","recent_lede":"{n} works, {s} series. Newest first.","exh_solo":"Solo Exhibitions","exh_group":"Group Exhibitions","coll_record":"Record","coll_sentence":"{h} of {n} works are held in collections. The remainder are available from the studio.","bio_born":"Born in {p} in {y}.","bio_lives":"Lives and works in {c}.","home_now":"Current","home_next":"Upcoming","contact_body":"For enquiries about available work, studio visits and exhibition proposals, please write. Studio visits by appointment.","avail_studio":"Available from the studio, Istanbul","avail_private":"Private collection","avail_gone":"No longer available","medium":"Oil on canvas","noscript":"JavaScript is required to view the works.","meta_desc":"Cemal Sağlam is a painter working in Istanbul. Oil on canvas; series on twilight, weather and landscape."},"bio":["Cemal Sağlam was born in İzmir in 1987. He completed the painting department at Mimar Sinan Fine Arts University, then spent two years in Vienna studying classical oil technique.","He says he chose oil for its slowness. He works on a single canvas for months, leaves the layers to dry and returns to them. Most of the work is waiting.","Since 2016 he has painted in his studio in Bomonti, Istanbul. His work is held in private collections in Turkey, Austria and the Netherlands."],"statement":["When I begin a canvas I do not know what it will look like. I only know which light I am after: the half hour when the day has ended and night has not yet come. Until I find it, I keep covering the surface over.","Colour shifts as the layers dry, so it cannot be hurried. I spend about four months on a painting, and perhaps a third of that is actually spent applying paint. The rest is looking and waiting.","I do not think I paint landscapes. The landscape is a pretext; what matters is the weight of the air. A storm has a colour, and the aftermath of rain has another. I am trying to describe those."],"collections":["Ardıç Sanat Collection, Istanbul","Batı Kanat Contemporary Art Collection, Istanbul","Liman Cultural Centre, İzmir","Atelier Nordbahn Collection, Vienna","Van Doorn Collection, Rotterdam","Private collections · Turkey, Austria, the Netherlands"],"series":{"alacakaranlik":{"title":"Twilight","blurb":"Paintings of the short interval when the day has ended and night has not begun. Colour here does not describe something; it holds something disappearing."},"hava":{"title":"Weather","blurb":"Storm, rain, pressure. The atmosphere itself rather than the landscape. I put the air on the canvas first, the ground after."},"topografya":{"title":"Quiet Topography","blurb":"Land without people. Places where no one is present but someone clearly passed."},"sabah":{"title":"Morning","blurb":"The silver light series. The first half hour of morning, before colour settles."}},"works":{"64715":{"gloss":"After the Rain","note":"If the smell of wet earth had a colour."},"68388":{"gloss":"The Ridge","note":"The largest canvas. It barely fit into the studio."},"64772":{"gloss":"Twilight","note":"The painting that gave the series its name."},"68784":{"gloss":"Summer Morning","note":"I opened the green with yellow, not with more green."},"65353":{"gloss":"Storm","note":"I worked on it through two winters. Both times in December."},"94127":{"gloss":"The Ford","note":"The figures crossing the water came later. The weather came first."},"64729":{"gloss":"Early Hour","note":"The only vertical format in this series. Because the light comes from above."},"110561":{"gloss":"Silver Morning","note":"The painting where I learned to add earth when mixing white."},"30701":{"gloss":"The Old Mill","note":"The first half hour of evening. The shadow is not yet blue."},"27777":{"gloss":"Sisters","note":"Figures rarely enter. When they do, they turn their backs."},"151108":{"gloss":"Mill Pond","note":"I finished the reflection first, then what was above it."},"47669":{"gloss":"After the Harvest","note":"The last light left in the field. The figures are a pretext."},"64768":{"gloss":"Valley","note":"Saturating the distance less than the foreground. Simple but difficult."},"69844":{"gloss":"The Lonely Farm","note":"An empty house, an empty field. And yet someone seems to be there."},"64748":{"gloss":"Sunlit Valley","note":"Distant light must be warmer than near light."},"64736":{"gloss":"Autumn Wood","note":"An attempt at not explaining autumn with red."},"64740":{"gloss":"Sunset Study","note":"It began as a study and stayed one. Sometimes that is right."},"64732":{"gloss":"Bearing Down","note":"Finished within an hour. That rarely happens."}},"cv":[["2024","Alacakaranlık","Solo exhibition · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Solo exhibition · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Group exhibition · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Group exhibition · Liman Kültür Merkezi, İzmir"],["2021","Sessiz Topografya","Solo exhibition · Ardıç Sanat, İstanbul"],["2020","Katman","Group exhibition · Batı Kanat, İstanbul"],["2019","Slow Paint","Group exhibition · Atelier Nordbahn, Viyana"],["2018","İlk Katman","Solo exhibition · Payas Galeri, İzmir"]],"publications":[["2024","Alacakaranlık","Exhibition catalogue, 96 pp. Text: Nihal Erkut. Ardıç Sanat."],["2023","Hava Raporu","Exhibition catalogue, 64 pp. Payas Galeri."],["2022","Yavaş Boya","Interview · Sanat Dünyamız, issue 189, pp. 44–51."],["2021","Sessiz Topografya","Exhibition catalogue, 72 pp. Text: Kaan Bilen. Ardıç Sanat."],["2019","Katmanın Sabrı","Essay · Kunstraum Yearbook, Vienna. In German and English."]],"press":[["2024","“Işığın çekildiği yerde durmak”","Ayşe Tunca · Cumhuriyet Kitap, November 2024"],["2024","“Bir tuval kaç kış bekler?”","Deniz Aksoy · Argonotlar, October 2024"],["2023","“Manzara değil, basınç”","Selim Arer · Sanat Dünyamız, March 2023"],["2021","“Sessiz Topografya üzerine”","Kaan Bilen · e-skop, December 2021"]],"notice":"This is a design prototype. The artist identity and all texts are fictional; the images are public-domain paintings by George Inness from the Art Institute of Chicago open-access archive. All will be replaced with the artist’s own work before launch."},"fr":{"ui":{"lang_name":"Français","nav_gallery":"Galerie","nav_about_grp":"L’artiste","gal_exit":"Quitter la galerie","gal_label":"En trois dimensions","gal_title":"Entrer dans la galerie","gal_sub":"Les œuvres sont accrochées à l’échelle réelle, à hauteur des yeux, le long d’une rampe en spirale. En descendant, vous voyez aussi les niveaux d’en face.","gal_soon":"Cette section est en cours de construction.","nav_recent":"Peintures récentes","nav_studio":"Note d’atelier","nav_bio":"Biographie","nav_exh":"Expositions","nav_coll":"Collections","nav_pub":"Publications","nav_press":"Presse","nav_contact":"Contact","menu":"Menu","skip":"Aller au contenu","site_sub":"Peinture","recent_lede":"{n} œuvres, {s} séries. De la plus récente à la plus ancienne.","exh_solo":"Expositions personnelles","exh_group":"Expositions collectives","coll_record":"Registre","coll_sentence":"{h} des {n} œuvres se trouvent en collection. Les autres sont disponibles à l’atelier.","bio_born":"Né à {p} en {y}.","bio_lives":"Vit et travaille à {c}.","home_now":"En cours","home_next":"À venir","contact_body":"Pour toute demande concernant les œuvres disponibles, les visites d’atelier et les propositions d’exposition, écrivez-nous. Visites d’atelier sur rendez-vous.","avail_studio":"Disponible à l’atelier, Istanbul","avail_private":"Collection privée","avail_gone":"Non disponible","medium":"Huile sur toile","noscript":"JavaScript est nécessaire pour afficher les œuvres.","meta_desc":"Cemal Sağlam est un peintre établi à Istanbul. Huile sur toile ; séries sur le crépuscule, le temps et le paysage."},"bio":["Cemal Sağlam est né à İzmir en 1987. Il est diplômé du département de peinture de l’université des beaux-arts Mimar Sinan, puis a passé deux ans à Vienne à étudier les techniques classiques de la peinture à l’huile.","Il dit avoir choisi l’huile pour sa lenteur. Il travaille des mois sur une même toile, laisse sécher les couches, y revient. L’essentiel du travail consiste à attendre.","Depuis 2016 il peint dans son atelier de Bomonti, à Istanbul. Ses œuvres figurent dans des collections privées en Turquie, en Autriche et aux Pays-Bas."],"statement":["Quand je commence une toile, je ne sais pas à quoi elle ressemblera. Je sais seulement quelle lumière je cherche : la demi-heure où le jour s’achève et où la nuit n’est pas encore venue. Jusqu’à la trouver, je recouvre.","La couleur change à mesure que les couches sèchent : on ne peut donc pas se presser. Je passe environ quatre mois sur un tableau, et le tiers peut-être de ce temps à poser de la peinture. Le reste, à regarder et à attendre.","Je ne crois pas peindre des paysages. Le paysage est un prétexte ; ce qui compte est le poids de l’air. Un orage a une couleur, l’après-pluie en a une autre. J’essaie de les décrire."],"collections":["Collection Ardıç Sanat, Istanbul","Collection d’art contemporain Batı Kanat, Istanbul","Centre culturel Liman, İzmir","Collection Atelier Nordbahn, Vienne","Collection Van Doorn, Rotterdam","Collections privées · Turquie, Autriche, Pays-Bas"],"series":{"alacakaranlik":{"title":"Crépuscule","blurb":"Peintures de ce bref intervalle où le jour s’achève et où la nuit n’a pas commencé. La couleur n’y décrit rien ; elle retient ce qui disparaît."},"hava":{"title":"Temps","blurb":"Orage, pluie, pression. L’atmosphère elle-même plutôt que le paysage. Je pose l’air sur la toile d’abord, le sol ensuite."},"topografya":{"title":"Topographie silencieuse","blurb":"Des terres sans personne. Des lieux où nul n’est présent mais où quelqu’un est manifestement passé."},"sabah":{"title":"Matin","blurb":"La série de la lumière d’argent. La première demi-heure du matin, avant que la couleur ne se fixe."}},"works":{"64715":{"gloss":"Après la pluie","note":"Si l’odeur de la terre mouillée avait une couleur."},"68388":{"gloss":"La crête","note":"La plus grande toile. Elle tenait à peine dans l’atelier."},"64772":{"gloss":"Crépuscule","note":"Le tableau qui a donné son nom à la série."},"68784":{"gloss":"Matin d’été","note":"J’ai ouvert le vert avec du jaune, non avec du vert."},"65353":{"gloss":"Tempête","note":"J’y ai travaillé deux hivers. Les deux fois en décembre."},"94127":{"gloss":"Le gué","note":"Les figures traversant l’eau sont venues après. Le temps d’abord."},"64729":{"gloss":"Heure matinale","note":"Le seul format vertical de la série. Parce que la lumière vient d’en haut."},"110561":{"gloss":"Matin d’argent","note":"Le tableau où j’ai appris à ajouter de la terre en mélangeant le blanc."},"30701":{"gloss":"Le vieux moulin","note":"La première demi-heure du soir. L’ombre n’est pas encore bleue."},"27777":{"gloss":"Sœurs","note":"Les figures entrent rarement. Quand elles le font, elles tournent le dos."},"151108":{"gloss":"Étang du moulin","note":"J’ai terminé le reflet d’abord, puis ce qui le surplombait."},"47669":{"gloss":"Après la moisson","note":"La dernière lumière dans le champ. Les figures sont un prétexte."},"64768":{"gloss":"Vallée","note":"Saturer le lointain moins que le premier plan. Simple mais difficile."},"69844":{"gloss":"La ferme isolée","note":"Une maison vide, un champ vide. Et pourtant quelqu’un semble là."},"64748":{"gloss":"Vallée ensoleillée","note":"La lumière lointaine doit être plus chaude que la proche."},"64736":{"gloss":"Bois d’automne","note":"Une tentative de ne pas dire l’automne avec du rouge."},"64740":{"gloss":"Étude de couchant","note":"Commencé comme une étude, resté une étude. Parfois c’est juste."},"64732":{"gloss":"L’imminence","note":"Achevé en une heure. Cela arrive rarement."}},"cv":[["2024","Alacakaranlık","Exposition personnelle · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Exposition personnelle · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Exposition collective · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Exposition collective · Liman Kültür Merkezi, İzmir"],["2021","Sessiz Topografya","Exposition personnelle · Ardıç Sanat, İstanbul"],["2020","Katman","Exposition collective · Batı Kanat, İstanbul"],["2019","Slow Paint","Exposition collective · Atelier Nordbahn, Viyana"],["2018","İlk Katman","Exposition personnelle · Payas Galeri, İzmir"]],"publications":[["2024","Alacakaranlık","Catalogue d’exposition, 96 p. Texte : Nihal Erkut. Ardıç Sanat."],["2023","Hava Raporu","Catalogue d’exposition, 64 p. Payas Galeri."],["2022","Yavaş Boya","Entretien · Sanat Dünyamız, n° 189, p. 44–51."],["2021","Sessiz Topografya","Catalogue d’exposition, 72 p. Texte : Kaan Bilen. Ardıç Sanat."],["2019","Katmanın Sabrı","Essai · Annuaire du Kunstraum, Vienne. En allemand et en anglais."]],"press":[["2024","“Işığın çekildiği yerde durmak”","Ayşe Tunca · Cumhuriyet Kitap, novembre 2024"],["2024","“Bir tuval kaç kış bekler?”","Deniz Aksoy · Argonotlar, octobre 2024"],["2023","“Manzara değil, basınç”","Selim Arer · Sanat Dünyamız, mars 2023"],["2021","“Sessiz Topografya üzerine”","Kaan Bilen · e-skop, décembre 2021"]],"notice":"Ceci est un prototype de conception. L’identité de l’artiste et les textes sont fictifs ; les images sont des tableaux de George Inness du domaine public, issus des archives en libre accès de l’Art Institute of Chicago. Tout sera remplacé par les œuvres de l’artiste avant la mise en ligne."}},"backdrops":{"acilis":{"src":"assets/zemin/acilis.webp","palette":["#e5e7e2","#e7e9e4","#e4e7e2","#e6e7e3","#d2dfc4","#e8eae4","#e7eae4","#e6e9e4","#efeee4"]},"son":{"src":"assets/zemin /* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      } else {
        /* Varsayılan AÇIK: sistemi karanlıkta olan ziyaretçi de krem zemin
           görsün. Sistem tercihine uymak yerine bilinçli bir karar —
           düğme yine duruyor, isteyen koyuya geçer. */
        document.documentElement.dataset.theme = 'light';
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();


/* ── dil ─────────────────────────────────────────────────────────────────── */
const LANGS = ['tr', 'en', 'fr'];
let LANG = 'tr';
try { const s = localStorage.getItem('cs-lang'); if (LANGS.includes(s)) LANG = s; } catch (e) {}
const L = () => SITE.i18n[LANG] || SITE.i18n.tr;
const t = (k) => (L().ui && L().ui[k]) || SITE.i18n.tr.ui[k] || k;
document.documentElement.lang = LANG;

const WORKS = SITE.works;
/* N artık YERLER.length — yerleşim kurulduktan sonra tanımlanıyor. */
const $ = (s) => document.querySelector(s);

const oda = $('#oda'), duvar = $('#duvar');
const yansima = $('#yansima');

/* ── duvar birimleri ──────────────────────────────────────────────────────
   Duvar artık gerçek bir Fransız salonu görselinden kuruluyor. Panel
   koordinatları görselden ÖLÇÜLDÜ (dikey silme tespiti), göz kararı değil.
   Tablolar panellerin tam içine asılıyor.                                */

const BIRIM = {
  sade: {                                   // Eiffel panosu YOK — çoğunluk bu
    src: 'assets/duvar/salon-sade.webp', en: 1408, boy: 1000,
    yuvalar: [ { cx: 0.3913, g: 0.3826 }, { cx: 0.8642, g: 0.1751 } ],
  },
  toile: {                                  // Eiffel panolu — seyrek serpiştirilir
    src: 'assets/duvar/salon-toile.webp', en: 1776, boy: 1000,
    yuvalar: [ { cx: 0.4202, g: 0.3033 }, { cx: 0.7949, g: 0.1388 } ],
  },
};
const YUVA_CY = 0.452;        // panellerin dikey merkezi (görselden)
const DOLULUK = 0.80;         // en geniş eser, büyük paneli bu oranda doldurur

/* Toile birimi her 5'te bir: kule tekrar etmesin. */
const birimTipi = (i) => (i % 5 === 3) ? 'toile' : 'sade';

/* ── yerleşim: hangi eser hangi segmentin hangi yuvasında ─────────────────
   Ölçek değişmesine karşı dayanıklı: bütün ölçüler segment genişliğinin
   oranı olduğu için atama bir kez yapılır, yeniden boyutlamada değişmez. */

function yerlesim() {
  const enGenis = Math.max(...WORKS.map(w => w.cw));
  const N0 = 1000;                                   // nominal segment yüksekliği
  const segEn = (t) => BIRIM[t].en * (N0 / BIRIM[t].boy);
  const yuvaEn = (t, j) => BIRIM[t].yuvalar[j].g * segEn(t);
  const ppc0 = (yuvaEn('sade', 0) * DOLULUK) / enGenis;
  const sigar = (w, t, j) => (w.cw * ppc0) <= yuvaEn(t, j) * 0.86;

  const kalan = WORKS.slice();
  const segmentler = [];
  let i = 0;
  while (kalan.length) {
    const tip = birimTipi(i);
    const seg = { tip, isler: [] };
    seg.isler.push({ j: 0, w: kalan.shift() });            // büyük panel
    const k = kalan.findIndex(w => sigar(w, tip, 1));      // küçük panele sığan ilk eser
    if (k >= 0) seg.isler.push({ j: 1, w: kalan.splice(k, 1)[0] });
    segmentler.push(seg);
    i++;
  }
  return { segmentler, ppc0 };
}

const { segmentler: SEGMENTLER } = yerlesim();

/* düz liste: künye, klavye ve erişilebilirlik bunun üstünden çalışıyor */
const YERLER = [];
SEGMENTLER.forEach((seg, si) => seg.isler.forEach(it =>
  YERLER.push({ w: it.w, si, j: it.j })));
const N = YERLER.length;

/* ── ölçülendirme ────────────────────────────────────────────────────────── */

let ppc = 2.2, duvarEnPx = 0;

function boyutla() {
  const vh = innerHeight;
  const duvarBoy = Math.round(vh * 0.94);
  const enGenis = Math.max(...WORKS.map(w => w.cw));

  // segment genişlikleri ve konumları
  let x = 0;
  const konum = SEGMENTLER.map((seg) => {
    const b = BIRIM[seg.tip];
    const en = b.en * (duvarBoy / b.boy);
    const k = { x, en };
    x += en;
    return k;
  });
  duvarEnPx = x;

  const buyukYuvaPx = BIRIM.sade.yuvalar[0].g * (BIRIM.sade.en * (duvarBoy / BIRIM.sade.boy));
  ppc = (buyukYuvaPx * DOLULUK) / enGenis;

  duvar.style.height = duvarBoy + 'px';
  duvar.style.top = Math.round((vh - duvarBoy) / 2) + 'px';
  duvar.style.width = duvarEnPx + 'px';

  // segment zeminleri
  duvar.querySelectorAll('.segment').forEach((el, i) => {
    const k = konum[i], b = BIRIM[SEGMENTLER[i].tip];
    el.style.left = k.x + 'px';
    el.style.width = k.en + 'px';
    el.style.height = duvarBoy + 'px';
    el.style.backgroundImage = 'url(' + b.src + ')';
  });

  // eserler yuvalarının tam ortasına
  duvar.querySelectorAll('.eser').forEach((el) => {
    const d = el._d, k = konum[d.si], b = BIRIM[SEGMENTLER[d.si].tip];
    const yv = b.yuvalar[d.j];
    const gp = d.w.cw * ppc, yp = d.w.ch * ppc;
    el.style.width = gp + 'px';
    el.style.height = yp + 'px';
    el.style.left = (k.x + yv.cx * k.en - gp / 2) + 'px';
    el.style.top = (YUVA_CY * duvarBoy - yp / 2) + 'px';
  });

  // duvar etiketi: lambri bandının üstünde (görselde alt %14)
  document.documentElement.style.setProperty(
    '--tabela-y', Math.round((vh - duvarBoy) / 2 + duvarBoy * 0.775) + 'px');

  document.body.style.height =
    Math.max(innerHeight * 1.2, duvarEnPx - innerWidth + innerHeight) + 'px';
  kaydir();
}

/* ── segmentleri ve eserleri kur ─────────────────────────────────────────── */

SEGMENTLER.forEach(() => {
  const d = document.createElement('div');
  d.className = 'segment';
  duvar.appendChild(d);
});

const liste = document.getElementById('liste');
YERLER.forEach((d, idx) => {
  const w = d.w;
  const b = document.createElement('button');
  b.className = 'eser';
  b.type = 'button';
  b.dataset.i = idx;
  b._d = d;
  b.setAttribute('aria-label', w.title + ', ' + w.year + ', ' + w.size);
  b.innerHTML =
    '<div class="isik"></div>' +
    '<div class="cerceve"><img src="' + w.src + '" alt="" loading="lazy"></div>';

  b.addEventListener('click', () => ac(idx));
  b.addEventListener('pointerenter', () => { uzerinde = idx; duvar.classList.add('odak'); tabelaTazele();
    document.getElementById('ipucu').style.opacity = '0'; });
  b.addEventListener('pointerleave', () => { uzerinde = -1; duvar.classList.remove('odak'); tabelaTazele(); });
  b.addEventListener('mouseenter',  () => { uzerinde = idx; duvar.classList.add('odak'); tabelaTazele(); });
  b.addEventListener('mouseleave',  () => { uzerinde = -1; duvar.classList.remove('odak'); tabelaTazele(); });
  b.addEventListener('focus', () => { uzerinde = idx; tabelaTazele(); });
  b.addEventListener('blur',  () => { uzerinde = -1; tabelaTazele(); });
  duvar.appendChild(b);

  const li = document.createElement('li');
  li.innerHTML = '<a href="#e' + idx + '">' + w.title + ', ' + w.year + ', ' + w.size + '</a>';
  li.querySelector('a').addEventListener('click', (e) => { e.preventDefault(); ac(idx); });
  liste.appendChild(li);
});

/* ── duvar etiketi ───────────────────────────────────────────────────────
   Fare bir tablonun üstündeyse onun bilgisi; değilse ekranın ortasına en
   yakın eserinki. Dokunmatikte hover olmadığı için panel hiç boş kalmıyor. */

const tabela = document.getElementById('tabela');
let uzerinde = -1, merkezde = -1;

function tabelaYaz(idx) {
  if (idx < 0 || !YERLER[idx]) {
    tabela.innerHTML = '<div class="bos">' + t('nav_gallery') + ' · ' +
                       SITE.artist.name + '</div>';
    return;
  }
  const w = YERLER[idx].w;
  const gloss = (L().works[w.id] || {}).gloss || '';
  const soz = (L().works[w.id] || {}).note || w.note;
  const durum = w.status === 'satilik' ? t('avail_studio')
              : w.status === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
  tabela.innerHTML =
    '<div class="ad">' + w.title + '</div>' +
    (gloss ? '<div class="cev">' + gloss + '</div>' : '') +
    '<div class="sat">' + w.year + ' · ' + t('medium') + ' · ' +
    w.size + ' | ' + w.sizeIn + '</div>' +
    '<div class="soz">“' + soz + '”</div>' +
    '<div class="durum">' + durum + '</div>';
}

function tabelaTazele() {
  tabelaYaz(uzerinde >= 0 ? uzerinde : merkezde);
}

/* ekranın ortasına en yakın eser */
function merkeziBul() {
  const orta = innerWidth / 2;
  let en = Infinity, k = -1;
  duvar.querySelectorAll('.eser').forEach((el) => {
    const r = el.getBoundingClientRect();
    if (r.right < 0 || r.left > innerWidth) return;
    const d = Math.abs((r.left + r.width / 2) - orta);
    if (d < en) { en = d; k = +el.dataset.i; }
  });
  if (k !== merkezde) { merkezde = k; if (uzerinde < 0) tabelaTazele(); }
}

/* Delegasyon kaldırıldı: dinleyiciler doğrudan eserlerde. */

/* ── yanal hareket + hafif paralaks. Dönme YOK. ──────────────────────────── */

let hedefX = 0, suanX = 0, fareEgim = 0, hedefEgim = 0;

function kaydir() {
  const gp = duvarGenisCm * ppc;
  const max = Math.max(0, gp - innerWidth);
  const oran = document.body.scrollHeight - innerHeight;
  const p = oran > 0 ? Math.min(1, Math.max(0, scrollY / oran)) : 0;
  hedefX = -p * max;
  $('#ilerleme').style.width = (p * 100) + '%';
  if (p > 0.02) $('#ipucu').style.opacity = '0';
  merkeziBul();
}
addEventListener('scroll', kaydir, { passive: true });

if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  addEventListener('pointermove', (e) => {
    hedefEgim = ((e.clientX / innerWidth) - 0.5) * 3.2;   // ±1.6° — derinlik ipucu
  }, { passive: true });
}

function dongu() {
  suanX += (hedefX - suanX) * 0.11;
  fareEgim += (hedefEgim - fareEgim) * 0.06;
  duvar.style.transform =
    'translate3d(' + suanX.toFixed(2) + 'px,0,0) rotateY(' + fareEgim.toFixed(3) + 'deg)';
  requestAnimationFrame(dongu);
}

/* ── detay: tablo ekrana doğru uçuyor (FLIP) ─────────────────────────────── */

const detay = $('#detay'), ucan = $('#ucan'), kunyeEl = $('#kunye'), duyuru = $('#duyuru');
let acikIdx = -1;

function ac(idx) {
  const el = duvar.querySelector('.eser[data-i="' + idx + '"]');
  if (!el) return;
  const w = YERLER[idx].w;
  const r = el.getBoundingClientRect();

  /* 1. Başlangıç: tablonun duvardaki tam yeri */
  ucan.style.transition = 'none';
  ucan.style.left = r.left + 'px';
  ucan.style.top = r.top + 'px';
  ucan.style.width = r.width + 'px';
  ucan.style.height = r.height + 'px';
  ucan.style.transform = 'none';
  ucan.innerHTML = '<div class="cerceve"><img src="' + w.src + '" alt="' +
                   w.title + ', ' + w.year + '"></div>';

  detay.classList.add('acik');
  detay.setAttribute('aria-hidden', 'false');
  el.style.visibility = 'hidden';
  acikIdx = idx;

  /* 2. Hedef: ekranın ortası, okunur boyut */
  const maxG = innerWidth * 0.78, maxY = innerHeight * 0.62;
  const oran = w.cw / w.ch;
  let g = maxG, y = g / oran;
  if (y > maxY) { y = maxY; g = y * oran; }
  const hx = (innerWidth - g) / 2, hy = (innerHeight - y) / 2 - innerHeight * 0.045;

  /* Hedefi uygula. rAF gecikirse (arka plan sekmesi, donmuş zaman çizelgesi)
     tablo duvardaki yerinde takılı kalıyordu — zaman aşımı yedeği şart. */
  let uygulandi = false;
  const hedefeGec = () => {
    if (uygulandi) return;
    uygulandi = true;
    ucan.style.transition = '';
    ucan.style.left = hx + 'px';
    ucan.style.top = hy + 'px';
    ucan.style.width = g + 'px';
    ucan.style.height = y + 'px';
  };
  requestAnimationFrame(() => requestAnimationFrame(hedefeGec));
  setTimeout(hedefeGec, 90);

  const gloss = (L().works[w.id] || {}).gloss || '';
  const not = (L().works[w.id] || {}).note || w.note;
  const durum = w.status === 'satilik' ? t('avail_studio')
              : w.status === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
  kunyeEl.innerHTML =
    '<div class="ad">' + w.title + '</div>' +
    (gloss ? '<div class="cev">' + gloss + '</div>' : '') +
    '<div class="sat">' + w.year + ' · ' + t('medium') + '<br>' +
    w.size + '  |  ' + w.sizeIn + '</div>' +
    '<div class="not">“' + not + '”</div>' +
    '<div class="durum">' + durum + '</div>';

  /* Görünürlüğü doğrudan ver: sınıf tabanlı gecikmeli geçiş çalışmazsa
     künye boş kalıyordu. Geçiş yalnızca süsleme olmalı, koşul değil. */
  kunyeEl.style.opacity = '1';
  kunyeEl.style.transform = 'translateX(-50%) translateY(0)';
  detay.style.opacity = '1';
  detay.style.visibility = 'visible';

  tabela.style.opacity = '0';
  duyuru.textContent = (idx + 1) + ' / ' + N + '. ' + w.title + '. ' + w.year + '. ' + w.size + '.';
  $('#kapat').focus({ preventScroll: true });
}

function kapat() {
  if (acikIdx < 0) return;
  const el = duvar.querySelector('.eser[data-i="' + acikIdx + '"]');
  const r = el.getBoundingClientRect();
  ucan.style.left = r.left + 'px';
  ucan.style.top = r.top + 'px';
  ucan.style.width = r.width + 'px';
  ucan.style.height = r.height + 'px';
  detay.classList.remove('acik');
  detay.setAttribute('aria-hidden', 'true');
  tabela.style.opacity = '';
  kunyeEl.style.opacity = '';
  kunyeEl.style.transform = '';
  detay.style.opacity = '';
  detay.style.visibility = '';
  const geri = acikIdx;
  acikIdx = -1;
  setTimeout(() => {
    el.style.visibility = '';
    if (acikIdx < 0) ucan.innerHTML = '';
  }, 740);
  el.focus({ preventScroll: true });
}

function git(yon) {
  if (acikIdx < 0) return;
  const y = (acikIdx + yon + N) % N;
  /* hedef eseri kadraja getir ki geri dönüş doğru yere olsun */
  const d = YERLER[y];
  const gp = duvarGenisCm * ppc;
  const max = Math.max(0, gp - innerWidth);
  const istenen = Math.min(max, Math.max(0, d.x * ppc - innerWidth / 2 + (d.w.cw * ppc) / 2));
  const oran = document.body.scrollHeight - innerHeight;
  if (max > 0) scrollTo({ top: (istenen / max) * oran, behavior: 'auto' });
  const eski = duvar.querySelector('.eser[data-i="' + acikIdx + '"]');
  if (eski) eski.style.visibility = '';
  requestAnimationFrame(() => requestAnimationFrame(() => ac(y)));
}

$('#perde').addEventListener('click', kapat);
$('#kapat').addEventListener('click', kapat);
$('.onceki').addEventListener('click', () => git(-1));
$('.sonraki').addEventListener('click', () => git(1));
addEventListener('keydown', (e) => {
  if (acikIdx >= 0) {
    if (e.key === 'Escape') kapat();
    if (e.key === 'ArrowLeft') git(-1);
    if (e.key === 'ArrowRight') git(1);
  }
});
$('#hepsi').addEventListener('click', () => scrollTo({ top: 0, behavior: 'auto' }));

/* ── başlat ──────────────────────────────────────────────────────────────── */

addEventListener('resize', boyutla, { passive: true });
boyutla();
merkeziBul();
tabelaTazele();
requestAnimationFrame(dongu);
</script>
