<style>
/* Sayfalar arasi gecis. Galeri ayri bir HTML dosyasi oldugu icin
   tiklayinca tam sayfa yenilemesi oluyordu: beyaz bir sicrama ve
   "baska bir siteye gittim" hissi. Bu iki satir, destekleyen
   tarayicida gecisi capraz sonmeye ceviriyor. Desteklemeyen
   tarayicida hicbir sey degismiyor - sayfa eskisi gibi aciliyor. */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) {
  animation-duration: 260ms;
}

@property --k {          /* kayıtsız özel değişken geçişlenemez */
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}

/* Kabuğun beklediği değişkenler. Katalog kendi paletini kullanıyor
   (--kagit, --murekkep, --alan); bunlar kabuğa ait ve mekân
   sayfasındakiyle birebir aynı olmak zorunda, yoksa iki sayfanın
   kâğıdı ve menüsü farklı ölçülerde çıkar. */
:root {
  --shell-pad: clamp(12px, 3vw, 28px);
  --pad:       clamp(24px, 4vw, 56px);
  --ink:       #111111;
  --panel:     #ffffff;
  --line:      #dcdcdc;
  --soft:      #6a6a6a;
  --link:      #5f5326;
  --t-micro:   11px;
}

/*__KABUK_CSS__*/

/* ═══════════════════════════════════════════════════════════════════════════
   ESERLER — katalog.

   Şato duvarı (yaldız çerçeve, damask, avize, yatay kaydırma) kaldırıldı.
   Yerine galerilerin kendi çözümü: her eser AYNI boyutta nötr bir alanın
   içinde, ama KENDİ gerçek ölçüsüyle. 200 cm'lik bir tuval alanı doldurur,
   40 cm'lik bir etüt aynı alanın ortasında küçücük kalır. Lüks hissi
   çerçeveden değil, o gri dikdörtgenden, doğru ölçekten ve tek bir gölgeden
   geliyor; üstelik ölçek bir süs değil, BİLGİ.

   Bu düzen iki eski eleştiriyi de kapatıyor: "on bir eser aynı barok
   yaldızda" ve "40 cm'lik etüt ile 200 cm'lik tuval ekranda birebir aynı
   görünüyor".

   Detay katmanı (beyaz tam ekran + sağ künye + ESER/EV ORTAMI kareleri)
   olduğu gibi korundu; artık ızgarayla aynı dünyada, koyu yeşilden beyaza
   sıçrama yok.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --kagit:    #faf9f6;   /* sayfa zemini */
  --alan:     #eceae4;   /* eserin durduğu nötr saha */
  --murekkep: #1c211a;
  --soluk:    rgba(28,33,26,.54);
  --silik:    rgba(28,33,26,.40);
  --cizgi:    rgba(28,33,26,.13);
  --bronz:    #8a6d2e;
  --altin:    #9a7d3f;

  --sans:  "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Cormorant Garamond", Garamond, "EB Garamond", Georgia, serif;
  --ease:  cubic-bezier(.19, 1, .22, 1);

  --ppc: 1.6px;          /* piksel / santimetre — JS yazıyor */
  --en:  1180px;         /* okuma genişliği */
  color-scheme: light;
}

* { box-sizing: border-box; }

/* Sayfanın kendi zemini koyu: üstünde tablo zemini duruyor, içerik de
   onun üstündeki beyaz kâğıtta. Eskiden krem kâğıt sayfanın TAMAMI
   olduğu için galeri ayrı bir siteymiş gibi duruyordu. */
html { background: #17161a; }
html.durdur, html.durdur body { overflow: hidden; }   /* detay açıkken */

body {
  margin: 0; color: var(--murekkep); background: var(--kagit);
  font: 400 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
:focus-visible { outline: 2px solid var(--altin); outline-offset: 3px; }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ── üst şerit ───────────────────────────────────────────────────────────
   Sayfa artık dikey kayıyor, bu yüzden şerit sticky: eserler arasında
   aşağı inerken dile ve çıkışa erişim kaybolmasın. */

/* ── başlık bloğu ───────────────────────────────────────────────────────── */
#panel > main { max-width: var(--en); margin: 0 auto; padding: 0 0 40px; }

/* Üst dolgu yok: kâğıt panelin kendi dolgusu zaten boşluğu veriyor.
   Bu satır main sayfanın TAMAMI olduğu zamandan kalmıştı; kabukla
   birleşince iki boşluk üst üste bindi ve galerinin başlığı mekân
   sayfasındakinden 95 px aşağıda başlıyordu. */
#lede { padding: 0 0 clamp(26px, 3vw, 38px); max-width: 46ch; }
#lede h1 {
  margin: 0; font-family: var(--serif); font-weight: 300;
  font-size: clamp(34px, 2.2rem + 2vw, 60px); line-height: 1.04;
  letter-spacing: -.01em; text-wrap: balance;
}
#lede .alt {
  margin-top: 16px; font-size: 14px; line-height: 1.62; color: var(--soluk);
}

/* ── seri süzgeci ───────────────────────────────────────────────────────
   Düz yazı bağlantılar. Kutu, hap, gölge yok: bir katalogda bölüm
   başlıkları nasıl duruyorsa öyle. */
#suzgec {
  display: flex; flex-wrap: wrap; gap: 6px 26px; align-items: baseline;
  padding: 22px 0; border-top: 1px solid var(--cizgi); border-bottom: 1px solid var(--cizgi);
}
#suzgec button {
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  font: 400 11px/1 var(--sans); letter-spacing: .15em; text-transform: uppercase;
  color: var(--silik); border-bottom: 1px solid transparent;
  transition: color 220ms var(--ease), border-color 220ms var(--ease);
}
#suzgec button:hover { color: var(--murekkep); }
#suzgec button[aria-current="true"] { color: var(--bronz); border-color: var(--bronz); }
#suzgec .sayi {
  margin-left: auto; font-size: 10.5px; letter-spacing: .14em;
  color: var(--silik); font-variant-numeric: tabular-nums;
}
/* Dar ekranda süzgeç iki satıra sarıyor ve sayaç sağdan taşıyordu. */
@media (max-width: 620px) { #suzgec .sayi { display: none; } }

/* Ölçek açıklaması lede'de duruyor; burada tekrarlamak gereksizdi.
   Kalan tek not, imleçle gelen ortam görselinin ipucu — dokunmatikte
   karşılığı olmadığı için orada hiç yazılmıyor. */
#notlar { display: none; padding: 18px 0 0; font-size: 11.5px; color: var(--silik); }
@media (hover: hover) and (min-width: 761px) { #notlar { display: block; } }

/* ── ızgara ─────────────────────────────────────────────────────────────── */
#izgara {
  /* align-items: start -- kartlar artik eserin oraninda, yani farkli
     yukseklikte. Varsayilan `stretch` kisa karti satirin boyuna
     GERIYORDU ve eser kutunun icinde yuzuyordu. */
  align-items: start;
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: clamp(34px, 4vw, 58px) clamp(24px, 3vw, 40px);
  padding-top: clamp(32px, 4vw, 52px);
}
@media (max-width: 760px) { #izgara { grid-template-columns: 1fr; } }

.kart { text-decoration: none; display: block; }
.kart[hidden] { display: none; }

/* Nötr saha: her eserde AYNI. Ölçüyü okuyabilmenin tek yolu ortak bir zemin. */
.alan {
  position: relative; aspect-ratio: 4 / 3;
  /* Zemin YOK. Gri saha + eserin golgesi birlikte cerceve etkisi
     yaratiyordu: eser kagidin uzerinde kendi kutusunun icinde duruyor
     gibi gorunuyordu. Eser dogrudan kagidin uzerinde dursun. */
  background: transparent;
  display: grid; place-items: center;
  overflow: hidden;
}
/* Eser: gerçek santimetre ölçüsünden çiziliyor ( --cw / --ch × --ppc ).
   Kırpma YOK — object-fit devrede değil, kutu zaten eserin oranında. */
.tuval {
  display: block;
  width:  calc(var(--cw) * var(--ppc));
  height: calc(var(--ch) * var(--ppc));
  /* Kutu künyedeki cm ölçüsünden çiziliyor. Fotoğrafın oranı tutmazsa
     object-fit olmadan görsel GERİLİR — bir tabloyu germek kırpmaktan
     beterdir. cover kırpar, asla bozmaz; panel zaten uyuşmazlığı yüklerken
     uyarıyor. */
  object-fit: cover;
  /* Golge kaldirildi: gri sahayla birlikte cerceve gibi okunuyordu. */
  transition: transform 620ms var(--ease), opacity 620ms var(--ease);
}

/* Kutu ESERIN KENDI ORANINDA. Once kutu sabit 4:3 idi ve eser onun
   icine yerlestiriliyordu; olculdu, dikey eserler kutudan TASIYORDU
   (eser-2 %119, eser-5 %126 doluluk) ve .alan'in overflow:hidden'i
   tasan kismi KESIYORDU -- yani ust ve alt kirpiliyordu.
   Konulan `max-height: 92%` hic calismamisti: yuzdeli max-height,
   ebeveynin yuksekligi acikca verilmediginde (burada aspect-ratio'dan
   turuyor) cozumlenmiyor.
   Kutu esere uyunca kirpma da bosluk da kalmiyor. Kartlarin yuksekligi
   birbirinden farkli oluyor; bu bir kusur degil, musterinin karari:
   "tam boy halinde olacak hepsi, simetri sikintisi yok". */
/* Kutunun oranini VERMIYORUZ, gorselin kendisine biraktiriyoruz.
   aspect-ratio: var(--cw)/var(--ch) denendi ve 1-3 px kirpiyordu:
   nominal cm degerleri yuvarlanmis (120/90 = 1.3333, gercek 1.332) ve
   kutu ile gorsel bu kadar ayrisinca overflow:hidden farki kesiyordu.
   Kutu = gorsel olunca uyusmazlik diye bir sey kalmiyor. */
.kart.olcusuz .alan { aspect-ratio: auto; display: block; }

/* OLCU YOKKEN gercek-olcu sistemi devre disi: eser kareyi doldurur.
   Sebep olculdu -- kunyede olcu olmadigi icin derleme her esere nominal
   bir cm degeri turetiyor ve hepsi 120'de tavanlaniyor. Sistem "en
   buyuk eser 120 cm YUKSEK olabilir" diye yer ayiriyor ama hicbiri
   degil, dolayisiyla 120x90'lik bir eser karenin ancak %58'ini
   kapliyordu. Yani olcu karsilastirmasi hicbir sey karsilastirmiyor,
   yalnizca eseri kucultuyordu; oda kurgusu bunu gizliyordu.
   Gercek olculer gelince `olcusuz` sinifi dusuyor ve karsilastirma
   kendiliginden geri geliyor. */
.kart.olcusuz .tuval {
  /* height: auto -- yuzdeli yukseklik burada CALISMIYOR. Ebeveynin
     yuksekligi acikca verilmediginde yuzde cozumlenmiyor ve deger
     auto'ya dusuyor; `max-height: 92%` ve `height: 100%` denemelerinin
     ikisi de bu yuzden hicbir sey yapmamisti. Genislik %100, yukseklik
     gorselin kendi orani. object-fit devre disi kaliyor (kutu zaten
     gorselin olcusunde), yani kirpma da germe de yok. */
  width: 100%; height: auto;
  object-fit: fill;
}
/* Asil ve TEK goruntu eserin kendisi. Once oda kurgusu asildi ve
   tuval imlecle geliyordu; iki sebeple kaldirildi:
   - Musteri duz tablo istedi.
   - `hover: hover` kapisi yuzunden dokunmatik cihazda duz eser izgarada
     HIC gorunmuyordu, yani ziyaretcilerin cogu galeri sayfasinda eserin
     kendisini hic gormuyordu. Ustelik kurgularda eser karenin ancak
     %25-45'ini kapliyordu.
   Imlec artik yalnizca kagittan kaldiriyor -- her eserde ayni. */
@media (hover: hover) {
  .kart:hover .tuval {
    /* Yalniz hafif bir kalkma; golge yok (cerceve etkisi yapiyordu). */
    transform: translateY(-3px);
  }
}

/* Sergi karesi: eserin galeri duvarındaki hâli. Kartın ASIL görseli bu;
   imleç gelince yerini eserin kendisine bırakıyor. Dokunmatikte hover
   yok — orada detaydaki ESER karesi aynı işi görüyor. */
/* contain, cover DEĞİL. Smartist maketleri sosyal medya oranlarında
   çıkıyor (16:9, 9:16, 4:5, 1:1, 2:3) ve hiçbiri bu alanın 4:3'ü değil.
   Ölçüldü: cover ile 9:16 ve 4:5 dışa aktarımlarda zemin, mobilya, kanepe
   — yani maketin BÜTÜN anlamı olan oda bağlamı — kadrajın dışında kalıyor,
   geriye eseri dolduran bir yakın plan kalıyordu. contain her oranı
   olduğu gibi gösteriyor; artan yer zaten alanın kendi grisi. */
/* .ortam kurallari KALDIRILDI: galeri izgarasi artik oda kurgusu
   basmiyor, eserin kendisini basiyor. Varliklar duruyor -- ana
   sayfadaki giris karti ve paylasim gorseli hala onlari kullaniyor. */

/* künye — Zwirner mantığı: ad ve yıl bir satır, sonra teknik, sonra ölçü */
.kunye { padding-top: 16px; }
.kunye .ad {
  font-family: var(--serif); font-size: 21px; line-height: 1.2; color: var(--murekkep);
}
.kunye .ad i { font-style: italic; }
.kunye .cev {
  font-family: var(--serif); font-style: italic; font-size: 14px;
  color: var(--silik); margin-top: 2px;
}
.kunye .satir { font-size: 12.5px; line-height: 1.5; color: var(--soluk); margin-top: 7px; }
.kunye .olcu { margin-top: 1px; font-variant-numeric: tabular-nums; text-transform: none; }
.kunye .ayrac { color: rgba(28,33,26,.26); padding: 0 2px; }
.kunye .durum {
  margin-top: 12px; font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--bronz);
}

#bos { padding: 70px 0; color: var(--soluk); font-size: 14px; }
#bos[hidden] { display: none; }

/* ── DETAY: beyaz zeminde tam ekran ─────────────────────────────────────
   Eser katalog sayfasından koparılıp tek başına duvara alınıyor: büyük
   reprodüksiyon solda, künye sağ panelde. Bu katman şato sürümünden
   olduğu gibi geldi — orada da doğru olan tek parça oydu. */
#detay {
  position: fixed; inset: 0; z-index: 30;
  background: #faf9f6;
  display: grid;
  grid-template-columns: 1fr clamp(300px, 25vw, 400px);
  pointer-events: none; visibility: hidden; opacity: 0;
  transition: opacity 340ms var(--ease), visibility 0s linear 360ms;
}
#detay.acik {
  pointer-events: auto; visibility: visible; opacity: 1;
  transition: opacity 280ms var(--ease), visibility 0s;
}

#sahne { display: grid; place-items: center; min-width: 0; overflow: hidden;
         padding: clamp(22px, 3.4vw, 60px); }
#buyuk { cursor: zoom-in; }
#sahne.yakin #buyuk { cursor: zoom-out; }
#buyuk {
  display: block; max-width: 100%;
  max-height: calc(100vh - 2 * clamp(22px, 3.4vw, 60px));
  /* Golge yok: izgarada oldugu gibi burada da cerceve gibi duruyordu. */
  opacity: 0; transform: scale(.968);
  transition: opacity 340ms var(--ease), transform 520ms var(--ease);
}
#detay.acik #buyuk { opacity: 1; transform: none; }
#sahne.yakin #buyuk { transition: transform 90ms linear, opacity 340ms var(--ease); }

#bilgi {
  background: #fff; border-left: 1px solid var(--cizgi);
  padding: clamp(56px, 5vw, 78px) clamp(22px, 2.2vw, 40px) clamp(22px, 3vw, 40px);
  display: flex; flex-direction: column; overflow-y: auto; color: #1c211a;
}
#kunye .ad {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(23px, 1.3rem + .7vw, 31px); line-height: 1.15; color: #14180f;
}
#kunye .cev {
  font-family: var(--serif); font-style: italic; font-size: 14px;
  color: var(--silik); margin-top: 4px;
}
#kunye .seri {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--altin); margin-top: 20px;
}
#kunye dl {
  margin: 12px 0 0; padding-top: 14px; border-top: 1px solid var(--cizgi);
  display: grid; grid-template-columns: auto 1fr; gap: 7px 16px;
  font-size: 12.5px; line-height: 1.5;
}
#kunye dt { color: rgba(28,33,26,.46); letter-spacing: .04em; }
#kunye dd { margin: 0; color: #23281d; font-variant-numeric: tabular-nums; }
#kunye .not {
  font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 1.62;
  color: rgba(28,33,26,.80); margin-top: 22px; padding-top: 18px;
  border-top: 1px solid var(--cizgi);
}
#kunye .durum {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--bronz); margin-top: 18px;
}

/* iki kare: düz reprodüksiyon + ev ortamı maketi. contain — bu kareler
   "hangi görsel" sorusunu cevaplıyor, kadraj değil. */
#kareler { display: flex; align-items: flex-start; gap: 12px; margin-top: 24px; }
#kareler:empty { display: none; }
#kareler button {
  flex: 0 0 92px; padding: 0; border: 0; background: none;
  font: inherit; text-align: left; cursor: pointer;
}
#kareler img {
  display: block; width: 100%; height: 58px; object-fit: contain;
  background: rgba(28,33,26,.06); opacity: .58;
  outline: 1px solid rgba(28,33,26,.14); outline-offset: -1px;
  transition: opacity 200ms var(--ease), outline-color 200ms var(--ease);
}
#kareler button:hover img { opacity: .85; }
#kareler button[aria-current="true"] img {
  opacity: 1; outline: 2px solid var(--altin); outline-offset: -2px;
}
#kareler span {
  display: block; margin-top: 7px;
  font-size: 9.5px; letter-spacing: .11em; text-transform: uppercase;
  white-space: nowrap; color: rgba(28,33,26,.5);
}
#kareler button[aria-current="true"] span { color: var(--bronz); }

#gez { margin-top: auto; padding-top: 26px; display: flex; align-items: center; gap: 14px; }
#gez button {
  background: none; cursor: pointer; width: 38px; height: 38px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid rgba(28,33,26,.22); border-radius: 50%;
  color: #33392b; font: 400 16px/1 var(--sans);
  transition: background 240ms var(--ease), border-color 240ms var(--ease), color 240ms;
}
#gez button:hover { background: #1c211a; border-color: #1c211a; color: #fff; }
#sayac { font-size: 11px; letter-spacing: .14em; color: var(--soluk);
         font-variant-numeric: tabular-nums; }
#kapat {
  position: absolute; top: 16px; right: clamp(14px, 2vw, 26px);
  background: none; border: 0; cursor: pointer; padding: 10px;
  color: var(--soluk); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  transition: color 240ms;
}
#kapat:hover { color: #1c211a; }

@media (max-width: 860px) {
  #detay { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #bilgi { border-left: 0; border-top: 1px solid var(--cizgi);
           padding: 22px clamp(18px, 5vw, 28px) calc(22px + env(safe-area-inset-bottom)); }
  #sahne { padding: 54px 16px 12px; }
  #buyuk { max-height: 52vh; }
  #gez { padding-top: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; }
}

<div id="panel">
<main>
  <div id="lede">
    <h1></h1>
    <p class="alt"></p>
  </div>

  <nav id="suzgec" aria-label="Seriler"></nav>
  <p id="notlar"></p>

  <div id="izgara"></div>
  <p id="bos" hidden></p>
</main>
</div>
<div id="kivrim" aria-hidden="true"><i></i></div>
</div>

<div id="detay" aria-hidden="true">
  <div id="sahne"><img id="buyuk" alt=""></div>
  <aside id="bilgi">
    <div id="kunye"></div>
    <div id="kareler"></div>
    <div id="gez">
      <button class="onceki" type="button">←</button>
      <span id="sayac"></span>
      <button class="sonraki" type="button">→</button>
    </div>
  </aside>
  <button id="kapat" type="button"></button>
</div>

<p id="duyuru" class="gizli" aria-live="polite" aria-atomic="true"></p>

<noscript>
  <div style="padding:60px 24px;max-width:34em;margin:0 auto">
    <h1 style="font-weight:400">Eserler</h1>
    <p>Bu bölüm JavaScript gerektiriyor.
       <a href="./">Eserlerin listesine dönün</a>.</p>
  </div>
</noscript>

<script>
/*__SITE_DATA__*/
/*__KIT__*/

/* Kabuk ile bu sayfa arasındaki sözleşme. Dil, zemin, hamburger ve menü
   kabuğun işi; gezinme ve yeniden çizim bu sayfanın. */
window.KABUK = {
  sayfa: 'sergi',
  /* Menüden bir satıra tıklanınca: galeri zaten buradayız, ötekiler
     mekân sayfasının rotaları. */
  git: (route) => {
    if (route === '/galeri') return;
    location.href = './#' + route;
  },
  yenile: () => dilUygula(),
};

/*__KABUK_JS__*/

document.documentElement.lang = LANG;

const $ = (s) => document.querySelector(s);
const WORKS = SITE.works;                 // build.py sıraya göre veriyor
const izgara = $('#izgara'), suzgec = $('#suzgec');
const detay = $('#detay'), buyuk = $('#buyuk'), kunyeEl = $('#kunye'),
      karelerEl = $('#kareler'), sayac = $('#sayac'), duyuru = $('#duyuru');

let seri = 'hepsi';
let gorunen = WORKS.slice();              // süzgeçten geçen liste; oklar bunu izler
let acikIdx = -1;                         // gorunen içindeki indeks
let geriScroll = 0;

/* Türkçe büyük harf: toUpperCase() "i" harfini "I" yapıyor. */

function durumMetni(s) {
  if (!s) return '';          /* bos durum bir durum degil */
  return s === 'satilik' ? t('avail_studio')
       : s === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
}

/* ── ÖLÇEK ────────────────────────────────────────────────────────────
   Her eser aynı boyutta nötr bir alanın içinde, kendi gerçek ölçüsüyle.
   Ölçek BÜTÜN koleksiyona göre hesaplanıyor, süzgeçten geçene göre değil:
   yoksa aynı eser "Tümü" ile "Hava" görünümünde iki farklı boyutta çıkardı
   ve ölçek karşılaştırması anlamını yitirirdi. */
const EN_GENIS  = Math.max.apply(null, WORKS.map((w) => w.cw));
const EN_YUKSEK = Math.max.apply(null, WORKS.map((w) => w.ch));
const DOLULUK = 0.84;      /* en büyük eser alanın %84'ünü kaplasın */
const EN_KUCUK = 0.10;     /* güvenlik tabanı: bir aykırı ölçü 2 px'e inmesin */

function olcekle() {
  const el = izgara.querySelector('.alan');
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const ppc = Math.min(r.width * DOLULUK / EN_GENIS, r.height * DOLULUK / EN_YUKSEK);
  izgara.style.setProperty('--ppc', ppc.toFixed(4) + 'px');
  /* Taban: koleksiyonda uçlar çok açıksa küçük eser kaybolmasın. */
  const taban = r.width * EN_KUCUK;
  izgara.querySelectorAll('.kart').forEach((a) => {
    const g = Number(a.dataset.cw) * ppc;
    a.style.setProperty('--ppc', g < taban ? (taban / Number(a.dataset.cw)).toFixed(4) + 'px' : '');
  });
}

/* ── ızgara ─────────────────────────────────────────────────────────────── */
function kartlariKur() {
  izgara.innerHTML = '';
  WORKS.forEach((w) => {
    const a = document.createElement('a');
    /* Kunyede gercek olcu yoksa gercek-olcu cizimi anlamsiz: nominal
       cm degerleri uydurma ve hepsi ayni tavanda. */
    a.className = w.size ? 'kart' : 'kart olcusuz';
    a.href = '#/eser/' + encodeURIComponent(w.slug);
    a.dataset.slug = w.slug;
    a.dataset.seri = w.series;
    a.dataset.cw = w.cw;
    a.style.setProperty('--cw', w.cw);
    a.style.setProperty('--ch', w.ch);
    a.innerHTML =
      '<div class="alan">' +
        /* alt metni BOS DEGIL: izgaradaki 16 gorselin hicbirinde alt
           metni yoktu. Bagimsiz okunabilir olsun diye eser adi. */
        '<img class="tuval" src="' + w.src + '" alt="' +
             w.title.replace(/"/g, '&quot;') + '" loading="lazy" ' +
             'style="background:' + (w.tone || '#e6e3dc') + '">' +
      '</div><div class="kunye"></div>';
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const i = gorunen.indexOf(w);
      if (i >= 0) ac(i);
    });
    izgara.appendChild(a);
  });
}

function kunyeleriYaz() {
  izgara.querySelectorAll('.kart').forEach((a) => {
    const w = WORKS.find((x) => x.slug === a.dataset.slug);
    if (!w) return;
    const gloss = (L().works[w.id] || {}).gloss || '';
    /* Eksik alan HIC BASILMIYOR. Gercek eserler geldi ama künye bilgileri
       (yıl, ölçü) henüz gelmedi; boş bir ölçü satırı ya da "Eser 1, 0"
       yazmak uydurma veriden beter durur. */
    a.querySelector('.kunye').innerHTML =
      '<div class="ad"><i>' + w.title + '</i>' + (w.year ? ', ' + w.year : '') + '</div>' +
      (gloss ? '<div class="cev">' + gloss + '</div>' : '') +
      '<div class="satir">' + t('medium') + '</div>' +
      (w.size ? '<div class="satir olcu">' + w.size +
        ' <span class="ayrac">|</span> ' + w.sizeIn + '</div>' : '') +
      (w.status ? '<div class="durum">' + durumMetni(w.status) + '</div>' : '');
    a.setAttribute('aria-label',
      [w.title, w.year || null, w.size || null].filter(Boolean).join(', ') + '.');
  });
}

/* ── seri süzgeci ───────────────────────────────────────────────────────── */
function suzgeciKur() {
  suzgec.innerHTML = '';
  /* Tek seri varken suzgec bir sey suzmuyor: TUMU ile o serinin
     satiri ayni listeyi veriyor. Musterinin gercek eserleri geldi ama
     seri adlari henuz yok; hepsi tek gecici grupta. Suzgec o durumda
     gizleniyor, seri adlari gelince kendiliginden geri geliyor. */
  const seriSayisi = (SITE.series || [])
    .filter((s) => WORKS.some((w) => w.series === s.key)).length;
  suzgec.hidden = seriSayisi < 2;
  if (suzgec.hidden) return;
  const ekle = (anahtar, ad) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = ad;
    b.dataset.k = anahtar;
    b.setAttribute('aria-current', String(anahtar === seri));
    b.addEventListener('click', () => suz(anahtar));
    suzgec.appendChild(b);
  };
  ekle('hepsi', t('gal_all'));
  (SITE.series || []).forEach((s) => {
    if (!WORKS.some((w) => w.series === s.key)) return;   // boş seri listelenmesin
    ekle(s.key, ((L().series || {})[s.key] || K.seriesOf(s.key) || {}).title || s.key);
  });
  const sayi = document.createElement('span');
  sayi.className = 'sayi';
  suzgec.appendChild(sayi);
  sayiyiYaz();
}

function sayiyiYaz() {
  const s = suzgec.querySelector('.sayi');
  if (s) s.textContent = gorunen.length + ' / ' + WORKS.length;
}

function suz(anahtar) {
  seri = anahtar;
  gorunen = anahtar === 'hepsi' ? WORKS.slice() : WORKS.filter((w) => w.series === anahtar);
  izgara.querySelectorAll('.kart').forEach((a) => {
    a.hidden = anahtar !== 'hepsi' && a.dataset.seri !== anahtar;
  });
  suzgec.querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-current', String(b.dataset.k === seri));
  });
  const bos = $('#bos');
  bos.textContent = t('gal_empty');
  bos.hidden = gorunen.length > 0;
  sayiyiYaz();
  olcekle();
}

/* ── detay ──────────────────────────────────────────────────────────────── */
function ac(idx) {
  const w = gorunen[idx];
  if (!w) return;
  const gloss = (L().works[w.id] || {}).gloss || '';
  const not = (L().works[w.id] || {}).note || w.note;
  const seriAd = ((L().series || {})[w.series] || K.seriesOf(w.series) || {}).title || '';

  buyuk.style.opacity = '0';
  /* Duz eser. Once oda kurgusu aciliyordu ve eser karenin kucuk bir
     parcasi kaliyordu; detay gorunumunun isi eseri gostermek. */
  buyuk.src = w.src;
  buyuk.alt = w.title + ', ' + w.year;
  requestAnimationFrame(() => { buyuk.style.opacity = ''; });

  kunyeEl.innerHTML =
    '<div class="ad">' + w.title + '</div>' +
    (gloss ? '<div class="cev">' + gloss + '</div>' : '') +
    (seriAd ? '<div class="seri">' + seriAd + '</div>' : '') +
    '<dl>' +
      (w.year ? '<dt>' + t('lbl_year') + '</dt><dd>' + w.year + '</dd>' : '') +
      '<dt>' + t('lbl_medium') + '</dt><dd>' + t('medium') + '</dd>' +
      (w.size ? '<dt>' + t('lbl_size') + '</dt><dd>' + w.size +
                '<br>' + w.sizeIn + '</dd>' : '') +
    '</dl>' +
    (not ? '<div class="not">“' + not + '”</div>' : '') +
    (w.status ? '<div class="durum">' + durumMetni(w.status) + '</div>' : '');

  /* Tek kare: eserin kendisi. Sergi karesi sekmesi kaldirildi.
     kareler.length < 2 oldugu icin sekme cubugu kendiliginden bos
     kaliyor -- asagidaki satir zaten bunu yapiyor. */
  const kareler = [{ src: w.src, ad: t('kare_eser') }];
  karelerEl.innerHTML = kareler.length < 2 ? '' : kareler.map((k, i) =>
    '<button type="button" data-src="' + k.src + '" aria-current="' + (i === 0) + '">' +
    '<img src="' + k.src + '" alt=""><span>' + k.ad + '</span></button>').join('');

  sayac.textContent = (idx + 1) + ' / ' + gorunen.length;

  if (acikIdx < 0) {                       // ilk açılış: sayfanın yerini sakla
    geriScroll = window.scrollY;
    document.documentElement.classList.add('durdur');
  }
  yakinlastir(false);
  detay.classList.add('acik');
  detay.setAttribute('aria-hidden', 'false');
  acikIdx = idx;
  adresYaz(idx);
  duyuru.textContent = (idx + 1) + ' / ' + gorunen.length + '. ' +
                       [w.title, w.year || null, w.size || null]
                         .filter(Boolean).join('. ') + '.';
  $('#kapat').focus({ preventScroll: true });
}

function kapat() {
  if (acikIdx < 0) return;
  const geri = gorunen[acikIdx];
  acikIdx = -1;
  yakinlastir(false);
  adresYaz(-1);
  detay.classList.remove('acik');
  detay.setAttribute('aria-hidden', 'true');
  document.documentElement.classList.remove('durdur');
  window.scrollTo(0, geriScroll);
  const el = geri && izgara.querySelector('.kart[data-slug="' + geri.slug + '"]');
  if (el) el.focus({ preventScroll: true });
}

function git(yon) {
  if (acikIdx < 0 || !gorunen.length) return;
  ac((acikIdx + yon + gorunen.length) % gorunen.length);
}

/* Kareye tıklayınca büyük görsel değişiyor; yakınlaştırma sıfırlanıyor
   çünkü iki görselin çerçevesi aynı değil. */
karelerEl.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  yakinlastir(false);
  buyuk.style.opacity = '0';
  buyuk.src = b.dataset.src;
  requestAnimationFrame(() => { buyuk.style.opacity = ''; });
  karelerEl.querySelectorAll('button').forEach((x) =>
    x.setAttribute('aria-current', String(x === b)));
});

/* ── yakınlaştırma ────────────────────────────────────────────────────
   Tıkla büyüsün, fare gezindikçe kadraj takip etsin; dokunmatikte çift
   dokunuş. KAT 2,2 ile sınırlı: kaynak dosya 1686 px. */
const sahne = $('#sahne');
const KAT = 2.2;
let yakin = false;

function odak(x, y) {
  const r = buyuk.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const px = Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100));
  const py = Math.min(100, Math.max(0, ((y - r.top) / r.height) * 100));
  buyuk.style.transformOrigin = px.toFixed(1) + '% ' + py.toFixed(1) + '%';
}

function yakinlastir(acik, x, y) {
  yakin = acik;
  sahne.classList.toggle('yakin', yakin);
  if (yakin) { odak(x, y); buyuk.style.transform = 'scale(' + KAT + ')'; }
  else { buyuk.style.transform = ''; buyuk.style.transformOrigin = ''; }
}

buyuk.addEventListener('click', (e) => yakinlastir(!yakin, e.clientX, e.clientY));
sahne.addEventListener('pointermove', (e) => {
  if (yakin && e.pointerType !== 'touch') odak(e.clientX, e.clientY);
});
sahne.addEventListener('pointerleave', () => { if (yakin) yakinlastir(false); });

let sonDokunus = 0;
buyuk.addEventListener('touchend', (e) => {
  const z = e.timeStamp;
  if (z - sonDokunus < 320) {
    e.preventDefault();
    const d = e.changedTouches[0];
    yakinlastir(!yakin, d.clientX, d.clientY);
  }
  sonDokunus = z;
});
buyuk.addEventListener('touchmove', (e) => {
  if (!yakin || e.touches.length !== 1) return;
  e.preventDefault();
  odak(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

/* ── tek esere kalıcı bağlantı ────────────────────────────────────────
   replaceState: her ok basışı geçmişe girmesin. Adresle gelen bir eser
   o an süzgeç dışındaysa süzgeç önce "Tümü"ne alınıyor — bağlantı her
   koşulda açılmalı. */
const ONEK = '#/eser/';

function adresYaz(idx) {
  const w = idx >= 0 ? gorunen[idx] : null;
  try {
    history.replaceState(null, '',
      w ? ONEK + encodeURIComponent(w.slug) : location.pathname + location.search);
  } catch (e) { /* file:// ve bazı gömülü bağlamlarda güvenlik hatası atıyor */ }
}

function adrestenAc() {
  if (location.hash.indexOf(ONEK) !== 0) return;
  const slug = decodeURIComponent(location.hash.slice(ONEK.length));
  const w = WORKS.find((x) => x.slug === slug);
  if (!w) return;
  if (gorunen.indexOf(w) < 0) suz('hepsi');
  ac(gorunen.indexOf(w));
}

$('#kapat').addEventListener('click', kapat);
$('.onceki').addEventListener('click', () => git(-1));
$('.sonraki').addEventListener('click', () => git(1));
addEventListener('keydown', (e) => {
  if (acikIdx < 0) return;
  if (e.key === 'Escape') kapat();
  if (e.key === 'ArrowLeft') git(-1);
  if (e.key === 'ArrowRight') git(1);
});

/* ── dil ─────────────────────────────────────────────────────────────────── */

function dilUygula() {
  document.documentElement.lang = LANG;
  const d = document.querySelector('meta[name="description"]');
  if (d && L().ui && L().ui.meta_desc) d.setAttribute('content', t('meta_desc'));

  $('#kapat').textContent = t('gal_close');
  $('#lede h1').textContent = t('gal_works');
  $('#lede .alt').textContent = t('gal_sub');
  /* "Uzerine gelin: eserin kendisi." notu kaldirildi: izgara artik
     zaten eserin kendisini basiyor, yani talimat yanlis olurdu.
     (Dokunmatikte de bastan beri anlamsizdi.) */
  $('#notlar').textContent = '';

  document.querySelectorAll('.onceki, .sonraki').forEach((b) => {
    const geri = b.classList.contains('onceki');
    b.setAttribute('aria-label', geri ? t('gal_prev') : t('gal_next'));
    b.title = geri ? t('gal_prev') : t('gal_next');
  });


  suzgeciKur();
  kunyeleriYaz();
  const bos = $('#bos');
  bos.textContent = t('gal_empty');
  if (acikIdx >= 0) ac(acikIdx);
}


/* ── başlat ─────────────────────────────────────────────────────────────── */
/* Galerinin zemini tuvalin KIRMIZI bölgesi (zemin.py onu ölçerek seçiyor,
   şansa bırakılmıyor). Menü satırlarının rengi de o bölgeden geliyor. */
setBackdrop('galeri');
kartlariKur();
dilUygula();
olcekle();
addEventListener('resize', olcekle, { passive: true });
addEventListener('load', olcekle);
/* Adres değişince de tepki ver: tarayıcının geri/ileri tuşuyla bir eserin
   adresine dönüldüğünde katalog da o esere açılsın. */
addEventListener('hashchange', () => {
  if (location.hash.indexOf(ONEK) === 0) adrestenAc();
  else if (acikIdx >= 0) kapat();
});

adrestenAc();
</script>
