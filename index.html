<style>
/* ═══════════════════════════════════════════════════════════════════════════
   CEMAL SAĞLAM — resim.
   Süslenmeyi reddeden site: beyaz zemin, Helvetica, devasa resimler,
   solda düz metin menü, altında küçük künye. Saç çizgisi, kart, çerçeve,
   gölge, hover süsü yok. Tek tema: beyaz.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --bg:      #ffffff;
  --ink:     #111111;
  --muted:   #4a4a4a;   /* 8.9:1 — künye gövdesi */
  --soft:    #6a6a6a;   /* 5.7:1 — ikincil satırlar; eski #8e8e8e 3.3:1'di */
  --line:    #dcdcdc;
  --link:    #1B3FCC;   /* gezinme ve bağlantılar */
  --title:   #7a3418;   /* eser adı — bağlantı mavisiyle KARIŞMASIN */

  --nav-w:  232px;
  --pad:    40px;
  --sans:   "Helvetica Neue", Helvetica, Arial, sans-serif;

  /* Tipografik ölçek: gerçek basamaklar. Öncesinde 21/13/11 vardı ve
     başlıklar gövdeyle aynı boydaydı. */
  --t-name:  21px;
  --t-nav:   13px;
  --t-h1:    26px;
  --t-h2:    17px;
  --t-body:  15px;
  --t-cap:   12px;
  --t-micro: 11px;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--t-body)/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

h1, h2, h3, p, figure, ul, li, dl, dd, dt { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; max-width: 100%; }

a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }

.skip {
  position: fixed; top: 8px; left: 8px; z-index: 30;
  background: #fff; color: var(--ink); border: 1px solid var(--ink);
  padding: 10px 14px; font-size: var(--t-cap); transform: translateY(-200%);
}
.skip:focus-visible { transform: none; }

/* ── solda sabit metin menü ──────────────────────────────────────────────── */

#nav {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--nav-w);
  padding: var(--pad) 20px var(--pad) var(--pad);
  overflow-y: auto; background: var(--bg);
}
#nav .name {
  font-size: var(--t-name); font-weight: 400; line-height: 1.2;
  color: var(--ink); margin-bottom: 30px; display: block;
}
#nav .name b { font-weight: 400; }
#nav li { margin-bottom: 9px; }
#nav a { font-size: var(--t-nav); color: var(--ink); }
#nav a.on { color: var(--link); }
#nav .gap { height: 18px; }
#burger { display: none; }

/* dil anahtarı — menünün altında, düz metin. Açılır kutu yok. */
#lang { display: flex; gap: 9px; margin-top: 24px; align-items: baseline; }
#lang button {
  font: inherit; font-size: var(--t-micro); letter-spacing: .04em;
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--soft);
}
#lang button[aria-current="true"] { color: var(--ink); }
#lang button:hover { color: var(--link); }
#lang .sep { font-size: var(--t-micro); color: var(--line); }

/* eser adının altındaki çeviri — adın yerine geçmez, altına düşer */
.cap .gloss { color: var(--soft); font-style: italic; }

/* ── içerik ──────────────────────────────────────────────────────────────── */

#main {
  margin-left: var(--nav-w);
  padding: var(--pad) var(--pad) 200px var(--pad);
  min-height: 100vh;
}

/* ── eser bloğu ──────────────────────────────────────────────────────────── */

.work { margin-bottom: 116px; }
.work:last-child { margin-bottom: 0; }

.k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--tone);
  aspect-ratio: var(--ratio);
  width: min(100%, calc(84vh * var(--ratio)));
}
.k-lqip, .k-full { width: 100%; height: 100%; object-fit: cover; display: block; }
.k-full { position: absolute; inset: 0; opacity: 0; transition: opacity 400ms linear; }
.k-fig.is-loaded .k-full { opacity: 1; }

.cap { margin-top: 14px; font-size: var(--t-cap); line-height: 1.6; color: var(--muted); }
.cap .t { color: var(--title); text-transform: uppercase; letter-spacing: .02em; }
.cap .avail { margin-top: 11px; color: var(--soft); }

/* ── ana sayfa ───────────────────────────────────────────────────────────── */

#home { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: start; }
@media (min-width: 1000px) {
  #home { grid-template-columns: minmax(0, 1fr) 250px; }
}
#home .lead { padding-top: 8vh; }
#home .lead .k-fig { width: min(100%, calc(66vh * var(--ratio))); }
#home .side { font-size: var(--t-cap); line-height: 1.6; color: var(--muted); padding-top: 8vh; }
#home .side .blk { margin-bottom: 22px; }
#home .side .blk b { font-weight: 400; color: var(--ink); }
#home .side .lbl {
  font-size: var(--t-micro); color: var(--soft); margin-bottom: 6px;
}
@media (min-width: 1000px) {
  #home .side { text-align: right; }
  #home .lead .cap { text-align: right; }
}

/* ── metin sayfaları ─────────────────────────────────────────────────────── */

.page { max-width: 34em; }          /* ~66 karakter; öncesi 620px/13px ≈ 95'ti */
.page h1 {
  font-size: var(--t-h1); font-weight: 400; line-height: 1.25;
  color: var(--ink); margin-bottom: 26px;
}
.page h2 {
  font-size: var(--t-h2); font-weight: 400; color: var(--ink);
  margin: 42px 0 16px;
}
.page h2:first-of-type { margin-top: 0; }
.page p { margin-bottom: 15px; }
.page p:last-child { margin-bottom: 0; }
.page .formula { font-size: var(--t-h2); line-height: 1.5; margin-bottom: 26px; }

.rows { margin-bottom: 8px; }
.row {
  display: grid; grid-template-columns: 56px 1fr; gap: 16px;
  font-size: var(--t-cap); line-height: 1.6; color: var(--muted);
  padding-bottom: 12px;
}
.row dt { color: var(--soft); font-variant-numeric: tabular-nums; }
.row b { font-weight: 400; color: var(--ink); }
.row span { display: block; }

.plainlist li { font-size: var(--t-cap); line-height: 1.7; color: var(--muted); }

.note {
  margin-top: 48px; font-size: var(--t-micro); line-height: 1.65; color: var(--soft);
  max-width: 40em; border-top: 1px solid var(--line); padding-top: 16px;
}

/* ── seri başlığı ────────────────────────────────────────────────────────── */

.lede { max-width: 34em; margin-bottom: 40px; }
.lede h1 { font-size: var(--t-h1); font-weight: 400; margin-bottom: 10px; }
.lede .yr { font-size: var(--t-micro); color: var(--soft); margin-bottom: 12px; }
.lede p { font-size: var(--t-cap); line-height: 1.65; color: var(--muted); }

/* ── mobil: sol sütun kaybolur, sağ üstte hamburger ──────────────────────── */

@media (max-width: 760px) {
  #nav {
    position: sticky; top: 0; z-index: 10;
    width: auto; height: auto; bottom: auto;
    padding: 18px 20px; background: var(--bg);
    display: flex; flex-wrap: wrap;
    align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  #nav .name { font-size: 20px; margin-bottom: 0; }

  #burger {
    display: block; flex: none;
    width: 44px; height: 44px; margin: -10px -10px 0 0;
    background: none; border: 0; padding: 10px; cursor: pointer;
  }
  #burger i {
    display: block; height: 2px; background: var(--ink);
    margin: 5px 0; transition: transform 220ms ease, opacity 180ms ease;
  }
  #burger[aria-expanded="true"] i:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  #burger[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
  #burger[aria-expanded="true"] i:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* `#nav ul` YAZMA — özgüllüğü (1,0,1) olur ve aşağıdaki (1,0,0) kuralı ezer,
     menü kapalıyken de açık kalır. Bu hata bir kez yapıldı. */
  #navlist { display: none; flex-basis: 100%; width: 100%;
             padding: 4px 0 14px; border-bottom: 1px solid var(--line); }
  #navlist.is-open { display: block; }
  #nav li { margin-bottom: 0; }
  #nav a { font-size: 16px; display: flex; align-items: center; min-height: 46px; }
  #lang { margin-top: 14px; }
  #lang button { font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; }

  #main { margin-left: 0; padding: 22px 20px 110px; }
  .cap { font-size: 13px; margin-top: 12px; }
  .work { margin-bottom: 68px; }
  #home .lead, #home .side { padding-top: 0; }
  #home .side { text-align: left; font-size: 13px; }
  #home .lead .cap { text-align: left; }
  #home .lead .k-fig { width: 100%; }
  .page, .lede { max-width: none; }
}

/* Dokunmatikte hedefler parmak boyunda. 760 px kuralından SONRA gelmemeli,
   yoksa oradaki 46 px'i eziyor — bu yüzden yalnızca menü dışını hedefler. */
@media (pointer: coarse) {
  .page a, .cap a, .note a { display: inline-block; padding-block: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>

"slug":"issiz-ciftlik","title":"Issız Çiftlik","series":"topografya","note":"Boş bir ev, boş bir arazi. Yine de biri var gibi.","status":"ayrildi","statusLabel":"Ayrıldı","year":2022,"medium":"Tuval üzerine yağlı boya","size":"88 × 132 cm","sizeIn":"34⅝ × 52 in","cw":132,"ch":88,"area":11616,"ratio":1.504,"px":[1686,1121],"portrait":false,"tone":"#3e482d","lqip":"data:image/webp;base64,UklGRk4AAABXRUJQVlA4IEIAAABwAwCdASoUAA0APu1kqU2ppaOiMAgBMB2JQBdgA3P5nqcZG5wA/ukdqhMoOZRPdoEL61SGKZbdjc2dCaii5wSeAAA=","src":"assets/69844.webp","credit":"George Inness, “The Lonely Farm, Nantucket”, 1892 · Art Institute of Chicago, kamu malı"}],"notice":"Bu bir tasarım prototipidir. Sanatçı kimliği ve metinler kurgudur; görseller Art Institute of Chicago açık erişim arşivinden alınmış kamu malı George Inness tablolarıdır. Yayına geçmeden önce tümü gerçek eserlerle değiştirilecektir.","i18n":{"tr":{"ui":{"lang_name":"Türkçe","nav_gallery":"Galeri","nav_about_grp":"Sanatçı","gal_exit":"Galeriden çık","gal_top":"Başa dön","gal_close":"Kapat","gal_exit_k":"Çık","gal_top_k":"Başa","gal_prev":"Önceki eser","gal_next":"Sonraki eser","gal_works":"Eserler","gal_hint":"Kaydırarak duvar boyunca ilerleyin · tabloya tıklayın","gal_hint_touch":"Sağa sola kaydırın · tabloya dokunun","gal_label":"Sergi duvarı","gal_title":"Galeriye gir","gal_sub":"Eserler bir Fransız salonunun duvarında, gerçek santimetre ölçeğinde asılı. Duvar boyunca ilerleyin; bir tabloya tıklayınca tam ekran açılır.","gal_soon":"Bu bölüm yapım aşamasında.","nav_recent":"Son Resimler","nav_studio":"Atölye Notu","nav_bio":"Biyografi","nav_exh":"Sergiler","nav_coll":"Koleksiyonlar","nav_pub":"Yayınlar","nav_press":"Basın","nav_contact":"İletişim","menu":"Menü","skip":"İçeriğe geç","site_sub":"Resim","recent_lede":"{n} eser, {s} seri. Yeniden eskiye.","exh_solo":"Kişisel Sergiler","exh_group":"Karma Sergiler","coll_record":"Kayıt","coll_sentence":"{n} eserin {h} tanesi koleksiyonlarda. Kalanlar atölyeden temin edilebilir.","bio_born":"{y}’de {p}’de doğdu.","bio_lives":"{c}’da yaşıyor ve çalışıyor.","home_now":"Sürüyor","home_next":"Sırada","contact_body":"Eser talepleri, atölye ziyareti ve sergi önerileri için yazın. Atölye ziyaretleri randevuyla.","avail_studio":"Atölyeden temin edilebilir, İstanbul","avail_private":"Özel koleksiyonda","avail_gone":"Ayrıldı","medium":"Tuval üzerine yağlı boya","lbl_year":"Yıl","lbl_medium":"Teknik","lbl_size":"Ölçü","noscript":"Eserleri görüntülemek için JavaScript gerekiyor.","meta_desc":"Cemal Sağlam, İstanbul’da çalışan ressam. Tuval üzerine yağlı boya; alacakaranlık, hava ve manzara üzerine seriler."},"bio":["Cemal Sağlam 1987’de İzmir’de doğdu. Mimar Sinan Güzel Sanatlar Üniversitesi Resim Bölümü’nü bitirdi, ardından Viyana’da iki yıl klasik boya teknikleri üzerine çalıştı.","Yağlı boyayı yavaşlığı için seçtiğini söylüyor. Bir tuval üzerinde aylarca çalışıyor, katmanları kurumaya bırakıyor, üzerine dönüyor. İşin büyük kısmı beklemekle geçiyor.","2016’dan bu yana İstanbul Bomonti’deki atölyesinde üretiyor. Çalışmaları Türkiye, Avusturya ve Hollanda’da özel koleksiyonlarda yer alıyor."],"statement":["Bir tuvale başlarken neye benzeyeceğini bilmiyorum. Yalnızca hangi ışığı aradığımı biliyorum: günün bittiği, henüz gece olmadığı o yarım saat. Onu bulana kadar üstünü örtüyorum.","Katmanlar kurudukça renk değişiyor. Bu yüzden acele edilemiyor. Bir resmin üzerinde ortalama dört ay çalışıyorum ve bu sürenin belki üçte biri fiilen boya sürmekle geçiyor. Kalanı bakmak ve beklemek.","Manzara resmi yaptığımı düşünmüyorum. Manzara bahane; asıl mesele havanın ağırlığı. Bir fırtınanın rengi vardır, yağmurdan sonranın başka bir rengi. Onları tarif etmeye çalışıyorum."],"collections":["Ardıç Sanat Koleksiyonu, İstanbul","Batı Kanat Çağdaş Sanat Koleksiyonu, İstanbul","Liman Kültür Merkezi, İzmir","Atelier Nordbahn Koleksiyonu, Viyana","Van Doorn Koleksiyonu, Rotterdam","Özel koleksiyonlar · Türkiye, Avusturya, Hollanda"],"series":{"alacakaranlik":{"title":"Alacakaranlık","blurb":"Günün bittiği, gecenin başlamadığı o kısa aralığın resimleri. Renk burada bir şeyi tarif etmiyor; bir şeyin kayboluşunu tutuyor."},"hava":{"title":"Hava","blurb":"Fırtına, yağmur, basınç. Manzaradan çok atmosferin kendisi. Tuvale önce havayı koyuyorum, yeri sonra."},"topografya":{"title":"Sessiz Topografya","blurb":"İnsansız araziler. İçinde kimsenin olmadığı ama birinin geçtiği belli olan yerler."},"sabah":{"title":"Sabah","blurb":"Gümüş ışık serisi. Sabahın ilk yarım saati, henüz renk yerine oturmadan."}},"works":{"64772":{"gloss":"","note":"Seriye adını veren resim."},"64736":{"gloss":"","note":"Sonbaharı kırmızıyla anlatmamaya çalıştığım bir deneme."},"68792":{"gloss":"","note":"Denizi bir kez boyadım. Karadan zor çıktı."},"64724":{"gloss":"","note":"Suyun üstündeki tek hareket. Onu en son koydum."},"68784":{"gloss":"","note":"Yeşili yeşille değil, sarıyla açtım."},"64764":{"gloss":"","note":"Bulut kalın ama ışık yine de geçiyor. Zor olan o."},"64732":{"gloss":"","note":"Bir saat içinde bitti. Nadiren öyle olur."},"64748":{"gloss":"","note":"Uzaktaki ışık yakındakinden daha sıcak olmalı."},"65353":{"gloss":"","note":"Üstünde iki kış çalıştım. İkisi de aralıkta."},"68388":{"gloss":"","note":"Sırtın arkasında ne olduğunu bilmeden çalıştım."},"69844":{"gloss":"","note":"Boş bir ev, boş bir arazi. Yine de biri var gibi."}},"cv":[["2024","Alacakaranlık","Kişisel sergi · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Kişisel sergi · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Karma sergi · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Karma sergi · Liman Kültür Merkezi, İzmir"],["2021","Sessiz Topografya","Kişisel sergi · Ardıç Sanat, İstanbul"],["2020","Katman","Karma sergi · Batı Kanat, İstanbul"],["2019","Slow Paint","Karma sergi · Atelier Nordbahn, Viyana"],["2018","İlk Katman","Kişisel sergi · Payas Galeri, İzmir"]],"publications":[["2024","Alacakaranlık","Sergi kataloğu, 96 sayfa. Metin: Nihal Erkut. Ardıç Sanat."],["2023","Hava Raporu","Sergi kataloğu, 64 sayfa. Payas Galeri."],["2022","Yavaş Boya","Söyleşi · Sanat Dünyamız, sayı 189, s. 44–51."],["2021","Sessiz Topografya","Sergi kataloğu, 72 sayfa. Metin: Kaan Bilen. Ardıç Sanat."],["2019","Katmanın Sabrı","Deneme · Kunstraum Yıllığı, Viyana. Almanca ve İngilizce."]],"press":[["2024","“Işığın çekildiği yerde durmak”","Ayşe Tunca · Cumhuriyet Kitap, Kasım 2024"],["2024","“Bir tuval kaç kış bekler?”","Deniz Aksoy · Argonotlar, Ekim 2024"],["2023","“Manzara değil, basınç”","Selim Arer · Sanat Dünyamız, Mart 2023"],["2021","“Sessiz Topografya üzerine”","Kaan Bilen · e-skop, Aralık 2021"]],"notice":"Bu bir tasarım prototipidir. Sanatçı kimliği ve metinler kurgudur; görseller Art Institute of Chicago açık erişim arşivinden alınmış kamu malı George Inness tablolarıdır. Yayına geçmeden önce tümü gerçek eserlerle değiştirilecektir."},"en":{"ui":{"lang_name":"English","nav_gallery":"Gallery","nav_about_grp":"The artist","gal_exit":"Leave the gallery","gal_top":"Back to start","gal_close":"Close","gal_exit_k":"Exit","gal_top_k":"Start","gal_prev":"Previous work","gal_next":"Next work","gal_works":"Works","gal_hint":"Scroll to move along the wall · click a painting","gal_hint_touch":"Swipe left or right · tap a painting","gal_label":"The exhibition wall","gal_title":"Enter the gallery","gal_sub":"The works hang on the wall of a French salon at true centimetre scale. Move along the wall; click a painting to open it full screen.","gal_soon":"This section is under construction.","nav_recent":"Recent Paintings","nav_studio":"Studio Note","nav_bio":"Biography","nav_exh":"Exhibitions","nav_coll":"Collections","nav_pub":"Publications","nav_press":"Press","nav_contact":"Contact","menu":"Menu","skip":"Skip to content","site_sub":"Painting","recent_lede":"{n} works, {s} series. Newest first.","exh_solo":"Solo Exhibitions","exh_group":"Group Exhibitions","coll_record":"Record","coll_sentence":"{h} of {n} works are held in collections. The remainder are available from the studio.","bio_born":"Born in {p} in {y}.","bio_lives":"Lives and works in {c}.","home_now":"Current","home_next":"Upcoming","contact_body":"For enquiries about available work, studio visits and exhibition proposals, please write. Studio visits by appointment.","avail_studio":"Available from the studio, Istanbul","avail_private":"Private collection","avail_gone":"No longer available","medium":"Oil on canvas","lbl_year":"Year","lbl_medium":"Medium","lbl_size":"Dimensions","noscript":"JavaScript is required to view the works.","meta_desc":"Cemal Sağlam is a painter working in Istanbul. Oil on canvas; series on twilight, weather and landscape."},"bio":["Cemal Sağlam was born in İzmir in 1987. He completed the painting department at Mimar Sinan Fine Arts University, then spent two years in Vienna studying classical oil technique.","He says he chose oil for its slowness. He works on a single canvas for months, leaves the layers to dry and returns to them. Most of the work is waiting.","Since 2016 he has painted in his studio in Bomonti, Istanbul. His work is held in private collections in Turkey, Austria and the Netherlands."],"statement":["When I begin a canvas I do not know what it will look like. I only know which light I am after: the half hour when the day has ended and night has not yet come. Until I find it, I keep covering the surface over.","Colour shifts as the layers dry, so it cannot be hurried. I spend about four months on a painting, and perhaps a third of that is actually spent applying paint. The rest is looking and waiting.","I do not think I paint landscapes. The landscape is a pretext; what matters is the weight of the air. A storm has a colour, and the aftermath of rain has another. I am trying to describe those."],"collections":["Ardıç Sanat Collection, Istanbul","Batı Kanat Contemporary Art Collection, Istanbul","Liman Cultural Centre, İzmir","Atelier Nordbahn Collection, Vienna","Van Doorn Collection, Rotterdam","Private collections · Turkey, Austria, the Netherlands"],"series":{"alacakaranlik":{"title":"Twilight","blurb":"Paintings of the short interval when the day has ended and night has not begun. Colour here does not describe something; it holds something disappearing."},"hava":{"title":"Weather","blurb":"Storm, rain, pressure. The atmosphere itself rather than the landscape. I put the air on the canvas first, the ground after."},"topografya":{"title":"Quiet Topography","blurb":"Land without people. Places where no one is present but someone clearly passed."},"sabah":{"title":"Morning","blurb":"The silver light series. The first half hour of morning, before colour settles."}},"works":{"64772":{"gloss":"Twilight","note":"The painting that gave the series its name."},"64736":{"gloss":"Autumn Wood","note":"An attempt at not explaining autumn with red."},"68792":{"gloss":"The Shore","note":"I painted the sea once. It came harder than land."},"64724":{"gloss":"The Heron","note":"The only movement on the water. I put it in last."},"68784":{"gloss":"Summer Morning","note":"I opened the green with yellow, not with more green."},"64764":{"gloss":"Morning in the Field","note":"The cloud is thick, yet the light still comes through. That is the hard part."},"64732":{"gloss":"Bearing Down","note":"Finished within an hour. That rarely happens."},"64748":{"gloss":"Sunlit Valley","note":"Distant light must be warmer than near light."},"65353":{"gloss":"Storm","note":"I worked on it through two winters. Both times in December."},"68388":{"gloss":"The Ridge","note":"I worked without knowing what lay behind the ridge."},"69844":{"gloss":"The Lonely Farm","note":"An empty house, an empty field. And yet someone seems to be there."}},"cv":[["2024","Alacakaranlık","Solo exhibition · Ardıç Sanat, İstanbul"],["2023","Hava Raporu","Solo exhibition · Payas Galeri, İstanbul"],["2023","Uzun Pozlama","Group exhibition · Kule Sanat Alanı, Ankara"],["2022","Yeni Manzara","Group exhibition · Liman Kültür Merkezi, İzmir"],["2021","Sessiz To /* ── KIT ───────────────────────────────────────────────────────────────────
   Üç prototipin de paylaştığı davranış katmanı. Tasarımdan bağımsız:
   burada hiçbir görsel karar yok, sadece mekanik. Görünüm tamamen CSS'te.
   ────────────────────────────────────────────────────────────────────────── */

const K = (() => {

  /* ── tercihler ─────────────────────────────────────────────────────────── */

  const reduced = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* yok say */ } },
  };

  /* ── tema ──────────────────────────────────────────────────────────────────
     Üç durum: 'light' | 'dark' | null (sistem). Kök öğeye data-theme basar.   */

  const Theme = {
    KEY: 'da-theme',
    init() {
      const saved = store.get(this.KEY);
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      } else {
        /* Varsayılan AÇIK: sistemi karanlıkta olan ziyaretçi de krem zemin
           görsün. Sistem tercihine uymak yerine bilinçli bir karar —
           düğme yine duruyor, isteyen koyuya geçer. */
        document.documentElement.dataset.theme = 'light';
      }
      return this;
    },
    current() {
      return document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    },
    toggle() {
      const next = this.current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set(this.KEY, next);
      document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      return next;
    },
  };

  /* ── ilerlemeli görsel ─────────────────────────────────────────────────────
     LQIP (20px bulanık) anında görünür, tam çözünürlük görünür alana
     girince yüklenir ve decode() bittikten SONRA geçiş yapar — böylece
     yarım boyanmış kare hiç görünmez.                                        */

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          load(e.target);
        }
      }, { rootMargin: '600px 0px' })
    : null;

  function load(fig) {
    const src = fig.dataset.src;
    if (!src || fig.dataset.loaded) return;
    fig.dataset.loaded = '1';
    const img = new Image();
    img.decoding = 'async';
    img.alt = fig.dataset.alt || '';
    img.src = src;
    const show = () => {
      img.className = 'k-full';
      fig.appendChild(img);
      requestAnimationFrame(() => fig.classList.add('is-loaded'));
    };
    (img.decode ? img.decode().then(show).catch(show) : (img.onload = show));
  }

  /**
   * Bir eser için <figure> üretir.
   * @param {object} w   SITE.works elemanı
   * @param {object} opt {eager:boolean, sizes:string, cls:string}
   */
  function figure(w, opt = {}) {
    const fig = document.createElement('figure');
    fig.className = 'k-fig ' + (opt.cls || '');
    fig.style.setProperty('--ratio', w.ratio);
    fig.style.setProperty('--tone', w.tone);
    fig.dataset.src = w.src;
    fig.dataset.alt = `${w.title}, ${w.year} — ${w.medium}, ${w.size}`;

    const lq = document.createElement('img');
    lq.className = 'k-lqip';
    lq.src = w.lqip;
    lq.alt = '';
    lq.setAttribute('aria-hidden', 'true');
    fig.appendChild(lq);

    if (opt.eager) load(fig);
    else if (io) io.observe(fig);
    else load(fig);

    return fig;
  }

  /* ── görünüme girince açığa çıkma ─────────────────────────────────────── */

  const revealIO = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          e.target.classList.add('is-in');
        }
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 })
    : null;

  function reveal(root = document) {
    const els = root.querySelectorAll('[data-reveal]:not(.is-in)');
    if (reduced() || !revealIO) {
      els.forEach(el => el.classList.add('is-in'));
      return;
    }
    els.forEach(el => revealIO.observe(el));
  }

  /* ── hash yönlendirici ─────────────────────────────────────────────────────
     #/                 ana sayfa
     #/seri/<key>       seri
     #/eser/<slug>      tek eser
     #/hakkinda #/iletisim                                                    */

  const Router = {
    routes: [],
    on(re, fn) { this.routes.push([re, fn]); return this; },
    parse() {
      const h = location.hash.replace(/^#/, '') || '/';
      for (const [re, fn] of this.routes) {
        const m = h.match(re);
        if (m) return { fn, args: m.slice(1), path: h };
      }
      return { fn: this.routes[0][1], args: [], path: '/' };
    },
    go(path, opts = {}) {
      if (opts.replace) location.replace('#' + path);
      else location.hash = path;
    },
    start() {
      const run = () => {
        const { fn, args, path } = this.parse();
        fn(...args);
        this.last = path;
      };
      addEventListener('hashchange', run);
      run();
      return this;
    },
  };

  /* ── odak tuzağı (katman/lightbox için) ────────────────────────────────── */

  const SELECTOR =
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function trap(node) {
    const prev = document.activeElement;
    const onKey = (e) => {
      if (e.key !== 'Tab') return;
      const f = [...node.querySelectorAll(SELECTOR)].filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => {
      node.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
    };
  }

  /* ── küçük yardımcılar ─────────────────────────────────────────────────── */

  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  const bySeries = (key) => SITE.works.filter(w => w.series === key);
  const seriesOf = (key) => SITE.series.find(s => s.key === key);
  const workBySlug = (slug) => SITE.works.find(w => w.slug === slug);
  const neighbours = (w) => {
    const list = SITE.works;
    const i = list.indexOf(w);
    return {
      prev: list[(i - 1 + list.length) % list.length],
      next: list[(i + 1) % list.length],
    };
  };

  return { reduced, store, Theme, figure, load, reveal, Router, trap, el,
           bySeries, seriesOf, workBySlug, neighbours };
})();

const LANGS = ['tr', 'en', 'fr'];
const LANG_KEY = 'cs-lang';

function initialLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch (e) { /* yok say */ }
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  return LANGS.includes(nav) ? nav : 'tr';
}

let LANG = initialLang();

/* L(): o dilin içerik paketi. t(): arayüz dizgesi, eksikse Türkçeye düşer. */
const L = () => SITE.i18n[LANG] || SITE.i18n.tr;
const t = (k) => (L().ui && L().ui[k]) || SITE.i18n.tr.ui[k] || k;
const fill = (s, vals) => s.replace(/\{(\w+)\}/g, (_, k) => vals[k]);

/* Türkçe büyük harf: JS'in toUpperCase()'i i → I veriyor, İ değil. */
const upTR = (s) => s.toLocaleUpperCase('tr-TR');

function applyLang() {
  document.documentElement.lang = LANG;
  const d = document.querySelector('meta[name="description"]');
  if (d) d.setAttribute('content', t('meta_desc'));
  document.querySelector('.skip').textContent = t('skip');
  burger.setAttribute('aria-label', t('menu'));
  buildNav();
  document.querySelectorAll('#lang button').forEach((b) => {
    b.setAttribute('aria-current', String(b.dataset.lang === LANG));
  });
}

function setLang(next) {
  if (!LANGS.includes(next) || next === LANG) return;
  LANG = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (e) { /* yok say */ }
  applyLang();
  K.Router.parse().fn(...K.Router.parse().args);   /* aynı sayfayı yeniden çiz */
}

{
  const parts = SITE.artist.name.split(' ');
  document.getElementById('navname').innerHTML =
    parts[0] + ' <b>' + upTR(parts.slice(1).join(' ')) + '</b>';
}

/* ── menü ────────────────────────────────────────────────────────────────── */

const navlistEl = document.getElementById('navlist');

function navItems() {
  return [
    { href: '/son', label: t('nav_recent') },
    ...SITE.series.map(s => ({ href: '/seri/' + s.key, label: L().series[s.key].title })),
    { gap: true },
    { href: '/atolye',     label: t('nav_studio') },
    { href: '/biyografi',  label: t('nav_bio') },
    { href: '/sergiler',   label: t('nav_exh') },
    { href: '/koleksiyon', label: t('nav_coll') },
    { href: '/yayinlar',   label: t('nav_pub') },
    { href: '/basin',      label: t('nav_press') },
    { gap: true },
    { href: '/iletisim',   label: t('nav_contact') },
  ];
}

function buildNav() {
  navlistEl.innerHTML = '';
  navItems().forEach((n) => {
    const li = K.el('li');
    if (n.gap) { li.className = 'gap'; navlistEl.appendChild(li); return; }
    const a = K.el('a', null, n.label);
    a.href = '#' + n.href;
    a.dataset.route = n.href;
    li.appendChild(a);
    navlistEl.appendChild(li);
  });

  const li = K.el('li');
  const box = K.el('div');
  box.id = 'lang';
  LANGS.forEach((code, i) => {
    if (i) box.appendChild(K.el('span', 'sep', '·'));
    const b = K.el('button', null, code.toUpperCase());
    b.type = 'button';
    b.dataset.lang = code;
    b.setAttribute('aria-current', String(code === LANG));
    b.setAttribute('aria-label', SITE.i18n[code].ui.lang_name);
    b.addEventListener('click', () => setLang(code));
    box.appendChild(b);
  });
  li.appendChild(box);
  navlistEl.appendChild(li);
}

function markNav(path) {
  document.querySelectorAll('#navlist a').forEach((a) => {
    const on = a.dataset.route === path;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

const burger = document.getElementById('burger');

function closeNav() {
  navlistEl.classList.remove('is-open');
  burger.setAttribute('aria-expanded', 'false');
}
burger.addEventListener('click', () => {
  const open = !navlistEl.classList.contains('is-open');
  navlistEl.classList.toggle('is-open', open);
  burger.setAttribute('aria-expanded', String(open));
  if (open) navlistEl.querySelector('a').focus({ preventScroll: true });
});
navlistEl.addEventListener('click', (e) => { if (e.target.closest('a')) closeNav(); });
document.getElementById('navname').addEventListener('click', closeNav);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

/* ── eser bloğu ──────────────────────────────────────────────────────────── */

function availLine(status) {
  return status === 'satilik' ? t('avail_studio')
       : status === 'koleksiyonda' ? t('avail_private')
       : t('avail_gone');
}

function workBlock(w, opts = {}) {
  const d = K.el('figure', 'work');
  const fig = K.figure(w, opts);

  /* LQIP güvenlik ağı: decode() takılırsa tablonun yerinde kalıcı olarak
     bulanık bir dikdörtgen kalıyordu. Yağlı boyada "yüklenmedi" ile
     "eser bu" ayırt edilemez — 1200 ms sonra koşulsuz göster. */
  setTimeout(() => fig.classList.add('is-loaded'), 1200);
  d.appendChild(fig);

  /* Eser ADI çevrilmez: bir isimdir. Çevirisi altına, küçük ve italik düşer. */
  const gloss = (L().works[w.id] || {}).gloss || '';
  const note  = (L().works[w.id] || {}).note || w.note;

  const cap = K.el('figcaption', 'cap');
  cap.innerHTML =
    '<div class="t">' + w.title + '</div>' +
    (gloss ? '<div class="gloss">' + gloss + '</div>' : '') +
    '<div>' + w.year + '</div>' +
    '<div>' + t('medium') + '</div>' +
    '<div>' + w.size + ' | ' + w.sizeIn + '</div>';

  const av = K.el('div', 'avail');
  av.textContent = availLine(w.status);
  cap.appendChild(av);

  d.appendChild(cap);
  return d;
}

function setTitle(sec) {
  document.title = sec ? sec + ' — ' + SITE.artist.name
                       : SITE.artist.name + ' — ' + t('site_sub');
}

function listView(works, lede, title) {
  main.innerHTML = '';
  if (lede) main.appendChild(lede);
  works.forEach((w, i) => main.appendChild(workBlock(w, { eager: i < 2 })));
  setTitle(title);
  scrollTo(0, 0);
}

function pageShell(h1) {
  const p = K.el('div', 'page');
  p.appendChild(K.el('h1', null, h1));
  return p;
}

function rowList(items) {
  const dl = K.el('dl', 'rows');
  items.forEach(([a, b, c]) => {
    const r = K.el('div', 'row');
    r.appendChild(K.el('dt', null, a));
    r.appendChild(K.el('dd', null, c ? '<b>' + b + '</b><span>' + c + '</span>' : b));
    dl.appendChild(r);
  });
  return dl;
}

/* mekân adı: "Kişisel sergi · Ardıç Sanat" -> "Ardıç Sanat". Dilden bağımsız. */
const venueOf = (s) => s.split(' · ').slice(1).join(' · ') || s;

/* ── görünümler ──────────────────────────────────────────────────────────── */

function viewHome() {
  markNav(null);
  main.innerHTML = '';
  const wrap = K.el('div');
  wrap.id = 'home';

  const w = SITE.works.find(x => x.slug === 'dag-sirti') || SITE.works[0];
  const lead = K.el('div', 'lead');
  const h1 = K.el('h1', null, SITE.artist.name + ' — ' + t('site_sub'));
  h1.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)';
  lead.appendChild(h1);
  lead.appendChild(workBlock(w, { eager: true }));
  wrap.appendChild(lead);

  const cv = L().cv;
  const side = K.el('div', 'side');
  side.innerHTML =
    '<div class="blk"><div class="lbl">' + t('home_now') + '</div>' +
    '<b>' + cv[0][1] + '</b><br>' + venueOf(cv[0][2]) + '<br>2024</div>' +
    '<div class="blk"><div class="lbl">' + t('home_next') + '</div>' +
    '<b>' + cv[1][1] + '</b><br>' + venueOf(cv[1][2]) + '<br>2025</div>';
  wrap.appendChild(side);

  main.appendChild(wrap);
  setTitle(null);
  scrollTo(0, 0);
}

function viewSon() {
  markNav('/son');
  const lede = K.el('div', 'lede');
  lede.appendChild(K.el('h1', null, t('nav_recent')));
  lede.appendChild(K.el('p', null,
    fill(t('recent_lede'), { n: SITE.works.length, s: SITE.series.length })));
  listView([...SITE.works].sort((a, b) => b.year - a.year), lede, t('nav_recent'));
}

function viewSeri(key) {
  const base = K.seriesOf(key);
  if (!base) return viewSon();
  const s = L().series[key] || { title: base.title, blurb: base.blurb };
  markNav('/seri/' + key);
  const lede = K.el('div', 'lede');
  lede.appendChild(K.el('h1', null, s.title));
  lede.appendChild(K.el('div', 'yr', base.years));
  lede.appendChild(K.el('p', null, s.blurb));
  listView(K.bySeries(key), lede, s.title);
}

function viewAtolye() {
  markNav('/atolye');
  main.innerHTML = '';
  const p = pageShell(t('nav_studio'));
  L().statement.forEach(x => p.appendChild(K.el('p', null, x)));
  p.appendChild(K.el('p', null,
    '<span style="color:var(--soft)">' + SITE.artist.name + ', ' + SITE.artist.studio + '</span>'));
  main.appendChild(p);
  setTitle(t('nav_studio'));
  scrollTo(0, 0);
}

function viewBio() {
  markNav('/biyografi');
  main.innerHTML = '';
  const p = pageShell(t('nav_bio'));
  p.appendChild(K.el('div', 'formula',
    fill(t('bio_born'), { y: SITE.artist.born, p: SITE.artist.birthplace }) + '<br>' +
    fill(t('bio_lives'), { c: SITE.artist.based })));
  L().bio.forEach(x => p.appendChild(K.el('p', null, x)));
  main.appendChild(p);
  setTitle(t('nav_bio'));
  scrollTo(0, 0);
}

function viewSergiler() {
  markNav('/sergiler');
  main.innerHTML = '';
  const p = pageShell(t('nav_exh'));
  /* Tür ayrımı Türkçe kaynaktan yapılır, gösterim seçili dilden. */
  const solo = [], group = [];
  SITE.cv.forEach((row, i) => {
    (row[2].startsWith('Kişisel') ? solo : group).push(L().cv[i]);
  });
  p.appendChild(K.el('h2', null, t('exh_solo')));
  p.appendChild(rowList(solo.map(r => [r[0], r[1], venueOf(r[2])])));
  p.appendChild(K.el('h2', null, t('exh_group')));
  p.appendChild(rowList(group.map(r => [r[0], r[1], venueOf(r[2])])));
  main.appendChild(p);
  setTitle(t('nav_exh'));
  scrollTo(0, 0);
}

function viewKoleksiyon() {
  markNav('/koleksiyon');
  main.innerHTML = '';
  const p = pageShell(t('nav_coll'));
  const ul = K.el('ul', 'plainlist');
  L().collections.forEach(c => ul.appendChild(K.el('li', null, c)));
  p.appendChild(ul);

  const held = SITE.works.filter(w => w.status !== 'satilik');
  p.appendChild(K.el('h2', null, t('coll_record')));
  p.appendChild(K.el('p', null,
    '<span style="font-size:var(--t-cap);color:var(--muted)">' +
    fill(t('coll_sentence'), { n: SITE.works.length, h: held.length }) + '</span>'));
  p.appendChild(rowList(held.map(w =>
    [String(w.year), w.title, w.size + ' · ' + availLine(w.status)])));
  main.appendChild(p);
  setTitle(t('nav_coll'));
  scrollTo(0, 0);
}

function viewYayinlar() {
  markNav('/yayinlar');
  main.innerHTML = '';
  const p = pageShell(t('nav_pub'));
  p.appendChild(rowList(L().publications));
  main.appendChild(p);
  setTitle(t('nav_pub'));
  scrollTo(0, 0);
}

function viewBasin() {
  markNav('/basin');
  main.innerHTML = '';
  const p = pageShell(t('nav_press'));
  p.appendChild(rowList(L().press));
  main.appendChild(p);
  setTitle(t('nav_press'));
  scrollTo(0, 0);
}

function viewIletisim() {
  markNav('/iletisim');
  main.innerHTML = '';
  const p = pageShell(t('nav_contact'));
  p.appendChild(K.el('p', null,
    '<a href="mailto:' + SITE.artist.email + '" style="color:var(--link)">' +
    SITE.artist.email + '</a>'));
  p.appendChild(K.el('p', null,
    '<span style="color:var(--muted)">' + SITE.artist.studio + '</span>'));
  p.appendChild(K.el('p', null, t('contact_body')));
  p.appendChild(K.el('div', 'note', L().notice + ' ' + SITE.works[0].credit));
  main.appendChild(p);
  setTitle(t('nav_contact'));
  scrollTo(0, 0);
}

/* ── yönlendirme ─────────────────────────────────────────────────────────── */

applyLang();

K.Router
  .on(/^\/$/,             viewHome)
  .on(/^\/son$/,          viewSon)
  .on(/^\/seri\/(.+)$/,   viewSeri)
  .on(/^\/atolye$/,       viewAtolye)
  .on(/^\/biyografi$/,    viewBio)
  .on(/^\/sergiler$/,     viewSergiler)
  .on(/^\/koleksiyon$/,   viewKoleksiyon)
  .on(/^\/yayinlar$/,     viewYayinlar)
  .on(/^\/basin$/,        viewBasin)
  .on(/^\/iletisim$/,     viewIletisim)
  .start();
</script>

</body>
</html>
