@property --k {          /* kayıtsız özel değişken geçişlenemez */
  syntax: '<length>';

  initial-value: 0px;

/* ═══════════════════════════════════════════════════════════════════════════
   MEKÂN — ressamın kendi boyası zemin, içerik onun üstünde beyaz panel.
   Menü düğmesi düz bir ikon değil: üç çubuğun her biri gerçek bir tablodan
   kesilmiş boya şeridi. Menü satırlarının rengi o sayfanın zemininden alınır.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --shell-pad: clamp(12px, 3vw, 28px);
  --ink:    #111111;
  --muted:  #4a4a4a;
  --soft:   #6a6a6a;
  --line:   #dcdcdc;
  /* Eskiden #1B3FCC idi — tarayıcının varsayılan mavisi. Bu kadar ölçülü
     bir palette rengi ayarlanmamış tek unsurdu ve sırıtıyordu. Bronz,
     eser adının siena tonuyla (--title) karışmayacak kadar uzak. */
  --link:   #5f5326;
  --title:  #7a3418;
  --panel:  #ffffff;

  --pad:    clamp(24px, 4vw, 56px);
  --sans:   "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease:   cubic-bezier(.19, 1, .22, 1);

  --t-h1:    clamp(22px, 1.1rem + 1.1vw, 30px);
  --t-h2:    17px;
  --t-body:  15px;
  --t-cap:   12px;
  --t-micro: 11px;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: #17161a; }

body {
  overscroll-behavior-y: none;   /* lastik-bant sabit zemini oynatmasın */
  margin: 0;
  color: var(--ink);
  font: 400 var(--t-body)/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  min-height: 100vh;
}

h1, h2, h3, p, figure, ul, li, dl, dd, dt { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; max-width: 100%; }
a, a:visited { color: var(--ink); text-decoration: none; }
a:hover { color: var(--link); }
.mail { border-bottom: 1px solid var(--line); padding-bottom: 1px; }
.mail:hover { border-color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }

/* ── zemin: ressamın boyası, sabit, sayfa değişince yumuşak geçiş ────────── */

/* Zemin tablosu sayfayla BİRLİKTE GELMEMELİ.
   inset:0 tek başına yetmiyordu: mobilde adres çubuğu açılıp kapandıkça
   100vh değişiyor, background-size:cover yeniden hesaplanıyor ve görsel
   her kaydırmada yeniden çözülüyordu (gereksiz yükleme + takılma).
   Çözüm: yüksekliği kaydırmayla değişmeyen 100lvh'ye sabitlemek, katmanı
   kendi compositor katmanına almak ve lastik-bant esnemesini kapatmak. */
.bg {
  position: fixed; top: 0; left: 0; z-index: 0;
  width: 100%;
  height: 100vh;
  height: 100lvh;                 /* adres çubuğu gizlenince değişmez */
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
  opacity: 0; transition: opacity 900ms var(--ease);
  pointer-events: none;
  transform: translateZ(0);       /* kendi katmanı: kaydırmada yeniden boyanmaz */
  will-change: opacity;
  backface-visibility: hidden;
}
.bg.on { opacity: 1; }
.bg::after {                      /* okunurluk için hafif koyultma */
  content: ""; position: absolute; inset: 0;
  background: rgba(20,18,22,.18);
}

/* ── eser-hamburger ──────────────────────────────────────────────────────── */

#menubtn {
  position: fixed; top: clamp(16px, 2.4vw, 30px); left: clamp(16px, 2.4vw, 30px);
  z-index: 40;
  width: 62px; height: 62px; border-radius: 50%;
  border: 0; padding: 13px 12px; cursor: pointer;
  background: rgba(255,255,255,.92);
  box-shadow: 0 2px 18px rgba(0,0,0,.28);
  display: grid; align-content: center; gap: 6px;
  transition: background 300ms var(--ease), transform 500ms var(--ease);
}
#menubtn:hover { transform: scale(1.04); }
/* Üç çubuk: her biri gerçek bir tablodan kesilmiş boya şeridi. */
#menubtn i {
  display: block; height: 5px; border-radius: 1px;
  background-size: 420px auto;
  background-repeat: no-repeat;
  transition: transform 340ms var(--ease), opacity 220ms var(--ease);
}
#menubtn i:nth-child(1) { background-position: 12% 22%; }
#menubtn i:nth-child(2) { background-position: 52% 55%; }
#menubtn i:nth-child(3) { background-position: 30% 82%; }
#menubtn[aria-expanded="true"] { background: rgba(255,255,255,.98); }
#menubtn[aria-expanded="true"] i:nth-child(1) { transform: translateY(11px) rotate(45deg); }
#menubtn[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
#menubtn[aria-expanded="true"] i:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }

/* ── siyah menü paneli ───────────────────────────────────────────────────── */

/* == ANA MENU ==============================================================
   Menu artik elle yonetilen bir div degil, gercek bir popover: ust katman,
   Esc, disina tiklayinca kapanma ve odak yonetimi tarayicidan geliyor.
   Bunlari elle yazmistik (#scrim, K.trap, keydown dinleyicisi) - kalkti.

   HAREKETIN GEREKCESI: bir galeride once isiklar soner, sonra etiketler
   aydinlanir. Once zemin karartiliyor (::backdrop), sonra satirlar sirayla
   netlesip geliyor. Panel kati bir blok gibi kaymiyor.

   ILERLEMELI: @starting-style, allow-discrete, view-transition ve
   :popover-open desteklenmezse menu yine tam calisir - yalniz gecissiz
   belirir. Hicbir islev bu API'lere bagli degil. */
#menu {
  position: fixed; inset: 0 auto 0 0; margin: 0; padding: 0;
  width: min(780px, 94vw); max-width: 100%;
  border: 0; overflow: visible;
  background: linear-gradient(126deg, #101013 0%, #0a0a0c 62%, #08080a 100%);
  color: var(--panel);
  display: grid; grid-template-columns: minmax(250px, 330px) 1fr;
  box-shadow: 40px 0 90px -30px rgba(0,0,0,.8);

  opacity: 0; translate: -14px 0;
  transition: opacity 300ms var(--ease), translate 380ms var(--ease),
              overlay 380ms allow-discrete, display 380ms allow-discrete;
}
#menu:popover-open { opacity: 1; translate: none; }
@starting-style { #menu:popover-open { opacity: 0; translate: -14px 0; } }

#menu::backdrop {
  background: rgba(6,7,5,0);
  transition: background 420ms var(--ease),
              overlay 420ms allow-discrete, display 420ms allow-discrete;
}
#menu:popover-open::backdrop { background: rgba(6,7,5,.58); }
@starting-style { #menu:popover-open::backdrop { background: rgba(6,7,5,0); } }

#msol { padding: 104px clamp(18px, 2.2vw, 30px) 26px; overflow-y: auto; }
#menu ul { list-style: none; margin: 0; padding: 0; }
#menu li { margin-bottom: 5px; }

/* Satirlar sirayla netlesip geliyor: etiketlerin aydinlanmasi. */
#menu li, #menu .grouplbl, #lang {
  opacity: 0; translate: 0 9px; filter: blur(2px);
  transition: opacity 380ms var(--ease), translate 420ms var(--ease),
              filter 380ms var(--ease);
}
#menu:popover-open li, #menu:popover-open .grouplbl, #menu:popover-open #lang {
  opacity: 1; translate: none; filter: none;
  transition-delay: var(--d, 0ms);
}

#menu a {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  font: inherit; font-size: clamp(15px, .9rem + .26vw, 18px);
  padding: 11px 15px; line-height: 1.25;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.075);
  background: rgba(255,255,255,.035);
  cursor: pointer; text-decoration: none;
  transition: background 300ms var(--ease), border-color 300ms var(--ease),
              transform 300ms var(--ease), color 600ms ease-in-out;
}
@media (hover: hover) {
  #menu a:hover, #menu a:focus-visible {
    background: hsla(var(--h, 40), var(--s, 0%), 40%, .42) !important;
    border-color: hsla(var(--h, 40), var(--s, 0%), 70%, .62) !important;
    transform: translateX(5px);
  }
}
#menu a[aria-current="page"] {
  background: hsla(var(--h, 40), var(--s, 0%), 44%, .46) !important;
  border-color: hsla(var(--h, 40), var(--s, 0%), 74%, .7) !important;
}
#menu a.ozel {
  font-size: clamp(16px, .95rem + .33vw, 20px);
  color: #e8cf9a !important;
  border-color: rgba(201,168,106,.5);
  background: linear-gradient(90deg, rgba(201,168,106,.20), rgba(201,168,106,.05));
  padding-block: 13px; margin-bottom: 4px;
}
#menu a.ozel::after {
  content: "\2192"; margin-left: auto; opacity: .75;
  transition: transform 300ms var(--ease);
}
@media (hover: hover) {
  #menu a.ozel:hover { background: linear-gradient(90deg, rgba(201,168,106,.34), rgba(201,168,106,.10));
                       border-color: rgba(201,168,106,.85); }
  #menu a.ozel:hover::after { transform: translateX(4px); }
}
#menu a.cikis { color: #d9b9a0 !important; border-color: rgba(217,185,160,.4); }
#menu .sep { height: 18px; }
#menu .grouplbl {
  font-size: var(--t-micro); letter-spacing: .14em; text-transform: uppercase;
  color: #5d5d63; margin: 22px 0 8px;
}

/* -- karsilik sutunu ------------------------------------------------------
   Vitrin DEGIL: satirin turune gore karsiligini gosteriyor. Seri satirinda
   o serinin eseri, Sergiler'de surmekte olan sergi, Iletisim'de atolye
   satiri. Boylece 7 metin sayfasinda bos kalmiyor, hicbir yerde de dukkan
   vitrini gibi durmuyor. */
#mon {
  position: relative; overflow: hidden;
  padding: 104px clamp(22px, 2.6vw, 42px) 34px;
  display: flex; flex-direction: column; gap: 20px;
  border-left: 1px solid rgba(255,255,255,.07);
  background: radial-gradient(120% 90% at 30% 0%, rgba(255,244,222,.055), transparent 62%);
}
#mon-kutu { position: relative; flex: 1 1 auto; min-height: 0; display: grid; place-items: center; }
#mon-img {
  max-width: 100%; max-height: 100%; object-fit: contain; display: block;
  box-shadow: 0 2px 5px rgba(0,0,0,.5), 0 26px 60px -22px rgba(0,0,0,.8);
  transition: opacity 260ms var(--ease), scale 420ms var(--ease);
}
#mon-img[hidden] { display: none; }
#mon.degisiyor #mon-img { opacity: 0; scale: .985; }
#mon-yazi { flex: 1 1 auto; min-width: 0; transition: opacity 260ms var(--ease); }
#mon.degisiyor #mon-yazi { opacity: 0; }
#mon-ust {
  font-size: var(--t-micro); letter-spacing: .16em; text-transform: uppercase;
  color: #8d7c56; margin-bottom: 7px;
}
#mon-ad { font-size: clamp(19px, 1.1rem + .5vw, 26px); line-height: 1.2; color: #f2ede2; margin-bottom: 6px; }
/* Gorseli olmayan satirlarda (biyografi, basin, iletisim...) sutun bos
   kalmasin: yazi buyuyup alani kendisi tutuyor. */
#mon.yazi-only #mon-kutu { display: none; }
#mon.yazi-only { justify-content: center; }
#mon.yazi-only #mon-ad { font-size: clamp(22px, 1.2rem + .8vw, 32px); }
#mon.yazi-only #mon-alt { font-size: 15px; max-width: 34ch; }
#mon-alt { font-size: 13.5px; line-height: 1.6; color: rgba(242,237,226,.62); max-width: 40ch; }

#lang { display: flex; gap: 10px; align-items: baseline; margin-top: 30px; }
#lang button {
  font: inherit; font-size: var(--t-micro); letter-spacing: .06em;
  background: none; border: 0; padding: 8px 4px; cursor: pointer; color: #6f6f76;
}
#lang button[aria-current="true"] { color: #fff; }

/* -- TELEFON: perde degil, basparmakla ulasilan alt tabaka ----------------
   Ekrani kaplayan bir ortu yerine alttan gelen bir tabaka. Satirlar asagida
   topluyor, karsilik ustte ince bir serit oluyor. */
@media (max-width: 760px) {
  #menu {
    inset: auto 0 0 0; width: 100%;
    height: min(88dvh, 100%);
    grid-template-columns: 1fr; grid-template-rows: auto 1fr;
    border-radius: 16px 16px 0 0;
    translate: 0 22px;
    box-shadow: 0 -24px 60px -20px rgba(0,0,0,.8);
  }
  @starting-style { #menu:popover-open { translate: 0 22px; } }
  #menu::before {
    content: ""; position: absolute; top: 9px; left: 50%; translate: -50% 0;
    width: 42px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.22);
  }
  #mon {
    order: -1; border-left: 0; border-bottom: 1px solid rgba(255,255,255,.07);
    padding: 26px 68px 16px 20px;   /* sag: kapatma dugmesine pay */
    flex-direction: row; align-items: center; gap: 16px; min-height: 118px;
  }
  #mon-kutu { flex: 0 0 128px; height: 92px; }
  #mon-ad { font-size: 18px; }
  #mon-alt {
    font-size: 12.5px; max-width: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #mon-ad { overflow-wrap: anywhere; }
  #msol { padding: 14px 18px calc(22px + env(safe-area-inset-bottom)); }
  #menu a { padding: 13px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  #menu li, #menu .grouplbl, #lang { filter: none; translate: none; }
}

/* Menu ust katmanda oldugu icin disaridaki hamburger dugmesi tiklanamaz
   hale geliyor. Sevilen "eser -> X" jesti kaybolmasin diye ayni yerde,
   menunun kendi icinde bir kapatma dugmesi duruyor. */
#mkapat {
  position: absolute; z-index: 2;
  top: clamp(16px, 2.4vw, 30px); left: clamp(16px, 2.4vw, 30px);
  width: 58px; height: 58px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(255,255,255,.96);
  box-shadow: 0 8px 26px rgba(0,0,0,.45);
  transition: transform 320ms var(--ease), background 300ms var(--ease);
}
#mkapat:hover { transform: scale(1.05); }
#mkapat i {
  position: absolute; width: 22px; height: 4px; border-radius: 1px;
  background: #24241f;
}
#mkapat i:nth-child(1) { transform: rotate(45deg); }
#mkapat i:nth-child(2) { transform: rotate(-45deg); }
@media (max-width: 760px) {
  #mkapat { top: 12px; left: auto; right: 14px; width: 44px; height: 44px; }
  #mkapat i { width: 17px; height: 3px; }
}

/* dil anahtarı menünün dibinde */
#lang { display: flex; gap: 10px; align-items: baseline; margin-top: 30px; }
#lang button {
  font: inherit; font-size: var(--t-micro); letter-spacing: .06em;
  background: none; border: 0; padding: 6px 0; cursor: pointer; color: #6f6f76;
}
#lang button[aria-current="true"] { color: #fff; }
#lang .sep2 { color: #35353a; font-size: var(--t-micro); }

/* ── içerik paneli ───────────────────────────────────────────────────────── */

#shell {
  --k: 0px;                          /* katlanan köşenin boyu */
  transition: --k 640ms cubic-bezier(.2,.86,.24,1);
  /* Sayfa gölgesi panelde box-shadow olarak duramaz: clip-path onu da
     kırpar. drop-shadow kesilmiş silueti takip ediyor. */
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.16))
          drop-shadow(0 16px 26px rgba(0,0,0,.20));
  position: relative; z-index: 10;
  max-width: 1180px;
  margin: clamp(90px, 11vh, 150px) auto clamp(60px, 10vh, 130px);
  padding-inline: var(--shell-pad);
}
#panel {
  background: var(--panel);
  padding: clamp(28px, 4.4vw, 68px);
  min-height: 52vh;

  /* ── MENÜ AÇILIŞI: sayfanın SAĞ ÜST KÖŞESİ çevriliyor ──────────────────
     Menüyü açmak "bu sayfadan çıkıyorum" demek. Kitap sayfası da sağ üst
     köşesinden tutulup çevrilir — jest budur, başka bir yeri değil.

     İki deneme çöpe gitti, ikisi de aynı sebepten: hareketin fiziksel
     karşılığı yoktu. Önce sayfa menteşeden KAPI GİBİ arkaya dönüyordu;
     sonra sol kenarında gradyanla bir "kıvrım" beliriyordu. İkisi de
     boyanmış görünüyordu, katlanmış değil.

     Bu sefer geometri gerçek: köşedeki üçgen sayfadan KESİLİYOR (clip-path),
     altındaki tablo görünüyor. Katlanan parça o üçgenin kat çizgisine göre
     TAM AYNA görüntüsü — rotate(45deg) scaleY(-1) rotate(-45deg) birleşimi
     45°'lik doğruya göre yansımanın kendisidir, yaklaşık bir taklit değil:
     (W,0) köşesi tam olarak (W−k, k) noktasına düşer, kat çizgisi üstündeki
     iki nokta yerinde kalır. Bu yüzden kesik kenarla katlanan parçanın ağzı
     piksel piksel çakışır.

     Yüzeyi de boyalı değil: kagit.webp gerçek lif dokusu (frekans uzayında
     üretildiği için kusursuz döşenir), üstüne kat çizgisinde parlayıp uca
     doğru sönen ışık çarpılıyor. Gölge box-shadow olamazdı — clip-path onu
     kırpardı; drop-shadow kesilmiş şeklin kendisini takip ediyor. */
  clip-path: polygon(0 0, calc(100% - var(--k)) 0, 100% var(--k), 100% 100%, 0 100%);
}

/* katlanan köşe: kâğıdın arka yüzü */
#kivrim {
  position: absolute; top: 0; right: var(--shell-pad);
  width: var(--k); height: var(--k);
  z-index: 3; pointer-events: none;
  /* İki gölge: sıkı temas gölgesi + yumuşak ortam gölgesi. Tek gölge düz
     bir yapıştırma gibi duruyordu. */
  filter: drop-shadow(-3px 4px 4px rgba(0,0,0,.34))
          drop-shadow(-11px 14px 18px rgba(0,0,0,.24));
}
#kivrim i {
  position: absolute; inset: 0; display: block;
  clip-path: polygon(0 0, 100% 0, 100% 100%);
  transform-origin: 0 0;
  transform: rotate(45deg) scaleY(-1) rotate(-45deg);   /* kat çizgisine göre yansıma */
  background-image:
    /* Kat çizgisinde ışığın yakaladığı sırt (%50 tam kat yeridir), sonra
       kâğıdın arka yüzüne doğru hızlanan düşüş. Ölçülen eski düşüş 252→200
       idi; kâğıt gibi değil boyalı karton gibi duruyordu. */
    linear-gradient(45deg,
      #ffffff 50%, #fffdf6 53%, #f6f1e6 61%,
      #e2dac8 74%, #c3b9a1 87%, #a2977c 96%, #90856b 100%),
    url('assets/kagit.webp');
  background-size: 100% 100%, 128px 128px;
  background-blend-mode: multiply;
}

html.menuacik #shell { --k: clamp(96px, 15vw, 210px); }

/* menü satırları sırayla yükselsin */
#menu li, #menu .grouplbl {
  opacity: 0; transform: translateY(9px); transition-delay: 0ms;
  transition: opacity 420ms var(--ease), transform 420ms var(--ease);
}
#menu.open li, #menu.open .grouplbl {
  opacity: 1; transform: none; transition-delay: var(--d, 0ms);
}
.wordmark {
  font-size: clamp(20px, 1rem + 1.2vw, 26px); font-weight: 400;
  letter-spacing: .01em; color: var(--ink); margin-bottom: 34px; display: inline-block;
}
.wordmark b { font-weight: 400; }

/* ── eser bloğu ──────────────────────────────────────────────────────────── */

.work { margin-bottom: clamp(56px, 8vw, 104px); }
.work:last-child { margin-bottom: 0; }
.k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--tone); aspect-ratio: var(--ratio);
  width: min(100%, calc(78vh * var(--ratio)));
}
.k-lqip, .k-full { width: 100%; height: 100%; object-fit: cover; display: block; }
.k-full { position: absolute; inset: 0; opacity: 0; transition: opacity 400ms linear; }
.k-fig.is-loaded .k-full { opacity: 1; }

/* == ACILIS ================================================================
   Perde YOK. Giris sekansi koymak, ziyaretciyi esere gelmek icin bekletmek
   demek; hem alti bagimsiz inceleme hem tasarim olcutu bunu reddediyor.
   Acilis, icerigin KENDI gelis bicimi:

   1) Panel bir tabaka gibi yerine konuyor (tek ogede, 520 ms).
   2) Isik ilk tablonun uzerinden BIR KEZ geciyor - galeride isiklarin
      acilmasi. Menunun hareket dili de bu: once zemin kararir, sonra
      etiketler aydinlanir.

   Oturum basina BIR KEZ (sessionStorage). Her gezinmede toren olmaz.
   Hicbir sey opacity:0'da park etmiyor: sinif eklenmezse -JS calismazsa,
   hareket azaltma acikse- sayfa dogrudan durus halinde. */
html.acilis #shell {
  animation: acilisTabaka 560ms cubic-bezier(.2,.9,.25,1) both;
}
@keyframes acilisTabaka {

<script>
/*__SITE_DATA__*/
/*__KIT__*/

const panel = document.getElementById('panel');

/* ── dil ─────────────────────────────────────────────────────────────────── */

const LANGS = ['tr', 'en', 'fr'];
const LANG_KEY = 'cs-lang';

function initialLang() {
  try { const s = localStorage.getItem(LANG_KEY); if (LANGS.includes(s)) return s; } catch (e) {}
  const n = (navigator.language || '').slice(0, 2).toLowerCase();
  return LANGS.includes(n) ? n : 'tr';
}
let LANG = initialLang();
const L = () => SITE.i18n[LANG] || SITE.i18n.tr;
const t = (k) => (L().ui && L().ui[k]) || SITE.i18n.tr.ui[k] || k;
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
const upTR = (s) => s.toLocaleUpperCase('tr-TR');

/* ── zemin: iki katman, çapraz geçiş ─────────────────────────────────────── */

const BG = SITE.backdrops || {};
const bgEls = [document.getElementById('bgA'), document.getElementById('bgB')];
let bgTurn = 0, bgKey = null;

function setBackdrop(key) {
  const b = BG[key] || BG.acilis;
  if (!b || key === bgKey) return;
  bgKey = key;
  const next = bgEls[bgTurn % 2], prev = bgEls[(bgTurn + 1) % 2];
  next.style.backgroundImage = 'url(' + b.src + ')';
  next.classList.add('on');
  prev.classList.remove('on');
  bgTurn++;
  paintMenu(b.palette || []);
  paintBurger(b.src);
}

/* Menü satırlarının rengi o sayfanın zemininden geliyor — her satır ayrı ton. */
/* Hamburger doğrudan tablodan renk alıyordu ama baloncuklar almıyordu.
   Artık üçü de aynı paletten besleniyor: yazı, dolgu ve çerçeve. */
function hsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1)), l];
}

function paintMenu(pal) {
  document.querySelectorAll('#menu .nav-item').forEach((el, i) => {
    if (el.classList.contains('ozel') || el.classList.contains('cikis')) return;
    if (!pal.length) {
      el.style.color = '#e9e9e4';
      el.style.background = ''; el.style.borderColor = '';
      return;
    }
    const [h, sRaw] = hsl(pal[i % pal.length]);
    const sat = Math.min(sRaw, 0.40);
    const lig = 0.72 + ((i * 3) % 7) * 0.036;          /* satır satır ayrışsın */
    el.style.color       = 'hsl(' + h.toFixed(0) + ',' + (sat * 100).toFixed(0) + '%,' + (lig * 100).toFixed(0) + '%)';
    el.style.background  = 'hsla(' + h.toFixed(0) + ',' + (sat * 78).toFixed(0) + '%,26%,.30)';
    el.style.borderColor = 'hsla(' + h.toFixed(0) + ',' + (sat * 78).toFixed(0) + '%,58%,.30)';
    el.style.setProperty('--h', h.toFixed(0));
    el.style.setProperty('--s', (sat * 78).toFixed(0) + '%');
  });
}

/* Hamburger'in üç çubuğu: gerçek boyadan kesilmiş şeritler. */
function paintBurger(src) {
  document.querySelectorAll('#menubtn i').forEach((el) => {
    el.style.backgroundImage = 'url(' + src + ')';
  });
}

/* ── menü ────────────────────────────────────────────────────────────────── */

const menuEl = document.getElementById('menu');
const btn = document.getElementById('menubtn');
let trapRelease = null;

function menuModel() {
  const inGallery = location.hash.replace(/^#/, '').indexOf('/galeri') === 0;
  const items = [];
  if (inGallery) items.push({ href: '/', label: t('gal_exit'), cikis: true });
  items.push({ href: '/galeri', label: t('nav_gallery'), ozel: true });
  /* Showroom galerinin YANINDA: ikisi de eserlere açılan kapı, biri
     katalog biri gezilebilir salon. Salon katalogun dibinde duruyordu,
     kimse oraya kadar inmiyor. */
  if (SITE.salon) items.push({ href: '/salon', label: t('salon_lbl'), ozel: true });
  items.push({ sep: true });
  items.push({ href: '/son', label: t('nav_recent') });
  SITE.series.forEach(s => items.push({ href: '/seri/' + s.key, label: L().series[s.key].title, indent: true }));
  items.push({ group: t('nav_about_grp') });
  items.push({ href: '/atolye', label: t('nav_studio') });
  items.push({ href: '/biyografi', label: t('nav_bio') });
  items.push({ href: '/sergiler', label: t('nav_exh') });
  items.push({ href: '/koleksiyon', label: t('nav_coll') });
  items.push({ href: '/yayinlar', label: t('nav_pub') });
  items.push({ href: '/basin', label: t('nav_press') });
  items.push({ href: '/iletisim', label: t('nav_contact') });
  return items;
}

function buildMenu() {
  const kutu = document.getElementById('msol');
  kutu.innerHTML = '';
  const ul = K.el('ul');
  menuModel().forEach((it) => {
    const li = K.el('li');
    if (it.sep) { li.className = 'sep'; ul.appendChild(li); return; }
    if (it.group) { li.className = 'grouplbl'; li.textContent = it.group; ul.appendChild(li); return; }
    const a = K.el('a', 'nav-item' + (it.ozel ? ' ozel' : '') + (it.cikis ? ' cikis' : ''),
                   it.label);
    a.href = '#' + it.href;
    a.dataset.route = it.href;
    if (it.indent) a.style.paddingLeft = '26px';
    li.appendChild(a);
    ul.appendChild(li);
  });

  const lang = K.el('div');
  lang.id = 'lang';
  LANGS.forEach((code, i) => {
    if (i) lang.appendChild(K.el('span', 'sep2', '·'));
    const b = K.el('button', null, code.toUpperCase());
    b.type = 'button';
    b.setAttribute('aria-current', String(code === LANG));
    b.setAttribute('aria-label', SITE.i18n[code].ui.lang_name);
    b.addEventListener('click', () => setLang(code));
    lang.appendChild(b);
  });
  kutu.appendChild(ul);
  kutu.appendChild(lang);

  /* Satirlar sirayla netlessin: etiketlerin aydinlanmasi. */
  let n = 0;
  kutu.querySelectorAll('li, .grouplbl').forEach((el) => {
    if (el.classList.contains('sep')) return;
    el.style.setProperty('--d', (90 + (n++) * 34) + 'ms');
  });
  lang.style.setProperty('--d', (90 + n * 34) + 'ms');

  /* satir uzerine gelince karsilik sutunu degissin */
  kutu.querySelectorAll('a[data-route]').forEach((a) => {
    a.addEventListener('pointerenter', () => onizYaz(a.dataset.route));
    a.addEventListener('focus', () => onizYaz(a.dataset.route));
    a.addEventListener('click', (e) => {
      e.preventDefault();
      menuGit(a.dataset.route);
    });
  });
  kutu.addEventListener('pointerleave', () => onizYaz(null));

  const b = BG[bgKey] || BG.acilis;
  paintMenu((b && b.palette) || []);
}

/* == KARSILIK SUTUNU =======================================================
   Vitrin degil: her satirin turune gore karsiligini gosteriyor. Seri
   satirinda o serinin eseri, Sergiler'de surmekte olan sergi, Iletisim'de
   atolye satiri. 13 satirin 7'si metin sayfasi; saf vitrin yapilsaydi o
   yedisinde bos kalirdi, saf metin yapilsaydi ressamin isi menude hic
   gorunmezdi. */
const monEl = () => document.getElementById('mon');

function kisalt(x, n) {
  const t = String(x || '');
  return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t;
}

function seriEserleri(key) { return SITE.works.filter((w) => w.series === key); }
function yeniEser() { return SITE.works.slice().sort((a, b) => b.year - a.year)[0]; }

function onizlemeIcin(route) {
  const cv = (L().cv || SITE.cv || []);
  const yay = (L().publications || SITE.publications || []);
  const bas = (L().press || SITE.press || []);
  const yillar = SITE.works.map((w) => w.year);
  const aralik = Math.min(...yillar) + ' — ' + Math.max(...yillar);

  if (!route) {
    return { ust: SITE.artist.mark, ad: SITE.artist.name,
             alt: SITE.works.length + ' eser · ' + SITE.series.length + ' seri · ' + aralik,
             img: yeniEser() };
  }
  if (route === '/galeri') {
    return { ust: t('gal_label'), ad: t('gal_title'), alt: kisalt(t('gal_sub'), 150), img: yeniEser() };
  }
  if (route === '/salon') {
    return { ust: t('salon_lbl'), ad: t('salon_bas'), alt: kisalt(t('salon_alt'), 150),
             img: yeniEser() };
  }
  if (route === '/son') {
    return { ust: t('nav_recent'), ad: SITE.works.length + ' eser · ' + SITE.series.length + ' seri',
             alt: aralik + ' · ' + t('medium'), img: yeniEser() };
  }
  const m = route.match(/^\/seri\/(.+)$/);
  if (m) {
    const key = m[1];
    const base = K.seriesOf(key) || {};
    const cev = (L().series || {})[key] || base;
    const es = seriEserleri(key);
    return { ust: es.length + ' eser · ' + (base.years || ''), ad: cev.title || base.title,
             alt: kisalt(cev.blurb || base.blurb, 160), img: es[0] };
  }
  if (route === '/atolye')    return { ust: t('nav_studio'),  ad: kisalt((L().statement || SITE.statement || [''])[0], 62),
                                       alt: kisalt((L().statement || SITE.statement || ['', ''])[1] || '', 150) };
  if (route === '/biyografi') return { ust: t('nav_bio'), ad: SITE.artist.name,
                                       alt: kisalt((L().bio || SITE.bio || [''])[0], 165) };
  if (route === '/sergiler' && cv[0])
    return { ust: t('nav_exh') + ' · ' + cv[0][0], ad: cv[0][1], alt: cv[0][2] };
  if (route === '/koleksiyon') {
    const k = SITE.works.filter((w) => w.status === 'koleksiyonda').length;
    const kl = (L().collections || SITE.collections || []);
    return { ust: t('nav_coll'), ad: k + ' / ' + SITE.works.length, alt: kisalt(kl.slice(0, 3).join(' · '), 150) };
  }
  if (route === '/yayinlar' && yay[0])
    return { ust: t('nav_pub') + ' · ' + yay[0][0], ad: yay[0][1], alt: yay[0][2] };
  if (route === '/basin' && bas[0])
    return { ust: t('nav_press') + ' · ' + bas[0][0], ad: bas[0][1], alt: bas[0][2] };
  if (route === '/iletisim')
    return { ust: t('nav_contact'), ad: SITE.artist.email, alt: SITE.artist.studio };
  return { ust: SITE.artist.mark, ad: SITE.artist.name, alt: '', img: yeniEser() };
}

let onizSon = '\u0000';
function onizYaz(route, hemen) {
  const mon = monEl();
  if (!mon || route === onizSon) return;
  onizSon = route;
  const d = onizlemeIcin(route);
  /* Menu acilirken ilk yazim beklemesin: solma gecikmesi orada bosluk
     olarak goruluyordu. Capraz gecis yalniz satirdan satira gecerken. */
  const yaz = () => {
    const img = document.getElementById('mon-img');
    if (d.img) { img.hidden = false; img.src = d.img.src; img.alt = d.img.title; }
    else { img.hidden = true; img.removeAttribute('src'); }
    mon.classList.toggle('yazi-only', !d.img);
    document.getElementById('mon-ust').textContent = d.ust || '';
    document.getElementById('mon-ad').textContent = d.ad || '';
    document.getElementById('mon-alt').textContent = d.alt || '';
    mon.classList.remove('degisiyor');
  };
  if (hemen) return yaz();
  mon.classList.add('degisiyor');
  setTimeout(yaz, 170);
}

/* == GECIS ================================================================
   Tiklanan satirin gorseli, gidilen sayfanin ilk eserine DONUSEREK geciyor
   (View Transitions). Bakilan sey sayfanin kendisi oluyor; gecis bir kesme
   degil, surekli bir hareket. Desteklenmeyen tarayicida ayni gezinme
   gecissiz calisir. */
function menuGit(route) {
  const kaynak = document.getElementById('mon-img');
  const gorselli = kaynak && !kaynak.hidden;
  const uygula = () => {
    closeMenu();
    history.pushState(null, '', '#' + route);
    const r = K.Router.parse();
    r.fn(...r.args);
    const ilk = panel.querySelector('.k-fig');
    if (ilk) ilk.style.viewTransitionName = 'eser';
  };
  /* GEZINME ANIMASYONA BAGLI KALAMAZ. startViewTransition'in geri cagrisi
     baslamazsa (arka plan sekmesi, ust uste gecis, olculdu: donmus zaman
     cizelgesinde hic calismiyor) menu acik kalir ve tiklama hicbir sey
     yapmaz. Zaman asimi yedegi: 250 ms icinde gecis baslamadiysa gezinme
     yine de olur, yalnizca animasyon kaybolur. */
  let calisti = false;
  const birKez = () => { if (calisti) return; calisti = true; uygula(); };

  if (!document.startViewTransition || K.reduced()) return birKez();
  if (gorselli) kaynak.style.viewTransitionName = 'eser';
  let vt;
  try { vt = document.startViewTransition(birKez); }
  catch (e) { birKez(); return; }
  setTimeout(birKez, 250);
  vt.finished.catch(() => {}).then(() => {
    if (gorselli) kaynak.style.viewTransitionName = '';
    const ilk = panel.querySelector('.k-fig');
    if (ilk) ilk.style.viewTransitionName = '';
  });
}

function openMenu() {
  buildMenu();
  document.documentElement.classList.add('menuacik');
  onizSon = '\u0000';
  onizYaz(null, true);
  if (menuEl.showPopover) menuEl.showPopover();
  else { menuEl.classList.add('open'); trapRelease = K.trap(menuEl); }
  btn.setAttribute('aria-expanded', 'true');
  const first = menuEl.querySelector('a');
  if (first) first.focus({ preventScroll: true });
}
function closeMenu() {
  document.documentElement.classList.remove('menuacik');
  if (menuEl.hidePopover && menuEl.matches(':popover-open')) menuEl.hidePopover();
  menuEl.classList.remove('open');
  btn.setAttribute('aria-expanded', 'false');
  if (trapRelease) { trapRelease(); trapRelease = null; }
}
btn.addEventListener('click', () => menuEl.classList.contains('open') ? closeMenu() : openMenu());
document.getElementById('mkapat').addEventListener('click', closeMenu);
/* Esc, disina tiklama ve ust katman popover'dan geliyor; elle yazilmasina
   gerek yok. Yalnizca popover desteklenmeyen tarayicida yedek gerekiyor. */
if (!menuEl.showPopover) {
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
}
menuEl.addEventListener('toggle', (e) => {
  const acik = e.newState === 'open';
  btn.setAttribute('aria-expanded', acik ? 'true' : 'false');
  if (!acik) document.documentElement.classList.remove('menuacik');
});

function setLang(next) {
  if (!LANGS.includes(next) || next === LANG) return;
  LANG = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
  document.documentElement.lang = LANG;
  const d = document.querySelector('meta[name="description"]');
  if (d) d.setAttribute('content', t('meta_desc'));
  buildMenu();
  const r = K.Router.parse();
  r.fn(...r.args);
}

/* ── ortak parçalar ──────────────────────────────────────────────────────── */

function availLine(s) {
  return s === 'satilik' ? t('avail_studio') : s === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
}

function workBlock(w, opts = {}) {
  const d = K.el('figure', 'work');
  const fig = K.figure(w, opts);
  setTimeout(() => fig.classList.add('is-loaded'), 1200);
  d.appendChild(fig);
  const gloss = (L().works[w.id] || {}).gloss || '';
  const cap = K.el('figcaption', 'cap');
  cap.innerHTML =
    '<div class="t"><a href="#/eser/' + w.slug + '">' + w.title + '</a></div>' +
    (gloss ? '<div class="gloss">' + gloss + '</div>' : '') +
    '<div>' + w.year + '</div><div>' + t('medium') + '</div>' +
    '<div>' + w.size + ' | ' + w.sizeIn + '</div>';
  const av = K.el('div', 'avail'); av.textContent = availLine(w.status);
  cap.appendChild(av); d.appendChild(cap);
  return d;
}

function head() {
  const parts = SITE.artist.name.split(' ');
  const a = K.el('a', 'wordmark');
  a.href = '#/';
  a.innerHTML = parts[0] + ' <b>' + upTR(parts.slice(1).join(' ')) + '</b>';
  return a;
}

function shell(title) {
  panel.innerHTML = '';
  panel.appendChild(head());
  document.title = title ? title + ' — ' + SITE.artist.name
                         : SITE.artist.name + ' — ' + t('site_sub');
  scrollTo(0, 0);
}

function rowList(items) {
  const dl = K.el('dl', 'rows');
  items.forEach(([a, b, c]) => {
    const r = K.el('div', 'row');
    r.appendChild(K.el('dt', null, a));
    r.appendChild(K.el('dd', null, c ? '<b>' + b + '</b><span>' + c + '</span>' : b));
    dl.appendChild(r);
  });
  return dl;
}
const venueOf = (s) => s.split(' · ').slice(1).join(' · ') || s;

/* ── görünümler ──────────────────────────────────────────────────────────── */

function viewHome() {
  setBackdrop('acilis'); shell(null);
  const w = SITE.works.find(x => x.slug === 'dag-sirti') || SITE.works[0];
  panel.appendChild(workBlock(w, { eager: true }));

  const a = K.el('a', 'enter');
  a.href = '#/galeri';
  const img = new Image(); img.src = w.src; img.alt = '';
  const txt = K.el('div', 'txt');
  txt.innerHTML = '<div class="lbl">' + t('gal_label') + '</div>' +
                  '<div class="big">' + t('gal_title') + '</div>' +
                  '<div class="sub">' + t('gal_sub') + '</div>';
  a.append(img, txt);
  panel.appendChild(a);
}

function viewSon() {
  setBackdrop('son'); shell(t('nav_recent'));
  const lede = K.el('div', 'lede');
  lede.appendChild(K.el('h1', null, t('nav_recent')));
  lede.appendChild(K.el('p', null, fill(t('recent_lede'),
    { n: SITE.works.length, s: SITE.series.length })));
  panel.appendChild(lede);
  [...SITE.works].sort((a, b) => b.year - a.year)
    .forEach((w, i) => panel.appendChild(workBlock(w, { eager: i < 2 })));
}

function viewSeri(key) {
  const base = K.seriesOf(key);
  if (!base) return viewSon();
  setBackdrop('seri');
  const s = L().series[key] || base;
  shell(s.title);
  const lede = K.el('div', 'lede');
  lede.appendChild(K.el('h1', null, s.title));
  lede.appendChild(K.el('div', 'yr', base.years));
  lede.appendChild(K.el('p', null, s.blurb));
  panel.appendChild(lede);
  K.bySeries(key).forEach((w, i) => panel.appendChild(workBlock(w, { eager: i < 2 })));
}

/* ── TEK ESER SAYFASI ──────────────────────────────────────────────────
   Rota kit.js'in yorumunda belgelenmişti ve K.workBySlug yardımcısı da
   yazılmıştı, ama hiçbir sayfa kaydetmiyordu: bir eseri gösteren
   paylaşılabilir bir adres üretmek mümkün değildi. */
function viewEser(slug) {
  const w = K.workBySlug(decodeURIComponent(slug));
  if (!w) return viewSon();
  setBackdrop('seri'); shell(w.title);
  panel.appendChild(workBlock(w, { eager: true }));

  const kunye = K.el('div', 'page');
  const seri = (L().series[w.series] || K.seriesOf(w.series) || {}).title || '';
  const not = (L().works[w.id] || {}).note || w.note;
  const satir = [];
  if (seri) satir.push([t('lbl_series'), seri]);
  satir.push([t('lbl_year'), String(w.year)]);
  satir.push([t('lbl_medium'), t('medium')]);
  satir.push([t('lbl_size'), w.size + '  |  ' + w.sizeIn]);
  if (w.collection) satir.push([t('nav_coll'), w.collection + (w.collYear ? ', ' + w.collYear : '')]);
  kunye.appendChild(rowList(satir.map(([a, b]) => ['', a, b])));
  kunye.appendChild(K.el('p', null, '<span style="color:var(--muted)">“' + not + '”</span>'));
  kunye.appendChild(K.el('p', null,
    '<a class="mail" href="mailto:' + SITE.artist.email +
    '?subject=' + encodeURIComponent(SITE.artist.name + ' — ' + w.title + ', ' + w.year) +
    '">' + availLine(w.status) + ' · ' + SITE.artist.email + '</a>'));
  panel.appendChild(kunye);

  /* Ev ortami maketi: panelden yuklenen ikinci gorsel. Eserin YERINE
     gecmiyor, kunyeden sonra ayri bir kare olarak duruyor. Yoksa hic
     eklenmiyor -- bos bir cerceve birakmiyor. */
  if (w.ortam) {
    const o = K.el('figure', 'work');
    const im = new Image();
    im.src = w.ortam;
    im.alt = w.title + ' — ' + t('kare_ortam');
    im.loading = 'lazy'; im.decoding = 'async';
    im.style.width = '100%'; im.style.display = 'block';
    o.appendChild(im);
    o.appendChild(K.el('figcaption', 'cap', '<div>' + t('kare_ortam') + '</div>'));
    panel.appendChild(o);
  }
}

function textPage(bd, title, build) {
  setBackdrop(bd); shell(title);
  const p = K.el('div', 'page');
  p.appendChild(K.el('h1', null, title));
  build(p);
  panel.appendChild(p);
}

const viewAtolye = () => textPage('atolye', t('nav_studio'), (p) => {
  L().statement.forEach(x => p.appendChild(K.el('p', null, x)));
});

const viewBio = () => textPage('biyografi', t('nav_bio'), (p) => {
  p.appendChild(K.el('div', 'formula',
    fill(t('bio_born'), { y: SITE.artist.born, p: SITE.artist.birthplace }) + '<br>' +
    fill(t('bio_lives'), { c: SITE.artist.based })));
  L().bio.forEach(x => p.appendChild(K.el('p', null, x)));
});

const viewSergiler = () => textPage('sergiler', t('nav_exh'), (p) => {
  const solo = [], group = [];
  SITE.cv.forEach((r, i) => (r[2].startsWith('Kişisel') ? solo : group).push(L().cv[i]));
  p.appendChild(K.el('h2', null, t('exh_solo')));
  p.appendChild(rowList(solo.map(r => [r[0], r[1], venueOf(r[2])])));
  p.appendChild(K.el('h2', null, t('exh_group')));
  p.appendChild(rowList(group.map(r => [r[0], r[1], venueOf(r[2])])));
});

const viewKoleksiyon = () => textPage('koleksiyon', t('nav_coll'), (p) => {
  const ul = K.el('ul', 'plainlist');
  L().collections.forEach(c => ul.appendChild(K.el('li', null, c)));
  p.appendChild(ul);
  /* Sayım yalnızca GERÇEKTEN koleksiyonda olanları saysın: eskiden
     "satılık olmayan" hepsi sayılıyordu ve "ayrıldı" durumundaki eser de
     koleksiyondaymış gibi görünüyordu. Kayıt listesi ikisini de gösterir,
     ama her satır kendi durumunu söyler. */
  const held = SITE.works.filter(w => w.status !== 'satilik');
  const inColl = SITE.works.filter(w => w.status === 'koleksiyonda');
  p.appendChild(K.el('h2', null, t('coll_record')));
  p.appendChild(K.el('p', null, '<span style="font-size:var(--t-cap);color:var(--muted)">' +
    fill(t('coll_sentence'), { n: SITE.works.length, h: inColl.length }) + '</span>'));
  /* Provenans: hangi eser hangi koleksiyonda. Üstteki altı kurum adı
     hiçbir esere bağlı değildi. */
  p.appendChild(rowList(held.map(w => [
    String(w.year),
    w.title,
    w.size + '  |  ' + w.sizeIn + ' · ' +
      (w.collection ? w.collection + (w.collYear ? ', ' + w.collYear : '') : availLine(w.status)),
  ])));
});

const viewYayinlar = () => textPage('yayinlar', t('nav_pub'), (p) => p.appendChild(rowList(L().publications)));
const viewBasin    = () => textPage('basin',    t('nav_press'), (p) => p.appendChild(rowList(L().press)));

const viewIletisim = () => textPage('iletisim', t('nav_contact'), (p) => {
  p.appendChild(K.el('p', null, '<a class="mail" href="mailto:' + SITE.artist.email +
    '">' + SITE.artist.email + '</a>'));
  p.appendChild(K.el('p', null, '<span style="color:var(--muted)">' + SITE.artist.studio + '</span>'));
  p.appendChild(K.el('p', null, t('contact_body')));
  p.appendChild(K.el('div', 'note', L().notice + ' ' + SITE.works[0].credit));
});

/* Galeri ayrı bir sayfa: WebGL yalnızca oraya girenlere yükleniyor. */
const viewGaleri = () => { location.href = 'sergi.html'; };
/* Salon da sergi sayfasında yaşıyor: tek uygulama, tek bakım noktası. */
const viewSalon = () => { location.href = 'sergi.html#/salon'; };

/* ── yönlendirme ─────────────────────────────────────────────────────────── */

/* Acilis oturumda bir kez: sekmeyi ilk actiginda. Sayfalar arasi
   gezinmede tekrarlamiyor. */
try {
  if (!sessionStorage.getItem('cs-acildi')) {
    sessionStorage.setItem('cs-acildi', '1');
    document.documentElement.classList.add('acilis');
    setTimeout(() => document.documentElement.classList.remove('acilis'), 2200);
  }
} catch (e) { /* gizli sekmede sessionStorage yazilamaz; acilis atlanir */ }

document.documentElement.lang = LANG;
buildMenu();

K.Router
  .on(/^\/$/,           viewHome)
  .on(/^\/galeri$/,     viewGaleri)
  .on(/^\/salon$/,      viewSalon)
  .on(/^\/son$/,        viewSon)
  .on(/^\/seri\/(.+)$/, viewSeri)
  .on(/^\/eser\/(.+)$/, viewEser)
  .on(/^\/atolye$/,     viewAtolye)
  .on(/^\/biyografi$/,  viewBio)
  .on(/^\/sergiler$/,   viewSergiler)
  .on(/^\/koleksiyon$/, viewKoleksiyon)
  .on(/^\/yayinlar$/,   viewYayinlar)
  .on(/^\/basin$/,      viewBasin)
  .on(/^\/iletisim$/,   viewIletisim)
  .start();
</script>
