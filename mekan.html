<style>
/* Sayfalar arasi gecis. Galeri ayri bir HTML dosyasi oldugu icin
   tiklayinca tam sayfa yenilemesi oluyordu: beyaz bir sicrama ve
   "baska bir siteye gittim" hissi. Bu iki satir, destekleyen
   tarayicida gecisi capraz sonmeye ceviriyor. Desteklemeyen
   tarayicida hicbir sey degismiyor - sayfa eskisi gibi aciliyor. */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) {
  animation-duration: 260ms;
}

@property --k {          /* kayıtsız özel değişken geçişlenemez */
  syntax: '<length>';
  inherits: true;
  initial-value: 0px;
}
/* ═══════════════════════════════════════════════════════════════════════════
   MEKÂN — ressamın kendi boyası zemin, içerik onun üstünde beyaz panel.
   Menü düğmesi düz bir ikon değil: üç çubuğun her biri gerçek bir tablodan
   kesilmiş boya şeridi. Menü satırlarının rengi o sayfanın zemininden alınır.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --shell-pad: clamp(12px, 3vw, 28px);
  --ink:    #111111;
  --muted:  #4a4a4a;
  --soft:   #6a6a6a;
  --line:   #dcdcdc;
  /* Eskiden #1B3FCC idi — tarayıcının varsayılan mavisi. Bu kadar ölçülü
     bir palette rengi ayarlanmamış tek unsurdu ve sırıtıyordu. Bronz,
     eser adının siena tonuyla (--title) karışmayacak kadar uzak. */
  --link:   #5f5326;
  --title:  #7a3418;
  --panel:  #ffffff;

  --pad:    clamp(24px, 4vw, 56px);
  --sans:   "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif:  "Cormorant Garamond", Garamond, "EB Garamond", Georgia, serif;
  --ease:   cubic-bezier(.19, 1, .22, 1);

  --t-h1:    clamp(22px, 1.1rem + 1.1vw, 30px);
  --t-h2:    17px;
  --t-body:  15px;
  --t-cap:   12px;
  --t-micro: 11px;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: #17161a; }

body {
  overscroll-behavior-y: none;   /* lastik-bant sabit zemini oynatmasın */
  margin: 0;
  color: var(--ink);
  font: 400 var(--t-body)/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
  min-height: 100vh;
}

h1, h2, h3, p, figure, ul, li, dl, dd, dt { margin: 0; }
ul { padding: 0; list-style: none; }
img { display: block; max-width: 100%; }
a, a:visited { color: var(--ink); text-decoration: none; }
a:hover { color: var(--link); }
.mail { border-bottom: 1px solid var(--line); padding-bottom: 1px; }
.mail:hover { border-color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }

/*__KABUK_CSS__*/
.wordmark {
  /* Serif: galeri sayfasıyla aynı ses. Sanatçının adı iki sayfada iki
     ayrı yazı tipiyle yazılıyordu. */
  font-family: var(--serif);
  font-size: clamp(24px, 1.1rem + 1.5vw, 32px); font-weight: 400;
  letter-spacing: .005em; color: var(--ink); margin-bottom: 34px; display: inline-block;
}
.wordmark b { font-weight: 400; }

/* ── eser bloğu ──────────────────────────────────────────────────────────── */

/* Hero: salonun genel gorunusu. Genislik/yukseklik nitelikleri
   yaziliyor ki gorsel inmeden once yeri ayrilsin -- yoksa sayfa
   yuklenirken altindaki her sey ziplar. */
.hero { margin: 0 0 clamp(48px, 7vw, 88px); }
.hero img { display: block; width: 100%; height: auto; }

.work { margin-bottom: clamp(56px, 8vw, 104px); }
.work:last-child { margin-bottom: 0; }
.k-fig {
  position: relative; display: block; overflow: hidden;
  background: var(--tone); aspect-ratio: var(--ratio);
  width: min(100%, calc(78vh * var(--ratio)));
}
.k-lqip, .k-full { width: 100%; height: 100%; object-fit: cover; display: block; }
.k-full { position: absolute; inset: 0; opacity: 0; transition: opacity 400ms linear; }
.k-fig.is-loaded .k-full { opacity: 1; }

/* == ACILIS ================================================================
   Perde YOK. Giris sekansi koymak, ziyaretciyi esere gelmek icin bekletmek
   demek; hem alti bagimsiz inceleme hem tasarim olcutu bunu reddediyor.
   Acilis, icerigin KENDI gelis bicimi:

   1) Panel bir tabaka gibi yerine konuyor (tek ogede, 520 ms).
   2) Isik ilk tablonun uzerinden BIR KEZ geciyor - galeride isiklarin
      acilmasi. Menunun hareket dili de bu: once zemin kararir, sonra
      etiketler aydinlanir.

   Oturum basina BIR KEZ (sessionStorage). Her gezinmede toren olmaz.
   Hicbir sey opacity:0'da park etmiyor: sinif eklenmezse -JS calismazsa,
   hareket azaltma acikse- sayfa dogrudan durus halinde. */
html.acilis #shell {
  animation: acilisTabaka 560ms cubic-bezier(.2,.9,.25,1) both;
}
@keyframes acilisTabaka {
  /* SADECE yukselme, opaklik YOK. opacity:0'dan baslasaydi animasyon
     donan bir baglamda (arka plan sekmesi) icerik gorunmez kalirdi;
     hicbir sey animasyonun calismasina bagli olmamali. */
  from { translate: 0 16px; }
}
html.acilis #panel .k-fig::after {
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: linear-gradient(102deg,
    transparent 32%, rgba(255,246,224,.34) 48%, transparent 66%);
  translate: -130% 0;
  animation: acilisIsik 1400ms 420ms cubic-bezier(.32,0,.2,1) both;
}
@keyframes acilisIsik { to { translate: 130% 0; } }

@media (prefers-reduced-motion: reduce) {
  html.acilis #shell,
  html.acilis #panel .k-fig::after { animation: none; }
  html.acilis #panel .k-fig::after { content: none; }
}

.cap { margin-top: 13px; font-size: var(--t-cap); line-height: 1.6; color: var(--muted); }
/* Eser adı: galeri kataloğundaki gibi serif ve versal DEĞİL. Ana
   sayfada "ESER 1", galeride "Eser 1" yazıyordu. */
.cap .t {
  font-family: var(--serif); font-size: 19px; line-height: 1.2;
  color: var(--title); letter-spacing: 0;
}
.cap .gloss { color: var(--soft); font-style: italic; }
.cap .avail { margin-top: 10px; color: var(--soft); }

/* ── metin sayfaları ─────────────────────────────────────────────────────── */

.page { max-width: 34em; }
.page h1, .lede h1 {
  font-family: var(--serif);
  font-size: var(--t-h1); font-weight: 300; line-height: 1.2;
  letter-spacing: -.005em; margin-bottom: 24px;
}
.page h2 {
  font-family: var(--serif);
  font-size: var(--t-h2); font-weight: 400; margin: 40px 0 15px;
}
/* Eskiden :first-of-type idi — h2 sayfanın ilk h2'si olduğu için üst
   boşluğu siliniyordu, oysa Koleksiyonlar'da araya bir liste giriyor ve
   "Kayıt" başlığı listenin son satırına yapışıyordu. Boşluk yalnızca h2
   gerçekten h1'in hemen ardındaysa silinmeli. */
.page h1 + h2 { margin-top: 0; }
.page p { margin-bottom: 15px; }
.page .formula { font-size: var(--t-h2); line-height: 1.5; margin-bottom: 24px; }
.lede { max-width: 34em; margin-bottom: 38px; }
.lede h1 { margin-bottom: 9px; }
.lede .yr { font-size: var(--t-micro); color: var(--soft); margin-bottom: 11px; }
.lede p { font-size: var(--t-cap); line-height: 1.65; color: var(--muted); }

.rows { margin-bottom: 8px; }
.row {
  display: grid; grid-template-columns: 56px 1fr; gap: 16px;
  font-size: var(--t-cap); line-height: 1.6; color: var(--muted); padding-bottom: 12px;
}
.row dt { color: var(--soft); font-variant-numeric: tabular-nums; }
.row b { font-weight: 400; color: var(--ink); }
.row span { display: block; }
.plainlist li { font-size: var(--t-cap); line-height: 1.7; color: var(--muted); }
.note {
  margin-top: 44px; font-size: var(--t-micro); line-height: 1.65; color: var(--soft);
  border-top: 1px solid var(--line); padding-top: 15px;
}

/* ── galeriye giriş kartı ────────────────────────────────────────────────── */

.enter {
  display: block; position: relative; overflow: hidden;
  margin-top: 34px; color: #fff; text-decoration: none;
  min-height: clamp(200px, 30vw, 320px);
  background: #0b0b0d;
}
.enter img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .52;
             transition: transform 900ms var(--ease), opacity 600ms var(--ease); }
.enter:hover img { transform: scale(1.03); opacity: .62; }
.enter .txt {
  position: relative; padding: clamp(24px, 3.4vw, 44px);
  display: grid; gap: 8px; align-content: end; min-height: inherit;
}
.enter .lbl { font-size: var(--t-micro); letter-spacing: .16em; text-transform: uppercase; opacity: .8; }
.enter .big { font-size: clamp(24px, 1.2rem + 1.6vw, 38px); line-height: 1.15; color: #fff; }
.enter .sub { font-size: var(--t-cap); opacity: .82; max-width: 34em; }

@media (max-width: 760px) {
  /* Telefonda düğme küçük: 44px hâlâ rahat bir dokunma hedefi ama ekranın
     köşesinde bir rozet gibi durmuyor. Çubuk aralığı 7px olduğu için
     çarpı hâlindeki kayma da 7px. */
  #menubtn { width: 44px; height: 44px; padding: 13px 11px; gap: 4px;
             box-shadow: 0 2px 12px rgba(0,0,0,.24); }
  #menubtn i { height: 3px; }
  #menubtn[aria-expanded="true"] i:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  #menubtn[aria-expanded="true"] i:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  #shell { margin-top: 74px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>

<noscript>
  <div style="position:relative;z-index:10;max-width:34em;margin:120px auto;background:#fff;padding:40px;font:400 15px/1.55 Helvetica,Arial,sans-serif">
    <h1 style="font-size:26px;font-weight:400;margin:0 0 18px">Cemal Sağlam — Resim</h1>
    <p style="margin:0 0 14px">Tuval üzerine yağlı boya. İstanbul Bomonti’deki atölyede üretiliyor.</p>
    <p style="margin:0">Eserleri görüntülemek için JavaScript gerekiyor. <a href="mailto:atolye@cemalsaglam.com">atolye@cemalsaglam.com</a></p>

<script>
/*__SITE_DATA__*/
/*__KIT__*/

const panel = document.getElementById('panel');

/* Kabuk ile bu sayfa arasindaki sozlesme. kabuk.js dil, zemin, hamburger
   ve menuyu kuruyor; gezinme ve yeniden cizim sayfaya ait. */
window.KABUK = {
  sayfa: 'mekan',
  oniz: (route, hemen) => { if (hemen) onizSon = '\u0000'; onizYaz(route, hemen); },
  git: (route) => {
    history.pushState(null, '', '#' + route);
    const r = K.Router.parse();
    r.fn(...r.args);
    const ilk = panel.querySelector('.k-fig');
    if (ilk) ilk.style.viewTransitionName = 'eser';
  },
  gecisBitti: () => {
    const ilk = panel.querySelector('.k-fig');
    if (ilk) ilk.style.viewTransitionName = '';
  },
  yenile: () => { const r = K.Router.parse(); r.fn(...r.args); },
};

/*__KABUK_JS__*/





/* ── ortak parçalar ──────────────────────────────────────────────────────── */

function availLine(s) {
  /* Bos durum bir durum DEGIL. Eskiden son dala dusup "Ayrildi" yaziyordu;
     kunyesi henuz girilmemis esere satilmis damgasi vurmak yanlis. */
  if (!s) return '';
  return s === 'satilik' ? t('avail_studio') : s === 'koleksiyonda' ? t('avail_private') : t('avail_gone');
}

function workBlock(w, opts = {}) {
  const d = K.el('figure', 'work');
  const fig = K.figure(w, opts);
  setTimeout(() => fig.classList.add('is-loaded'), 1200);
  d.appendChild(fig);
  const gloss = (L().works[w.id] || {}).gloss || '';
  const cap = K.el('figcaption', 'cap');
  /* Eksik alanlar basilmiyor: yil 0, olcu bos. */
  cap.innerHTML =
    '<div class="t"><a href="#/eser/' + w.slug + '">' + w.title + '</a></div>' +
    (gloss ? '<div class="gloss">' + gloss + '</div>' : '') +
    (w.year ? '<div>' + w.year + '</div>' : '') +
    '<div>' + t('medium') + '</div>' +
    (w.size ? '<div>' + w.size + ' | ' + w.sizeIn + '</div>' : '');
  const av = K.el('div', 'avail'); av.textContent = availLine(w.status);
  cap.appendChild(av); d.appendChild(cap);
  return d;
}

function head() {
  const parts = SITE.artist.name.split(' ');
  const a = K.el('a', 'wordmark');
  a.href = '#/';
  /* Soyadi BUYUK HARFE cevrilmiyordu artik: ana sayfa "Cemal SAĞLAM",
     menu ve galeri "Cemal Sağlam" yaziyordu. Serif dizgide versal
     soyad ayrica agir duruyor. Tek yazim. */
  a.innerHTML = parts[0] + ' <b>' + parts.slice(1).join(' ') + '</b>';
  return a;
}

function shell(title) {
  panel.innerHTML = '';
  panel.appendChild(head());
  document.title = title ? title + ' — ' + SITE.artist.name
                         : SITE.artist.name + ' — ' + t('site_sub');
  scrollTo(0, 0);
}

function rowList(items) {
  const dl = K.el('dl', 'rows');
  items.forEach(([a, b, c]) => {
    const r = K.el('div', 'row');
    r.appendChild(K.el('dt', null, a));
    r.appendChild(K.el('dd', null, c ? '<b>' + b + '</b><span>' + c + '</span>' : b));
    dl.appendChild(r);
  });
  return dl;
}
const venueOf = (s) => s.split(' · ').slice(1).join(' · ') || s;

/* ── görünümler ──────────────────────────────────────────────────────────── */

function viewHome() {
  setBackdrop('acilis'); shell(null);

  /* Hero: salonun genel gorunusu -- sekiz eserin tamami tek mekanda.
     Onceden tek eserin oda kurgusuydu ve AYNI gorsel sayfada uc kez
     cikiyordu: hero, giris kartinin arka plani, menu onizlemesi.
     (Eski kodda `slug === 'dag-sirti'` aramasi da olu koddu -- o eser
     silineli yok, arama hep bos donup yedege dusuyordu.) */
  const w = SITE.works.find(x => x.ortam) || SITE.works[0];
  if (SITE.hero) {
    const f = K.el('figure', 'hero');
    const hi = new Image();
    hi.src = SITE.hero.src;
    if (SITE.hero.srcset) { hi.srcset = SITE.hero.srcset; hi.sizes = '100vw'; }
    if (SITE.hero.en) { hi.width = SITE.hero.en; hi.height = SITE.hero.boy; }
    hi.alt = t('hero_alt');
    hi.decoding = 'async';
    hi.loading = 'eager';
    hi.fetchPriority = 'high';
    f.appendChild(hi);
    panel.appendChild(f);
  } else {
    panel.appendChild(workBlock(w, { eager: true, src: w.ortam,
                                     ratio: w.ortamRatio }));
  }

  const a = K.el('a', 'enter');
  a.href = '#/galeri';
  /* Giris kartinin zemini hero'dan FARKLI olmali: ikisi ayni gorselken
     sayfa kendini tekrar ediyordu. */
  const a2 = SITE.works.find(x => x.ortam && x.ortam !== (SITE.hero || {}).src)
             || w;
  const img = new Image(); img.src = a2.ortam || a2.src; img.alt = '';
  const txt = K.el('div', 'txt');
  txt.innerHTML = '<div class="lbl">' + t('gal_label') + '</div>' +
                  '<div class="big">' + t('gal_title') + '</div>' +
                  '<div class="sub">' + t('gal_sub') + '</div>';
  a.append(img, txt);
  panel.appendChild(a);
}

function viewSon() {
  setBackdrop('son'); shell(t('nav_recent'));
  const lede = K.el('div', 'lede');
  lede.appendChild(K.el('h1', null, t('nav_recent')));
  lede.appendChild(K.el('p', null, fill(t('recent_lede'),
    { n: SITE.works.length, s: SITE.series.length })));
  panel.appendChild(lede);
  [...SITE.works].sort((a, b) => b.year - a.year)
    .forEach((w, i) => panel.appendChild(workBlock(w, { eager: i < 2 })));
}

function viewSeri(key) {
  const base = K.seriesOf(key);
  if (!base) return viewSon();
  setBackdrop('seri');
  const s = L().series[key] || base;
  shell(s.title);
  const lede = K.el('div', 'lede');
  lede.appendChild(K.el('h1', null, s.title));
  lede.appendChild(K.el('div', 'yr', base.years));
  lede.appendChild(K.el('p', null, s.blurb));
  panel.appendChild(lede);
  K.bySeries(key).forEach((w, i) => panel.appendChild(workBlock(w, { eager: i < 2 })));
}

/* ── TEK ESER SAYFASI ──────────────────────────────────────────────────
   Rota kit.js'in yorumunda belgelenmişti ve K.workBySlug yardımcısı da
   yazılmıştı, ama hiçbir sayfa kaydetmiyordu: bir eseri gösteren
   paylaşılabilir bir adres üretmek mümkün değildi. */
function viewEser(slug) {
  const w = K.workBySlug(decodeURIComponent(slug));
  if (!w) return viewSon();
  setBackdrop('seri'); shell(w.title);
  panel.appendChild(workBlock(w, { eager: true }));

  const kunye = K.el('div', 'page');
  const seri = (L().series[w.series] || K.seriesOf(w.series) || {}).title || '';
  const not = (L().works[w.id] || {}).note || w.note;
  const satir = [];
  if (seri) satir.push([t('lbl_series'), seri]);
  if (w.year) satir.push([t('lbl_year'), String(w.year)]);
  satir.push([t('lbl_medium'), t('medium')]);
  if (w.size) satir.push([t('lbl_size'), w.size + '  |  ' + w.sizeIn]);
  if (w.collection) satir.push([t('nav_coll'), w.collection + (w.collYear ? ', ' + w.collYear : '')]);
  kunye.appendChild(rowList(satir.map(([a, b]) => ['', a, b])));
  kunye.appendChild(K.el('p', null, '<span style="color:var(--muted)">“' + not + '”</span>'));
  kunye.appendChild(K.el('p', null,
    '<a class="mail" href="mailto:' + SITE.artist.email +
    '?subject=' + encodeURIComponent(SITE.artist.name + ' — ' + w.title +
                                    (w.year ? ', ' + w.year : '')) +
    '">' + availLine(w.status) + ' · ' + SITE.artist.email + '</a>'));
  panel.appendChild(kunye);

  /* Ev ortami maketi: panelden yuklenen ikinci gorsel. Eserin YERINE
     gecmiyor, kunyeden sonra ayri bir kare olarak duruyor. Yoksa hic
     eklenmiyor -- bos bir cerceve birakmiyor. */
  if (w.ortam) {
    const o = K.el('figure', 'work');
    const im = new Image();
    im.src = w.ortam;
    im.alt = w.title + ' — ' + t('kare_ortam');
    im.loading = 'lazy'; im.decoding = 'async';
    im.style.width = '100%'; im.style.display = 'block';
    o.appendChild(im);
    o.appendChild(K.el('figcaption', 'cap', '<div>' + t('kare_ortam') + '</div>'));
    panel.appendChild(o);
  }
}

function textPage(bd, title, build) {
  setBackdrop(bd); shell(title);
  const p = K.el('div', 'page');
  p.appendChild(K.el('h1', null, title));
  build(p);
  panel.appendChild(p);
}

const viewAtolye = () => textPage('atolye', t('nav_studio'), (p) => {
  L().statement.forEach(x => p.appendChild(K.el('p', null, x)));
});

const viewBio = () => textPage('biyografi', t('nav_bio'), (p) => {
  p.appendChild(K.el('div', 'formula',
    fill(t('bio_born'), { y: SITE.artist.born, p: SITE.artist.birthplace }) + '<br>' +
    fill(t('bio_lives'), { c: SITE.artist.based })));
  L().bio.forEach(x => p.appendChild(K.el('p', null, x)));
});

const viewSergiler = () => textPage('sergiler', t('nav_exh'), (p) => {
  const solo = [], group = [];
  SITE.cv.forEach((r, i) => (r[2].startsWith('Kişisel') ? solo : group).push(L().cv[i]));
  p.appendChild(K.el('h2', null, t('exh_solo')));
  p.appendChild(rowList(solo.map(r => [r[0], r[1], venueOf(r[2])])));
  p.appendChild(K.el('h2', null, t('exh_group')));
  p.appendChild(rowList(group.map(r => [r[0], r[1], venueOf(r[2])])));
});

const viewKoleksiyon = () => textPage('koleksiyon', t('nav_coll'), (p) => {
  const ul = K.el('ul', 'plainlist');
  L().collections.forEach(c => ul.appendChild(K.el('li', null, c)));
  p.appendChild(ul);
  /* Sayım yalnızca GERÇEKTEN koleksiyonda olanları saysın: eskiden
     "satılık olmayan" hepsi sayılıyordu ve "ayrıldı" durumundaki eser de
     koleksiyondaymış gibi görünüyordu. Kayıt listesi ikisini de gösterir,
     ama her satır kendi durumunu söyler. */
  const held = SITE.works.filter(w => w.status !== 'satilik');
  const inColl = SITE.works.filter(w => w.status === 'koleksiyonda');
  p.appendChild(K.el('h2', null, t('coll_record')));
  p.appendChild(K.el('p', null, '<span style="font-size:var(--t-cap);color:var(--muted)">' +
    fill(t('coll_sentence'), { n: SITE.works.length, h: inColl.length }) + '</span>'));
  /* Provenans: hangi eser hangi koleksiyonda. Üstteki altı kurum adı
     hiçbir esere bağlı değildi. */
  p.appendChild(rowList(held.map(w => [
    String(w.year),
    w.title,
    w.size + '  |  ' + w.sizeIn + ' · ' +
      (w.collection ? w.collection + (w.collYear ? ', ' + w.collYear : '') : availLine(w.status)),
  ])));
});

const viewYayinlar = () => textPage('yayinlar', t('nav_pub'), (p) => p.appendChild(rowList(L().publications)));
const viewBasin    = () => textPage('basin',    t('nav_press'), (p) => p.appendChild(rowList(L().press)));

const viewIletisim = () => textPage('iletisim', t('nav_contact'), (p) => {
  p.appendChild(K.el('p', null, '<a class="mail" href="mailto:' + SITE.artist.email +
    '">' + SITE.artist.email + '</a>'));
  p.appendChild(K.el('p', null, '<span style="color:var(--muted)">' + SITE.artist.studio + '</span>'));
  p.appendChild(K.el('p', null, t('contact_body')));
  /* Kredi artik bos: gorseller ressamin KENDI eserleri, kamu mali degil. */
  p.appendChild(K.el('div', 'note',
    [L().notice, SITE.works[0].credit].filter(Boolean).join(' ')));
});

/* Galeri ayrı bir sayfa: WebGL yalnızca oraya girenlere yükleniyor. */
const viewGaleri = () => { location.href = 'galeri/'; };

/* ── yönlendirme ─────────────────────────────────────────────────────────── */

/* Acilis oturumda bir kez: sekmeyi ilk actiginda. Sayfalar arasi
   gezinmede tekrarlamiyor. */
try {
  if (!sessionStorage.getItem('cs-acildi')) {
    sessionStorage.setItem('cs-acildi', '1');
    document.documentElement.classList.add('acilis');
    setTimeout(() => document.documentElement.classList.remove('acilis'), 2200);
  }
} catch (e) { /* gizli sekmede sessionStorage yazilamaz; acilis atlanir */ }

document.documentElement.lang = LANG;
buildMenu();

K.Router
  .on(/^\/$/,           viewHome)
  .on(/^\/galeri$/,     viewGaleri)
  .on(/^\/son$/,        viewSon)
  .on(/^\/seri\/(.+)$/, viewSeri)
  .on(/^\/eser\/(.+)$/, viewEser)
  .on(/^\/atolye$/,     viewAtolye)
  .on(/^\/biyografi$/,  viewBio)
  .on(/^\/sergiler$/,   viewSergiler)
  .on(/^\/koleksiyon$/, viewKoleksiyon)
  .on(/^\/yayinlar$/,   viewYayinlar)
  .on(/^\/basin$/,      viewBasin)
  .on(/^\/iletisim$/,   viewIletisim)
  .start();
</script>
